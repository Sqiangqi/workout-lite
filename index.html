<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>Workout Lite</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Workout Lite"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#14284b"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"></head><body>
<title>Workout Lite</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column; sticky day header, tabbed views, rest timer docked to the bottom edge like a gym plate rack. */
:root {
  /* Michigan blue and maize */
  --brand: #14284b;        /* logo navy (Michigan navy was #00274C): header band, both themes */
  --gold: #d8b072;         /* champagne gold from the logo (user, 2026-10-31 trial; maize was #ffcb05): primary buttons, chart points */
  --gold-ink: #14284b;
  --gold-rgb: 216,176,114; --brand-rgb: 20,40,75; --gold-hi: #f6e3b8;   /* colour themes swap these */
  --on-brand: #ffffff;
  --on-brand-muted: #b8c4d3;
  --on-brand-warn: #f0d6a2;
  --on-brand-bad: #ff9d93;
  --bg: #eef1f5;
  --surface: #ffffff;
  --ink: #0f1d2e;
  --muted: #56657a;
  --line: #d3dae3;
  --accent: #14284b;
  --accent-ink: #ffffff;
  --accent-soft: #e3eaf3;
  --lighter: #98a4b3;      /* grey dots for lighter sets */
  --good: #2f7d4f;
  --warn: #a2560a;
  --bad: #b3261e;
  --push: #3d6fb6; --pull: #6b7480; --legs: #b38a12; --core: #7a5aa6;
  --font-display: "Barlow Condensed", "Arial Narrow", "PingFang SC", "Noto Sans SC", sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1420; --surface: #13202f; --ink: #e8edf3; --muted: #9aa8b8; --line: #263548;
  --accent: #d8b072; --accent-ink: #14284b; --accent-soft: #2e2716; --lighter: #6c7a8c;
  --good: #6cc391; --warn: #e6a35a; --bad: #f08a80;
  --push: #7ea6e0; --pull: #a3acb6; --legs: #e0bd52; --core: #b79ae0;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b1420; --surface: #13202f; --ink: #e8edf3; --muted: #9aa8b8; --line: #263548;
  --accent: #d8b072; --accent-ink: #14284b; --accent-soft: #2e2716; --lighter: #6c7a8c;
  --good: #6cc391; --warn: #e6a35a; --bad: #f08a80;
  --push: #7ea6e0; --pull: #a3acb6; --legs: #e0bd52; --core: #b79ae0;
  color-scheme: dark; }

html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.4; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--brand); }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--brand); color: var(--on-brand); border-bottom: 3px solid var(--gold); }
header.top .wrap { padding-block: 12px 14px; display: grid; gap: 6px; }   /* room above the gold line */
.hrow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { width: 54px; height: 54px; flex: none; }
.day { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: .01em; text-transform: uppercase; line-height: 1.05; }
.day small { display: block; font-size: 15px; font-weight: 500; color: var(--muted); letter-spacing: .04em; }
.dline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sync { font-family: var(--font-body); font-size: 11px; font-weight: 500; letter-spacing: 0; text-transform: none; line-height: 1.3; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.sync.ok { color: var(--good); border-color: currentColor; }
.sync.busy { color: var(--warn); border-color: currentColor; }
.sync.err { color: var(--bad); border-color: currentColor; }
header.top .day small { color: var(--gold); }
header.top .sync { color: var(--on-brand-muted); border-color: var(--on-brand-muted); }
header.top .sync.ok { color: var(--gold); border-color: var(--gold); }
header.top .sync.busy { color: var(--on-brand-warn); border-color: var(--on-brand-warn); }
header.top .sync.err { color: var(--on-brand-bad); border-color: var(--on-brand-bad); }
header.top :focus-visible { outline-color: var(--gold); }

main .wrap { padding-block: 14px 170px; display: grid; gap: 12px; }
body.no-timer main .wrap { padding-bottom: 40px; }
.notice { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--warn); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 8px; }
.notice.err { border-left-color: var(--bad); }
.notice .acts { display: flex; gap: 8px; flex-wrap: wrap; }

/* Exercise card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; }
.card.warm { padding-block: 10px; }
.chead { display: flex; gap: 10px; align-items: flex-start; }
.chead .titles { flex: 1; min-width: 0; display: grid; gap: 2px; }
.ex-name { position: relative; display: inline-block; font-family: var(--font-display); font-weight: 600; font-size: 21px; line-height: 1.1; }
.ex-name.has-tip { cursor: help; text-decoration: underline dotted var(--muted); text-underline-offset: 4px; text-decoration-thickness: 1px; }
.tip { display: none; position: absolute; left: 0; top: calc(100% + 6px); z-index: 4; width: min(340px, 80vw); background: var(--ink); color: var(--surface); font-family: var(--font-body); font-size: 14px; font-weight: 400; line-height: 1.5; padding: 10px 12px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.25); white-space: normal; }
@media (hover: hover) { .ex-name.has-tip:hover .tip { display: block; } }
.ex-name.open .tip { display: block; }
.meta { font-size: 13px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; }
.chip.push { color: var(--push); } .chip.pull { color: var(--pull); } .chip.legs { color: var(--legs); } .chip.core { color: var(--core); }

.pic { display: block; width: 100%; border: 0; padding: 0; background: none; border-radius: 8px; overflow: hidden; aspect-ratio: 3 / 2; max-width: 100%; }
.pic.sm { width: 112px; flex: none; border-radius: 6px; box-shadow: 0 0 0 1px var(--line); }
@media (min-width: 560px) { .pic.sm { width: 150px; } }
.pic svg, .pic img { width: 100%; height: 100%; display: block; object-fit: cover; }

.last { font-size: 13px; color: var(--muted); background: var(--bg); border-radius: 8px; padding: 6px 10px; font-variant-numeric: tabular-nums; }
.last b { color: var(--ink); font-weight: 600; }

.sets { display: grid; gap: 6px; }
.set { display: grid; grid-template-columns: 26px 1fr 1fr; gap: 8px; align-items: center; }
.set-btns { display: flex; gap: 8px; }
.set .n { font-family: var(--font-display); font-weight: 600; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.field { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 0 8px; min-width: 0; }
.field input { width: 100%; min-width: 0; border: 0; background: none; padding: 8px 0; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.field input::placeholder { color: var(--lighter); font-size: 12px; font-weight: 400; font-style: italic; opacity: 1; }
.field.ghost { background: var(--surface); border-style: dashed; }
.set .n.fill { border: 1px solid var(--line); border-radius: 6px; background: var(--bg); height: 34px; padding: 0; font-family: var(--font-display); font-weight: 600; color: var(--accent); }
.field span { font-size: 12px; color: var(--muted); padding-left: 4px; }
.handle { flex: none; border: 0; background: none; letter-spacing: -3px; cursor: grab; touch-action: none; padding: 0; }
.chead { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.card.dragging { position: relative; z-index: 3; box-shadow: 0 10px 28px rgba(0,0,0,.25); transition: none; }
.card { transition: transform .15s ease; }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }
.set { position: relative; }
.set.act .field { border-color: var(--accent); }
.rec { grid-column: 2 / -1; font-size: 12px; font-weight: 600; color: var(--warn); }
.rec:empty { display: none; }
.qbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.qlab { font-size: 12px; color: var(--muted); min-width: 56px; }
.qb { flex: 1; min-width: 48px; padding: 8px 0; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-weight: 600; font-variant-numeric: tabular-nums; }
.add-set:disabled { opacity: .4; cursor: default; }
.add-set { justify-self: start; background: none; border: 1px dashed var(--accent); color: var(--accent); border-radius: 8px; padding: 6px 14px; font-weight: 600; }

.btn { border-radius: 8px; padding: 9px 14px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.btn.primary { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
.btn:disabled { opacity: .5; cursor: default; }

.savebox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; }
.savebox p { margin: 0; color: var(--muted); font-size: 14px; }
.savebox .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.empty { text-align: center; color: var(--muted); padding: 24px 12px; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); }

/* Progress chart */
.chartbox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; }
.chartbox svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.hist { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.hist th { text-align: left; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 4px 6px; border-bottom: 1px solid var(--line); }
.hist td { padding: 5px 6px; border-bottom: 1px solid var(--line); }
.hist tr.lt td { color: var(--muted); }


/* Compact Today cards */
#view .card[data-id] { padding: 9px 10px; gap: 7px; }
#view .card[data-id] .ex-name { font-size: 18px; }
#view .card[data-id] .meta { font-size: 12px; }
#view .card[data-id] .last { font-size: 12px; padding-block: 3px; }
#view .card[data-id] .sets { gap: 4px; }
#view .card[data-id] .set { grid-template-columns: 24px 1fr 1fr; gap: 6px; }
#view .card[data-id] .field { padding: 0 7px; border-radius: 7px; }
#view .card[data-id] .field input { font-size: 15px; padding: 5px 0; }
#view .card[data-id] .field input::placeholder { font-size: 11px; }
#view .card[data-id] .field span { font-size: 11px; }
#view .card[data-id] .set .n.fill { height: 28px; font-size: 14px; }
#view .card[data-id] .qbar { gap: 4px; }
#view .card[data-id] .qb { padding: 5px 0; font-size: 13px; min-width: 40px; border-radius: 7px; }
#view .card[data-id] .qlab { font-size: 11px; min-width: 44px; }
#view .card[data-id] .add-set { padding: 4px 12px; font-size: 13px; }
#view .card[data-id] .pic.sm { width: 96px; }
.handle { width: 30px; height: 36px; font-size: 18px; color: var(--muted); border-radius: 6px; }
.handle:active { background: var(--bg); }
.card.dragging { outline: 2px solid var(--gold); }


/* Start / Finished: cards start collapsed */
.run-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.run-btn { border: 0; border-radius: 8px; background: var(--brand); color: var(--gold); font-weight: 700; font-size: 14px; padding: 7px 18px; letter-spacing: .3px; }
.run-btn.fin { background: var(--gold); color: var(--brand); }
.done-tag { font-size: 13px; font-weight: 600; color: var(--good); }
.done-tag.part { color: var(--muted); font-weight: 500; }
.card.done { opacity: .72; }
.card.open { border-color: var(--accent); }
#view .card[data-id] { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#view .card[data-id] input { -webkit-user-select: text; user-select: text; }
.card.holding { transform: scale(.985); transition: transform .9s ease; }

#edgeZones { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
#edgeZones .ez { position: absolute; top: 0; bottom: 0; width: 12%; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 12px; font-weight: 700; color: var(--brand); background: rgba(var(--gold-rgb),.18); }
#edgeZones .ez.l { left: 0; } #edgeZones .ez.r { right: 0; }
#edgeZones .ez.on { background: rgba(var(--gold-rgb),.6); }
.room { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; }
.room .over { color: var(--bad, #c0392b); }
.section-sub { font-size: 13px; font-weight: 600; color: var(--muted); margin: 10px 0 4px; }
.qitem { display: grid; grid-template-columns: 120px auto 1fr; gap: 4px 8px; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.qitem .qn { grid-column: 1 / -1; font-weight: 600; }
.qitem .field { grid-column: 1; }
.qitem .field input { font-size: 15px; padding: 5px 0; }
.qitem .fit { grid-column: 2; padding-inline: 12px; }
.qitem .qv { grid-column: 3; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.qb.fit { background: var(--brand); color: var(--gold); border-color: var(--brand); }
.flog.sugg { background: none; border: 0; padding: 0; }
.flog.sugg .frow { grid-template-columns: 1fr auto; }
.addpill { grid-column: 2; grid-row: 1 / span 2; align-self: center; border: 1px solid var(--brand); background: var(--brand); color: var(--gold); border-radius: 999px; padding: 4px 14px; font-size: 13px; font-weight: 600; line-height: 1.2; }
.addpill:active { opacity: .7; }
.btn.sm { padding: 4px 10px; font-size: 13px; }
/* dark mode and colour theme changes wipe in from the top instead of switching at once (themeSwap) */
::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
::view-transition-new(root) { animation: themeWipe .6s cubic-bezier(.4, 0, .2, 1) both; }
@keyframes themeWipe { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
:root.vt-circle::view-transition-new(root) { animation: none; }   /* tapped change: themeSwap grows a circle from the tap instead */
.btn.danger { background: #b3261e; color: #fff; border-color: #b3261e; font-weight: 700; }
:root[data-theme="dark"] .btn.danger { background: #c62828; border-color: #ff8a80; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.danger { background: #c62828; border-color: #ff8a80; } }
details.wk summary { cursor: pointer; font-size: 13px; color: var(--muted); padding: 6px 2px; }
.wstrip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.wstrip.wscroll { display: flex; gap: 4px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x proximity; scrollbar-width: none; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; padding: 2px 0; }
.wstrip.wscroll::-webkit-scrollbar { display: none; }
.wstrip.wscroll .wd { flex: 0 0 calc((100% - 24px) / 7); scroll-snap-align: start; }
.wstrip .wd span small { font-size: 9.5px; margin-left: 1px; opacity: .85; }
.wstrip .wd { display: grid; gap: 1px; justify-items: center; padding: 3px 0; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); font-size: 11px; color: var(--muted); line-height: 1.15; }
.wstrip .wd b { font-size: 13px; }
.wstrip .wd.high b { color: var(--brand); } .wstrip .wd.mid b { color: var(--accent); } .wstrip .wd.low b { color: var(--muted); }
.wstrip .wd.high { background: rgba(var(--gold-rgb),.22); }
.wstrip .wd.today span { font-weight: 700; color: var(--ink); }
.wstrip .wd.on { outline: 2px solid var(--brand); outline-offset: -1px; }
.pend { border-top: 1px solid var(--line); padding-top: 6px; display: grid; gap: 8px; }
.wstrip .dot { width: 6px; height: 6px; border-radius: 50%; background: transparent; }
.wstrip .dot.ok { background: var(--good); } .wstrip .dot.over { background: var(--bad); } .wstrip .dot.under { background: var(--muted); opacity: .6; }
.wlegend { display: flex; align-items: center; justify-content: center; gap: 5px; margin: 5px 0 0; font-size: 11px; color: var(--muted); }
.wlegend .wl { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-left: 6px; }
.wlegend .wl:first-child { margin-left: 0; }
.wlegend .wl.ok { background: var(--good); }
.wlegend .wl.over { background: var(--bad); }
.wlegend .wl.under { background: var(--muted); opacity: .6; }
.wl-note { opacity: .8; }
#view.tab-in { animation: tabIn .38s cubic-bezier(.2, .7, .3, 1); }   /* Ver 0.3b: tab opened from Home or the wheel */
@keyframes tabIn { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { #view.tab-in { animation: none; } }
#view.sl-l { animation: slL .22s ease-out; } #view.sl-r { animation: slR .22s ease-out; }
@keyframes slL { from { transform: translateX(36px); opacity: .3; } to { transform: none; opacity: 1; } }
@keyframes slR { from { transform: translateX(-36px); opacity: .3; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { #view.sl-l, #view.sl-r { animation: none; } }
/* Quick foods */
.qchips { display: flex; flex-wrap: wrap; gap: 6px; }
.qchip { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 6px 12px; font-size: 14px; }
.qchip.on { background: var(--brand); color: var(--gold); border-color: var(--brand); transition: background .1s; }   /* brief flash when a chip is tapped */
.qchip.edit { border-style: dashed; color: var(--muted); }
.qfe { display: grid; gap: 10px; }
.qfe-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.qfe-row .fname { grid-column: 1 / 4; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); min-width: 0; }
.qfe-row select { grid-column: 4; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
/* Body */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 9px 8px; display: grid; gap: 2px; min-width: 0; }
.tile .lab { font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .val { font-family: var(--font-display); font-weight: 700; font-size: clamp(18px, 5.6vw, 26px); line-height: 1.05; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tile .val small { font-size: .55em; font-weight: 500; color: var(--muted); margin-left: 1px; }
.tile .chg { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.25; }
.section-h { font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 8px 0 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; }
.panel p { margin: 0; font-size: 14px; color: var(--muted); }
.row-acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row-acts input[type="date"] { padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); }
.ph { border: 0; padding: 0; background: var(--bg); border-radius: 8px; overflow: hidden; aspect-ratio: 3 / 4; max-width: 100%; position: relative; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph span { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(var(--brand-rgb),.78); color: #fff; font-size: 12px; padding: 3px 6px; text-align: left; font-variant-numeric: tabular-nums; }
.ph .wait { position: static; background: none; color: var(--muted); display: grid; place-items: center; height: 100%; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.compare select { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
.compare .ph { aspect-ratio: 3 / 4; }
.toggle { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
.crop-prev { display: grid; place-items: center; background: var(--bg); border-radius: 8px; padding: 8px; }

.lightbox .frame img { width: 100%; height: auto; display: block; max-height: 78vh; object-fit: contain; background: var(--bg); }

/* Food */
.fday { justify-content: space-between; flex-wrap: nowrap; }
.fday-t { min-width: 0; border: 0; background: none; color: var(--ink); padding: 4px 6px; border-radius: 8px; font: inherit; cursor: pointer; }

.fwk-day { cursor: pointer; border-radius: 6px; }
.fday b { font-family: var(--font-display); font-size: 18px; letter-spacing: .04em; text-transform: uppercase; }
.seg .btn { flex: 1; }
#foodText { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; resize: vertical; }
.fitems { display: grid; gap: 10px; }
.fitem { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; align-items: center; }
.fitem .fname { grid-column: 1 / -1; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); min-width: 0; }
.fnum { display: grid; gap: 1px; min-width: 0; }
.fnum input { width: 100%; box-sizing: border-box; padding: 7px 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-weight: 600; font-variant-numeric: tabular-nums; }
.fnum span { font-size: 11px; color: var(--muted); }
.madjrow { margin-top: 10px; align-items: center; flex-wrap: nowrap; }
.madjrow .btn { flex: 0 0 auto; }
.adjr { display: grid; grid-template-columns: 4.6em 56px 1fr 56px; gap: 8px; align-items: center; margin: 6px 0; }
.adjl { font-weight: 600; }
.adjb { min-height: 44px; padding: 0; font-weight: 700; }
.adjv { grid-template-columns: 1fr auto; align-items: center; gap: 4px; }
.adjv input { text-align: center; font-size: 17px; }
.adjk { margin: 8px 2px; }
.flog { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 12px; }
.frow { display: grid; grid-template-columns: 1fr; gap: 2px 8px; padding: 6px 0; border-bottom: 1px solid var(--line); align-items: center; }
.frow:last-child { border-bottom: 0; }
.frow .fn { min-width: 0; }
.frow .fk { grid-column: 1; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.hist tr.on td { background: var(--accent-soft); font-weight: 600; }

/* Photos */
.strip { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x proximity; padding: 4px 2px 8px; -webkit-overflow-scrolling: touch; }
.strip .mon { flex: none; align-self: center; writing-mode: vertical-rl; transform: rotate(180deg); font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.th { flex: none; width: 76px; scroll-snap-align: center; border: 2px solid transparent; border-radius: 8px; padding: 0; background: var(--surface); display: grid; gap: 2px; position: relative; overflow: hidden; }
.th img, .th i { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; display: grid; place-items: center; background: var(--bg); color: var(--muted); font-style: normal; }
.th span { font-size: 12px; font-variant-numeric: tabular-nums; padding-bottom: 3px; }
.th:not(.on)::after, .phbig:not(.cmp-empty)::after { content: ""; position: absolute; inset: 0; border: 1px solid color-mix(in srgb, var(--ink) 24%, transparent); border-radius: inherit; pointer-events: none; }   /* thin border on top of the photo, like the food tiles */
.th.on { border-color: var(--gold); box-shadow: 0 0 0 1px var(--accent); }
.th em, .phbig em { position: absolute; top: 4px; left: 4px; font-style: normal; font-weight: 700; font-size: 12px; background: var(--gold); color: var(--gold-ink); border-radius: 4px; padding: 0 5px; }
.phbig { position: relative; background: var(--bg); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 240px; touch-action: pan-y; }
.phbig img { width: 100%; max-height: 70vh; object-fit: contain; display: block; cursor: zoom-in; }
.phbig i { color: var(--muted); font-style: normal; padding: 40px; }
.phbig.small { min-height: 160px; justify-content: flex-start; }
.phbig.small img { width: 100%; height: auto; max-height: none; }
.phbig .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 36px; height: 52px; border: 0; border-radius: 8px; background: rgba(var(--brand-rgb),.55); color: #fff; font-size: 26px; line-height: 1; }
.phbig .nav.l { left: 6px; } .phbig .nav.r { right: 6px; }
.pinfo.above { gap: 2px 14px; }
.phfig { margin: 0 auto; max-width: 100%; display: grid; gap: 6px; }
.phfig .phbig img { width: 100%; height: auto; max-height: none; }
.phbig.small em { top: auto; bottom: 4px; }
.pinfo { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pinfo b { color: var(--ink); }
.cmp-col { display: grid; gap: 6px; min-width: 0; }
.seg { display: flex; gap: 6px; }
.fset { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 8px 0 4px; }
.fset-it { display: grid; gap: 1px; text-align: left; padding: 6px 7px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font: inherit; cursor: pointer; min-width: 0; }
.fset-it > * { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fset-l { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.fset-it b { font-size: 14.5px; letter-spacing: -.01em; }
/* Weight not set yet: gold box that pulses so the first step is obvious */
.fset-it.need { border: 2px solid var(--gold); background: rgba(var(--gold-rgb),.2); animation: needPulse 1.8s ease-in-out infinite; }
.fset-it.need b { color: var(--accent); }
.fset-it.need .fset-s { color: var(--ink); font-weight: 600; }
@keyframes needPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(var(--gold-rgb),.55); } 50% { box-shadow: 0 0 0 6px rgba(var(--gold-rgb),0); } }
@media (prefers-reduced-motion: reduce) { .fset-it.need { animation: none; } }
.needw { border: 1px dashed var(--gold); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; margin-top: 8px; background: rgba(var(--gold-rgb),.08); }
.needw p { margin: 0; font-size: 14px; color: var(--ink); }
.fset-go { font-size: 10px; color: var(--muted); margin-left: 4px; }
.fset-s { font-size: 11px; color: var(--muted); }
.fset-v { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 4px; white-space: normal !important; }
.fset-it { align-content: start; }
.fset-v .fset-s { font-size: 10.5px; }
.fset-v b, .fset-v .fset-s { white-space: nowrap; }
.fsh-note { padding: 0 2px 6px; }
.fkgrow { align-items: center; flex-wrap: nowrap; margin-top: 8px; }
/* Plan my week sheet */
.wkset .wkbody { max-height: none; overflow: visible; padding: 0; }
.wkw { padding-bottom: 10px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.wp-today { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 4px; }
.wkbody { max-height: calc(70vh - 120px); overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; display: grid; gap: 6px; padding: 2px 4px 6px; }
.wkrow { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; }
.wkd { font-weight: 600; }
.wkseg { gap: 4px; }
.wkseg .btn { min-width: 58px; padding: 7px 6px; }
.wkcount { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.cwk { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.cwd { display: grid; justify-items: center; gap: 4px; min-width: 0; }
.cwl { font-size: 12px; font-weight: 600; color: var(--muted); }
.cwd.today .cwl { color: var(--accent); font-weight: 800; }
.wheel.cwheel { width: 100%; box-sizing: border-box; height: 66px; border-radius: 10px; }
.wheel.cwheel .wh-band { top: 17px; }
.wheel.cwheel .wh-i { top: 17px; font-family: inherit; font-size: 13px; }
.wheel.cwheel .wh-band { left: 2px; right: 2px; }
.cwd.today .cwheel { box-shadow: 0 0 0 2px var(--accent); }
.cwhint { margin: 2px 0 0; font-size: 12px; }
/* Carb level colours (user 2026-11-12 picked amber / blue / teal) */
:root { --cw-high: #e0a12a; --cw-mid: #5b8fd6; --cw-low: #2a9d8f; }
:root[data-theme="dark"] { --cw-high: #f0b43c; --cw-mid: #74a3e6; --cw-low: #3fb8a8; }
.wheel.cwheel.t-high { border-color: var(--cw-high); } .wheel.cwheel.t-high .wh-band { background: var(--cw-high); box-shadow: 0 1px 4px color-mix(in srgb, var(--cw-high) 50%, transparent); }
.wheel.cwheel.t-mid { border-color: var(--cw-mid); } .wheel.cwheel.t-mid .wh-band { background: var(--cw-mid); box-shadow: 0 1px 4px color-mix(in srgb, var(--cw-mid) 50%, transparent); }
.wheel.cwheel.t-low { border-color: var(--cw-low); } .wheel.cwheel.t-low .wh-band { background: var(--cw-low); box-shadow: 0 1px 4px color-mix(in srgb, var(--cw-low) 50%, transparent); }
.wheel.cwheel.t-high .wh-i[style*="gold-ink"] { color: #3a2600 !important; }
.wheel.cwheel.t-mid .wh-i[style*="gold-ink"], .wheel.cwheel.t-low .wh-i[style*="gold-ink"] { color: #fff !important; }
.wheel.cwheel .wh-band { transition: background .15s; }
.wkcount b { color: var(--ink); }
.wkpre { flex-wrap: wrap; }
.wkopen { padding: 8px 4px 0; border-top: 1px solid var(--line); margin-top: 6px; }
.fkgrow .tin { width: 6.5em; flex: 0 0 auto; }
.btn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.hint { margin: 0; font-size: 13px; color: var(--muted); }
.slider-box { position: relative; aspect-ratio: 3 / 4; max-width: 100%; max-height: 55vh; margin-inline: auto; background: var(--bg); border-radius: var(--r); overflow: hidden; }
.slider-box img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.slider-box #slLine { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--gold); box-shadow: 0 0 0 1px var(--accent); }
.slider-box em { position: absolute; top: 6px; font-style: normal; font-weight: 700; font-size: 12px; background: var(--gold); color: var(--gold-ink); border-radius: 4px; padding: 1px 6px; }
.slider-box .la { left: 6px; } .slider-box .lb { right: 6px; }
#slider { width: 100%; accent-color: var(--accent); }

.ph-bottom { display: grid; gap: 8px; margin-top: 4px; padding-top: 10px; border-top: 1px solid var(--line); }
/* Photos timeline */
.phnear { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; min-height: 60px; }
.phnear .th { width: auto; }
.tlwrap { position: relative; min-width: 0; max-width: 100%; }
.ph-bottom > * { min-width: 0; }
.tl { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.tl::-webkit-scrollbar { display: none; }
.tl-in { display: inline-block; padding: 0 50%; white-space: nowrap; }
.tl-track { position: relative; height: 54px; display: inline-block; vertical-align: top; }
.tl-track::before { content: ""; position: absolute; left: 0; right: 0; top: 30px; height: 2px; background: var(--line); }
.tl-m, .tl-w { position: absolute; top: 24px; width: 2px; height: 14px; transform: translateX(-50%); background: var(--muted); font-style: normal; pointer-events: none; }
.tl-w { top: 27px; height: 8px; width: 1px; background: var(--lighter); }
.tl-m b { position: absolute; left: 5px; top: -19px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.tl-dot { position: absolute; top: 25px; transform: translateX(-50%); width: 12px; height: 12px; padding: 0; border-radius: 50%; border: 2px solid var(--surface); background: var(--muted); box-shadow: 0 0 0 1px var(--line); }
.tl-dot.near { background: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.tl-dot::after { content: ""; position: absolute; inset: -12px -6px; }   /* bigger tap area */
.tl-mark { position: absolute; left: 50%; top: 0; bottom: 0; width: 0; pointer-events: none; }
.tl-mark::before { content: ""; position: absolute; left: -1px; top: 6px; bottom: 6px; width: 2px; border-radius: 1px; background: var(--accent); }
.tl-mark span { position: absolute; left: 50%; bottom: 3px; transform: translateX(-50%); font-size: 11px; font-weight: 700; white-space: nowrap; color: var(--accent); background: var(--surface); padding: 0 5px; border-radius: 6px; }
.ph-acts .btn { flex: 1; padding-block: 12px; text-align: center; }
.ph-tip { text-align: center; padding: 18px 0 4px; }
/* Progress chart options card */
.ctlcard { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--gold); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 10px; }
.ctl-lab { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: -6px; }

.pickbtn { position: relative; width: 100%; text-align: left; padding: 11px 40px 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.15; }
.pickbtn::after { content: ""; position: absolute; right: 16px; top: 50%; width: 9px; height: 9px; border-right: 2.5px solid var(--accent); border-bottom: 2.5px solid var(--accent); transform: translateY(-70%) rotate(45deg); }
.sheet-bg { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: min(640px, 100%); background: var(--surface); border-radius: 18px 18px 0 0; padding: 10px 12px calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; box-shadow: 0 -8px 24px rgba(0,0,0,.25); }
.sheet-h { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px; }
.sheet-h b { font-family: var(--font-display); font-size: 18px; letter-spacing: .03em; }
.sheet-list { max-height: calc(62vh - 112px); overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; display: grid; gap: 4px; padding-bottom: 4px; }
.sheet-it { text-align: left; padding: 13px 14px; border: 0; border-radius: 10px; background: var(--bg); color: var(--ink); font-size: 16px; font-weight: 600; }
.sheet-it.on { background: var(--gold); color: var(--gold-ink); }
.sheet-sep { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 8px 4px 2px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px; color: var(--ink); cursor: pointer; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch i { flex: none; position: relative; width: 50px; height: 30px; border-radius: 15px; background: var(--line); transition: background .15s; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .15s; }
.switch input:checked + i { background: var(--gold); }
.switch input:checked + i::after { transform: translateX(20px); }
.switch input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }
.hrow { align-items: center; flex-wrap: nowrap; }
#view.today-view { display: flex; flex-direction: column; min-height: calc(100dvh - var(--hdr-h, 92px) - env(safe-area-inset-top, 0px) - 14px - var(--tabbar-h) - 110px); }
#view.today-view > * { flex: none; }
/* with the placeholder showing, the two bottom cards sit a little lower, closer to the rest timer */
#view.today-view:has(> .empty.grow) { padding-bottom: calc(var(--tabbar-h) + 84px); min-height: calc(100dvh - var(--hdr-h, 92px) - env(safe-area-inset-top, 0px) - 14px - var(--tabbar-h) - 84px); }
#view.today-view > .empty.grow { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; min-height: 120px; font-size: 16px; line-height: 1.5; }
#view.today-view > .today-fill { flex: 1 1 auto; }
/* Home page: Today in the middle, the other tabs as bubbles in a ring around it */
:root[data-pal]:not([data-pal="navy"]) .wb:not(.top) {   /* other colour themes: bubbles tinted from the theme's own colour */
  background: radial-gradient(circle at 32% 26%, #ffffff 0%, color-mix(in srgb, var(--brand) 14%, #ffffff) 34%, color-mix(in srgb, var(--brand) 34%, #ffffff) 72%, color-mix(in srgb, var(--brand) 48%, #ffffff) 100%); }
/* Bottom of a tab page: one round button (opens the wheel) with the Today shortcut beside it. Not shown on Home. */
.dockrow { display: flex; justify-content: center; align-items: center; gap: 14px; }
.dock-btn { pointer-events: auto; width: 62px; height: 62px; flex: none; padding: 0; border-radius: 50%; border: 2.5px solid var(--gold); background: var(--brand); color: var(--gold); display: grid; place-items: center; box-shadow: 0 8px 18px rgba(0, 0, 0, .35); }
.dock-btn:active { transform: scale(.95); }
body.home .fweek, body.wheel-on .tabbar { display: none !important; }
/* The wheel: every tab as a bubble on a ring; the one at the top is the choice; Home in the middle */
.wveil { position: fixed; inset: 0; z-index: 30; background: rgba(10, 18, 36, .6); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); touch-action: none; }
.twheel { position: absolute; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); width: 300px; height: 300px; margin-left: -150px; border-radius: 50%; touch-action: none; animation: wheelPop .22s cubic-bezier(.3, 1.4, .5, 1); }
.twheel::before { content: ""; position: absolute; inset: 44px; border-radius: 50%; border: 1.5px dashed rgba(var(--gold-rgb), .55); }
.twheel::after { content: ""; position: absolute; left: 50%; top: -6px; width: 0; height: 0; margin-left: -7px; border: 7px solid transparent; border-top-color: var(--gold); }
@keyframes wheelPop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.wb { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; padding: 0; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .8); color: var(--brand); display: grid; place-items: center;
  background: radial-gradient(circle at 32% 26%, #ffffff 0%, #dbe8fb 40%, #a9c4ee 100%); box-shadow: 0 4px 10px rgba(0, 0, 0, .35); will-change: transform; }
.wb svg { width: 24px; height: 24px; }
.wb.top { color: var(--gold-ink); border-color: #fff3d9; background: radial-gradient(circle at 32% 26%, #fffaf0 0%, #f6e6c6 45%, #e2c088 100%);
  background: radial-gradient(circle at 32% 26%, #ffffff 0%, color-mix(in srgb, var(--gold) 40%, #ffffff) 45%, color-mix(in srgb, var(--gold) 85%, #ffffff) 100%); }
.whub { position: absolute; left: 50%; top: 50%; width: 74px; height: 74px; margin: -37px 0 0 -37px; padding: 0; border-radius: 50%; border: 2.5px solid var(--gold); background: var(--surface); color: var(--ink); display: grid; place-items: center; align-content: center; gap: 1px; box-shadow: 0 6px 14px rgba(0, 0, 0, .35); }
.whub svg { width: 26px; height: 26px; } .whub span { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.wname { position: absolute; left: 0; right: 0; bottom: calc(340px + env(safe-area-inset-bottom, 0px)); text-align: center; color: #fff; pointer-events: none; }
.wname b { display: block; font-family: var(--font-display); font-size: 34px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; line-height: 1; }
.wname small { display: block; margin-top: 6px; font-size: 13px; opacity: .85; }
@media (prefers-reduced-motion: reduce) { .twheel { animation: none; } }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; font: inherit; cursor: pointer; }
.ver { font-size: 17px; color: var(--ink) !important; }
.verlist { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13px; color: var(--muted); }

.seg.rng .btn { padding: 7px 0; font-size: 14px; }
/* saved indicator: gold check badge on the Save card with a short pop and a green edge glow; header badge in green */
.savebox { position: relative; }
.savebox.saved { border-color: var(--good); }
.savebox .okbadge { position: absolute; top: -12px; right: -10px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--gold); color: var(--brand); box-shadow: 0 2px 8px rgba(0,0,0,.25); }

/* Stopwatch sets (Dead Hang) */
#view .card[data-id] .set.swset, .set.swset { grid-template-columns: 24px 1fr; row-gap: 4px; }
.sw { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sw b { font-family: var(--font-display); font-weight: 700; font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; }
.sw-btn { border: 0; border-radius: 10px; padding: 10px 22px; font-weight: 700; font-size: 16px; background: var(--brand); color: var(--gold); }
.sw-btn.stop { background: var(--bad); color: #fff; }
.swman { grid-column: 2; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.swman input { width: 6.5em; font-size: 13px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
.swman input::placeholder { color: var(--lighter); font-style: italic; }

/* colour themes. Navy + Gold is the default (no data-pal rule);
 Soft ember and Blush replace every navy and gold, in light and dark mode. Chosen in Settings > Appearance, kept on this phone (wlite.pal.v1). */
:root[data-pal="ember"] {
  --brand: #222222; --gold: #d9774f; --gold-ink: #222222; --gold-rgb: 217,119,79; --brand-rgb: 34,34,34; --gold-hi: #f3b99e;
  --on-brand-muted: #c9c0b9; --on-brand-warn: #f0c9a2;
  --bg: #f5f2ef; --ink: #1e1b19; --muted: #6a625c; --line: #ddd5ce;
  --accent: #222222; --accent-ink: #ffffff; --accent-soft: #f4e5dc; --lighter: #a39b95; }
:root[data-pal="ember"][data-theme="dark"] {
  --bg: #121110; --surface: #1d1b1a; --ink: #efeae6; --muted: #aaa29b; --line: #35302d;
  --accent: #d9774f; --accent-ink: #222222; --accent-soft: #3a2519; --lighter: #7d7671; }
:root[data-pal="blush"] {
  --brand: #b85c7a; --gold: #f7cfd8; --gold-ink: #7a3550; --gold-rgb: 247,207,216; --brand-rgb: 184,92,122; --gold-hi: #fff0f3;
  --on-brand-muted: #f6dce4; --on-brand-warn: #ffe3c4;
  --bg: #fdf5f6; --ink: #3a1f29; --muted: #85606c; --line: #efd8de;
  --accent: #b85c7a; --accent-ink: #ffffff; --accent-soft: #fbe6eb; --lighter: #c7a9b2; }
:root[data-pal="blush"][data-theme="dark"] {
  --bg: #1a1114; --surface: #26191e; --ink: #f6e9ed; --muted: #c2a3ad; --line: #3f2a32;
  --accent: #f7cfd8; --accent-ink: #7a3550; --accent-soft: #3d2129; --lighter: #8a7078; }
/* Crimson + Gold: deep crimson in place of the navy, warm gold */
:root[data-pal="crimson"] {
  --brand: #8c1c22; --gold: #d6a84e; --gold-ink: #5c1015; --gold-rgb: 214,168,78; --brand-rgb: 140,28,34; --gold-hi: #f4dca6;
  --on-brand-muted: #ecc9c4; --on-brand-warn: #f6d9a0;
  --bg: #f8f2ef; --ink: #261315; --muted: #6f5a57; --line: #e5d5ce;
  --accent: #8c1c22; --accent-ink: #ffffff; --accent-soft: #f6e2dc; --lighter: #ab9590; }
:root[data-pal="crimson"][data-theme="dark"] {
  --bg: #150c0d; --surface: #221416; --ink: #f3e8e6; --muted: #b8a19c; --line: #3d2628;
  --accent: #d6a84e; --accent-ink: #5c1015; --accent-soft: #35261a; --lighter: #84706c; }
/* Black + Silver ("a bit metallic"): near-black in place of the navy, silver in place of the gold.
 The silver parts people see most get a brushed-metal gradient (--metal) instead of a flat colour; small details stay flat silver. */
:root[data-pal="steel"] {
  --brand: #111214; --gold: #c3c7cd; --gold-ink: #111214; --gold-rgb: 195,199,205; --brand-rgb: 17,18,20; --gold-hi: #f4f6f8;
  --on-brand-muted: #a9aeb5; --on-brand-warn: #e6d3a8;
  --bg: #f1f2f4; --ink: #131416; --muted: #5d626a; --line: #d6d9de;
  --accent: #111214; --accent-ink: #ffffff; --accent-soft: #e4e6ea; --lighter: #9aa0a8;
  --metal: linear-gradient(160deg, #f6f7f9 0%, #c4c8ce 26%, #eef0f3 45%, #a3a8b0 68%, #dde0e4 86%, #b9bdc4 100%);
  --metal-line: linear-gradient(90deg, #8c9199, #eef0f3 25%, #a7acb3 50%, #f6f7f9 72%, #9da2aa); }
:root[data-pal="steel"][data-theme="dark"] {
  --bg: #0b0b0c; --surface: #17181a; --ink: #eceef1; --muted: #a2a7ae; --line: #2c2e32;
  --accent: #c3c7cd; --accent-ink: #111214; --accent-soft: #26282c; --lighter: #6e737a; }
:root[data-pal="steel"] .btn.primary, :root[data-pal="steel"] .run-btn.fin,
:root[data-pal="steel"] .sheet-it.on, :root[data-pal="steel"] .nxseg .btn.on, :root[data-pal="steel"] .switch input:checked + i,
:root[data-pal="steel"] .wh-band, :root[data-pal="steel"] .lmap .lm-pill.sel.sel, :root[data-pal="steel"] .savebox .okbadge {
  background: var(--metal); text-shadow: 0 1px 0 rgba(255,255,255,.45); }
:root[data-pal="steel"] .switch input:checked + i, :root[data-pal="steel"] .wh-band { text-shadow: none; }
:root[data-pal="steel"] header.top { border-bottom: 3px solid transparent; border-image: var(--metal-line) 1; }
/* Settings as one grouped list, iPhone style */
.setgroup { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-top: 10px; }
.setrow { position: relative; display: flex; align-items: center; gap: 14px; min-height: 54px; padding: 8px 14px; cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; }
.setgroup > .setsec + .setsec > .setrow::before { content: ""; position: absolute; top: 0; left: 60px; right: 0; border-top: 1px solid var(--line); }
.setrow:active { background: var(--accent-soft); }
.setgroup > .setsec:first-child > .setrow { border-radius: 14px 14px 0 0; }
.setsec.on { border: 2px solid var(--gold); border-radius: 12px; margin: 4px; }
.setsec.on > .setrow { padding-left: 10px; padding-right: 10px; border-radius: 10px 10px 0 0; }
.setsec.on > .setrow::before, .setsec.on + .setsec > .setrow::before { display: none; }
.seticon { flex: none; width: 32px; height: 32px; border-radius: 8px; background: var(--brand); color: var(--gold); display: grid; place-items: center; }
.settitle { flex: 1; min-width: 0; font-size: 17px; font-weight: 500; color: var(--ink); }
.setside { flex: 0 1 auto; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.setchev { flex: none; width: 9px; height: 9px; margin: 0 4px 0 2px; border-right: 2.5px solid var(--muted); border-bottom: 2.5px solid var(--muted); transform: rotate(-45deg); transition: transform .2s; }
.setrow.on .setchev { transform: rotate(45deg) translate(-2px, -2px); }
.setsec > .panel.setpanel { border: 0; border-radius: 0; background: none; margin: 0; padding: 4px 14px 14px; }
.setsec > .notice { margin: 0 14px 8px; }
/* the logo opens the App icon sheet; a picture of your own shows as a circle */
img.logo { cursor: pointer; -webkit-tap-highlight-color: transparent; }
img.logo.custom { border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); box-sizing: border-box; }
.palrow { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }   /* 2 x 2 since the 4th theme */
.palbtn { display: grid; justify-items: center; gap: 6px; padding: 10px 4px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); font-size: 13px; font-weight: 600; }
.palbtn.on { border: 2px solid var(--accent); padding: 9px 3px; }
.palbtn .sw2 { display: flex; } .palbtn .sw2 i { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid rgba(0,0,0,.12); }
.palbtn .sw2 i + i { margin-left: -6px; }
.setlab { font-size: 15px; font-weight: 600; margin: 4px 0 0; }
.icrow { display: flex; align-items: center; gap: 12px; }
.icrow img, .icprev img { width: 48px; height: 48px; flex: none; border-radius: 50%; object-fit: cover; background: var(--brand); }
.icrow .ict { flex: 1; min-width: 0; display: grid; gap: 2px; } .icrow .ict span { font-size: 12px; color: var(--muted); }
.icprev { display: flex; justify-content: center; padding: 4px 0 6px; } .icprev img { width: 84px; height: 84px; border: 2px solid var(--gold); }
label.sheet-it { display: block; cursor: pointer; }
.sheet-it[aria-disabled="true"] { opacity: .5; pointer-events: none; }
.switch.dis { opacity: .45; pointer-events: none; }   /* Dark mode greyed out while Follow the phone setting is on */
.switch.dis input:checked + i { background: var(--muted); }   /* no gold while it cannot be used; gold returns when Follow is off */

/* Food tab nutrition bars (bars instead of the Target / Left number lines) */
.nbars { display: grid; gap: 7px; }
.nbar { display: grid; grid-template-columns: 62px 1fr 62px; align-items: center; gap: 10px; font-size: 13px; }
.nbar .nl { color: var(--ink); font-weight: 600; }
.nbar.n-c .nl, .nbar.n-p .nl, .nbar.n-f .nl, .nbar.n-fib .nl { color: var(--nc); }   /* labels in their macro colour */
.mtc, .mtp, .mtf, .mtb { font-weight: 600; } .mtc { color: var(--m-c); } .mtp { color: var(--m-p); } .mtf { color: var(--m-f); } .mtb { color: var(--push); }
.nbar .nt { position: relative; display: flex; height: 10px; border-radius: 999px; background: rgba(var(--brand-rgb), .08); overflow: hidden; }
:root[data-theme="dark"] .nbar .nt { background: rgba(255,255,255,.08); }
.nbar .nt i { display: block; height: 100%; transition: width .35s ease; }
.nbar .ne { background: var(--nc); border-radius: 999px 0 0 999px; }
.nbar .np { background: var(--nc); opacity: .38; }
.nbar .nr { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.nbar .nr b.over { color: var(--bad); } .nbar .nr b.ok { color: var(--good); }
.nbar.over .ne, .nbar.over .np { background: var(--bad); opacity: 1; }
.n-kcal { --nc: var(--accent); } .n-c { --nc: var(--m-c); } .n-p { --nc: var(--m-p); } .n-f { --nc: var(--m-f); } .n-fib { --nc: var(--push); }
.nbar.n-kcal .nt { height: 12px; }
.nhead { display: flex; justify-content: space-between; margin: 0 0 -2px; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
:root[data-theme="dark"] .n-kcal { --nc: var(--ink); }

/* photo tool row */
.phtools { display: flex; justify-content: center; gap: 4px; margin: -2px 0 0; }
.phtool { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border: 0; border-radius: 999px; background: none; color: var(--muted); font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; }
.phtool:active { background: rgba(var(--brand-rgb), .08); }
.phtool.del { color: var(--bad); }
.phtool.del.armed { background: var(--bad); color: #fff; }
.phtool:disabled { opacity: .5; }
/* Today: the page of a started exercise (only this exercise shows). Compact: it should fit one phone screen without scrolling. */
#view .card[data-id].focus { background: none; border: 0; padding: 0; gap: 8px; box-shadow: none; position: relative;
  /* a column as tall as the free screen (down to the bottom bar): the picture takes whatever height the rows leave over */
  display: flex; flex-direction: column; min-height: calc(100dvh - var(--hdr-h, 0px) - var(--tabbar-h) - 34px - env(safe-area-inset-top, 0px)); }
#view .card[data-id].focus > * { flex: none; }
#view .card[data-id].focus > .pic { flex: 1 1 0; min-height: 150px; max-height: calc((min(100vw, 640px) - 32px) / 1.5); width: 100%; max-width: none; aspect-ratio: auto; align-self: stretch; border-radius: 10px; box-shadow: 0 0 0 1px var(--line); }   /* full width; full 3:2 height when there is room, otherwise shorter (cropped a little at top and bottom); tap to enlarge */
#view .card[data-id].focus > .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
#view .card[data-id].focus .fx-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
#view .card[data-id].focus .fx-title .ex-name { font-size: 24px; line-height: 1.1; }
#view .card[data-id].focus .fx-title .meta { font-size: 12px; }
#view .card[data-id].focus .last { font-size: 12.5px; padding: 4px 8px; }
#view .card[data-id].focus .sets { gap: 6px; }
#view .card[data-id].focus .set { grid-template-columns: 26px 1fr 1fr 28px; gap: 6px; }
#view .card[data-id].focus .set.swset { grid-template-columns: 26px 1fr; }
#view .card[data-id].focus .field input { padding: 0; }
#view .card[data-id].focus .sethead span { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding-left: 8px; line-height: 1; }
#view .card[data-id].focus .set .field { height: 42px; background: var(--surface); }
#view .card[data-id].focus .set .field input { font-size: 18px; font-weight: 600; }
#view .card[data-id].focus .set:not(.swset) .field > span { display: none; }   /* the unit is in the column heading */
#view .card[data-id].focus .set .n, #view .card[data-id].focus .set .n.fill { height: 42px; font-size: 15px; }
#view .card[data-id].focus .rec { grid-column: auto; font-size: 20px; line-height: 1; text-align: center; }
#view .card[data-id].focus .qb { padding: 10px 0; background: var(--surface); font-size: 14.5px; }
#view .card[data-id].focus .qlab { font-size: 10.5px; min-width: 40px; }
#view .card[data-id].focus .fx-row { display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 6px; }
#view .card[data-id].focus .fx-row.one { grid-template-columns: 1fr; }
#view .card[data-id].focus .fx-row .add-set { justify-self: stretch; padding: 11px 4px; font-size: 14.5px; }
#view .card[data-id].focus .fx-fin { padding: 11px; font-size: 16px; border-radius: 9px; }
#view.today-view:has(> .card.focus) { min-height: 0; padding-top: 8px; padding-bottom: 0; }   /* no spare space under the page */
/* on Today the strip under the rest timer is filled, so the page does not show through around the round button */
/* The header (logo, day, date, sync badge) shows on the Home page only; tab pages start at the top of the screen */
body:not(.home):not(.setup) header.top { display: none; }
body:not(.home):not(.setup) main { padding-top: env(safe-area-inset-top, 0px); }
/* Rest timer: two small pills beside the round button in the bottom bar (no bar of its own) */
main .wrap { padding-bottom: calc(var(--tabbar-h) + 24px); }
#view.today-view { min-height: calc(100dvh - var(--hdr-h, 0px) - env(safe-area-inset-top, 0px) - 14px - var(--tabbar-h) - 24px); }
#view.today-view:has(> .empty.grow) { padding-bottom: 0; min-height: calc(100dvh - var(--hdr-h, 0px) - env(safe-area-inset-top, 0px) - 14px - var(--tabbar-h) - 24px); }
/* The bottom buttons sit on a floating rounded bar, like the old tab bar: brand colour with a gold edge */
.dockrow { height: 56px; box-sizing: border-box; background: var(--brand); border: 2px solid var(--gold); border-radius: 999px; box-shadow: 0 8px 20px rgba(0, 0, 0, .3); pointer-events: auto; }
.dock-btn { margin: -8px 0; box-shadow: 0 4px 12px rgba(0, 0, 0, .4); }   /* the round button stands a little proud of the bar */
/* Home page without the header band: the logo, the day and the date are a centred block above the bubbles, on the page
   background with no gold line; the sync badge sits at the upper right of the screen. (The header element is only shown on Home.) */
body.home header.top { position: static; background: none; border-bottom: 0; color: var(--ink); }
body.home header.top .wrap { padding-block: calc(env(safe-area-inset-top, 0px) + 22px) 0; }
body.home .hrow, body.home .brand { display: grid; justify-content: stretch; justify-items: center; gap: 10px; text-align: center; }
body.home .logo { width: 78px; height: 78px; }
body.home .day { font-size: 38px; letter-spacing: .05em; line-height: 1; }
body.home .dline { justify-content: center; }
body.home header.top .day small { margin-top: 6px; font-size: 15px; letter-spacing: .08em; color: var(--muted); }
body.home header.top .sync { position: fixed; right: max(14px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 12px); z-index: 4; padding: 4px 12px; font-size: 12px; color: var(--muted); border-color: var(--line); background: var(--surface); }
body.home header.top .sync.ok, body.home header.top .sync.saved { color: var(--good); border-color: currentColor; }
body.home header.top .sync.busy { color: var(--warn); border-color: currentColor; }
body.home header.top .sync.err { color: var(--bad); border-color: currentColor; }
body.home main .wrap { padding-top: 4px; padding-bottom: 20px; }
/* The bottom bar area is closed off: a line across the screen above it and the page colour under the line, so the page
   never shows behind or below the floating bar. */
.tabbar { background: var(--bg); border-top: 1px solid var(--line); box-sizing: border-box; height: var(--tabbar-h); display: flex; align-items: flex-end; }
.tabbar .wrap { width: 100%; }
/* No oval bar any more: the round button, the Today shortcut and the rest timer pills sit directly in the strip under the line */
.dockrow { height: 58px; background: none; border: 0; border-radius: 0; box-shadow: none; }
.dock-btn { width: 58px; height: 58px; margin: 0; box-shadow: 0 3px 10px rgba(0, 0, 0, .28); }
/* Bottom strip, final form: a raised surface with a soft shadow; in its middle the round button (current tab's icon) with
   the tab's name under it. The Today shortcut is gone (the wheel opens with Today at the top). */
.tabbar { background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -6px 18px rgba(0, 0, 0, .08); padding-bottom: max(10px, env(safe-area-inset-bottom, 0px)); }
.dockrow { height: auto; flex-direction: column; gap: 3px; justify-content: flex-end; }
.dock-btn { width: 50px; height: 50px; border-width: 2px; box-shadow: 0 2px 8px rgba(0, 0, 0, .22); }
/* Keep the round button and its label clear of the iPhone's home bar. Inside the Claude app the page often reports no
   bottom safe area while the home bar is still drawn over it, so the strip always keeps at least 30 px free at the bottom. */
:root { --dock-pad: max(30px, calc(env(safe-area-inset-bottom, 0px) + 8px)); --tabbar-h: calc(70px + var(--dock-pad)); }
.tabbar { padding-bottom: var(--dock-pad); }
/* Ver 0.3b: the bottom strip has a plain Home icon (no round background, no tab name under it) */
#dockBtn { width: 56px; height: 44px; margin: 0; border: 0; border-radius: 12px; background: none; box-shadow: none; color: var(--ink); }
#dockBtn svg { width: 30px; height: 30px; }
#dockBtn:active { transform: none; background: rgba(var(--brand-rgb), .08); }
/* Ver 0.3b: on an exercise page, a small return button at the far right of the bottom strip (the X on the page is gone) */
.dockrow { position: relative; }
.dock-back { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 0; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 12px; background: none; color: var(--muted); display: grid; place-items: center; }
.dock-go { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 0; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 12px; background: none; color: var(--muted); display: grid; place-items: center; }   /* Ver 0.3b: Go to opens the tab wheel */
.dock-go:active { background: rgba(var(--brand-rgb), .08); color: var(--ink); }
.dock-back:active { background: rgba(var(--brand-rgb), .08); color: var(--ink); }
:root { --tabbar-h: calc(54px + var(--dock-pad)); }
/* Ver 0.3b: rest timer built into the exercise page, right of the set rows: a clock with Rest 2:00 / 3:00 on it;
   while it runs the ring fills clockwise and is a full ring when the rest is over */
#view .card[data-id].focus .fx-body { display: grid; grid-template-columns: minmax(0, 1fr) 136px; gap: 8px; align-items: start; }
#view .card[data-id].focus .fx-body .set { grid-template-columns: 24px minmax(0, 1fr) minmax(0, 1fr) 16px; gap: 4px; }   /* narrow marks column so the timer can be larger */
#view .card[data-id].focus .fx-body .set.swset { grid-template-columns: 24px 1fr; }
.rt { display: grid; justify-items: center; padding-top: 14px; }
.rt-dial { position: relative; width: 136px; height: 136px; }
.rt-dial > svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.rt-bg { fill: var(--surface); stroke: var(--line); stroke-width: 6; }
.rt-pg { fill: none; stroke: var(--gold); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
.rt.idle .rt-pg { stroke: none; }
.rt.done .rt-pg { stroke: var(--good); }
.rt-in { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 3px; }
.rt-ic { color: var(--muted); display: block; }
.rt-opt { min-width: 72px; padding: 5px 10px; border-radius: 999px; border: 0; background: var(--brand); color: var(--gold); font-family: var(--font-display); font-size: 17px; font-weight: 700; letter-spacing: .03em; line-height: 1.2; font-variant-numeric: tabular-nums; }
.rt-opt.alt { background: var(--bg); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.rt-opt:active { background: var(--gold); color: var(--gold-ink); }
.rt-t { font-family: var(--font-display); font-size: 36px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; color: var(--ink); }
.rt-over { font-family: var(--font-display); font-size: 15px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--good); text-align: center; line-height: 1.05; }
.rt-stop { border: 0; background: none; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

// The page itself is loaded from GitHub on every open, so one push there updates this app too (user, 2026-11-01).
// If GitHub cannot be reached or sends something unexpected, the built-in copy (the index file in this project) is used.
const PAGE_URL = 'https://sqiangqi.github.io/workout-lite/lite.html';
function doGet() {
  let page = '', src = 'backup';
  try {
    const r = UrlFetchApp.fetch(PAGE_URL + '?t=' + Date.now(), { muteHttpExceptions: true, followRedirects: true });
    const t = r.getResponseCode() === 200 ? r.getContentText('UTF-8') : '';
    if (t.indexOf('google.script.run') > 0 && t.indexOf('</html>') > 0) { page = t; src = 'github'; }
  } catch (e) { /* use the built-in copy */ }
  if (!page) page = HtmlService.createHtmlOutputFromFile('index').getContent();
  page = page.replace('</head>', '<script>window.__liteSrc = "' + src + '";<\/script></head>');
  return HtmlService.createHtmlOutput(page)
    .setTitle(APP_NAME)
    .addMetaTag('viewport', 'width=device-width, initial-scale=1, viewport-fit=cover')
    .addMetaTag('apple-mobile-web-app-capable', 'yes');
}

// ---------- settings (per person) ----------
function cfg_() {
  const raw = PropertiesService.getUserProperties().getProperty('cfg');

}
function setCfg_(c) { PropertiesService.getUserProperties().setProperty('cfg', JSON.stringify(c)); }
function me_() { try { return Session.getActiveUser().getEmail(); } catch (e) { return ''; } }
// The owner sees the exercise notes (Lite 0.1f). Only a SHA-256 of the owner's email is kept here, because this code is also published on GitHub.
const OWNER_HASH = '0a341e799ef967f954cbf992684ee78c06c9f9897f3f3fab38a046f7836f66db';
function owner_() {
  try {
    const b = Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, String(me_()).trim().toLowerCase(), Utilities.Charset.UTF_8);
    return b.map(x => ('0' + ((x + 256) % 256).toString(16)).slice(-2)).join('') === OWNER_HASH;
  } catch (e) { return false; }
}

function openLog_() {
  const c = cfg_();
  if (!c) throw new Error('No workout Sheet is set up yet.');
  let ss;
  try { ss = SpreadsheetApp.openById(c.sheetId); }
  catch (e) { throw new Error('Could not open your workout Sheet as ' + me_() + ' (' + e.message + ').'); }
  const sh = ss.getSheetByName(c.tab);
  if (!sh) throw new Error('The tab "' + c.tab + '" is missing from your workout Sheet.');
  return { ss: ss, sh: sh, c: c };
}

// Rows J2:M as shown in the sheet, with trailing empty rows dropped. n = 0 reads all.
function readArchive_(sh, n) {
  const last = sh.getLastRow();
  let rows = Math.max(last - 1, 0);
  if (n) rows = Math.min(n, rows);
  if (rows <= 0) return [];
  const v = sh.getRange(2, ARCHIVE_COL, rows, 4).getDisplayValues();
  while (v.length && v[v.length - 1].join('') === '') v.pop();
  return v;
}
function readExercises_(ss) {
  const sh = ss.getSheetByName(EX_TAB);
  if (!sh) throw new Error('The Exercises tab is missing from your workout Sheet.');
  const last = Math.max(sh.getLastRow(), 2);
  return sh.getRange(2, 1, last - 1, 6).getDisplayValues();   // A to F (F = Unit)
}

// First call from the page: who is signed in, their settings, and their data.
