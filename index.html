// "Workout Lite log" (Exercises, Workout log, Plan) and "Workout Lite food" (Food log, Quick foods, Body metrics).
// Needs the drive.file scope: the app only sees the files it made itself. A half-made Sheet from an earlier try is
// trashed and made again; finished ones are reused, so tapping the button again always finishes the job.
const WL_FOLDER = APP_NAME, WL_LOG = APP_NAME + ' log', WL_FOOD = APP_NAME + ' food', WL_LOG_SID = 101, WL_PLAN_SID = 20261103;
const MIME_FOLDER = 'application/vnd.google-apps.folder', MIME_SHEET = 'application/vnd.google-apps.spreadsheet';

function needDriveScope() {
  const t = ls.get(K_TOK);
  if (t && String(t.sc || '').indexOf('drive.file') >= 0) return;

async function driveList(q) {
  const j = await gfetch(DRIVE + '?fields=files(id,name)&pageSize=50&q=' + encodeURIComponent(q + ' and trashed = false'));
  return j.files || [];
}
async function driveMake(name, mime, parent) {

  if (!j || !j.id) throw new Error('Google Drive did not return the new ' + (mime === MIME_FOLDER ? 'folder' : 'Sheet') + '.');
  return j.id;

async function cellIs(id, a1, want) { try { const v = await getVals(id, a1); return !!(v[0] && String(v[0][0]).trim() === want); } catch (e) { if (e.signin) throw e; return false; } }
async function findAcct() {
  const folders = await driveList("name = '" + WL_FOLDER + "' and mimeType = '" + MIME_FOLDER + "' and 'root' in parents");
  const out = { folder: '', sheet: '', food: '', logOk: false, foodOk: false };
  for (const fo of folders) {
    const files = await driveList("'" + fo.id + "' in parents and mimeType = '" + MIME_SHEET + "'");
    const lg = files.find(f => f.name === WL_LOG), fd = files.find(f => f.name === WL_FOOD);

  }
  if (out.sheet) out.logOk = await cellIs(out.sheet, q1(NEW_LOG_TAB) + '!J1', 'Exercise');   // written last by initLogW
  if (out.food) out.foodOk = await cellIs(out.food, q1('Body metrics') + '!A1', 'Date');     // written last by initFoodW

}
const wlHead = (sid, cols) => ({ repeatCell: { range: { sheetId: sid, startRowIndex: 0, endRowIndex: 1, startColumnIndex: 0, endColumnIndex: cols },
  cell: { userEnteredFormat: { textFormat: { bold: true, foregroundColor: { red: 1, green: 1, blue: 1 } }, backgroundColor: WL_NAVY } }, fields: 'userEnteredFormat(textFormat,backgroundColor)' } });
const wlText = (sid, r0, r1, c0, c1) => ({ repeatCell: { range: { sheetId: sid, startRowIndex: r0, endRowIndex: r1, startColumnIndex: c0, endColumnIndex: c1 }, cell: { userEnteredFormat: { numberFormat: { type: 'TEXT' } } }, fields: 'userEnteredFormat.numberFormat' } });

// finds or makes the folder and whichever of the two Sheets is wanted; returns their IDs
async function makeAcct(tz, wantLog, wantFood) {
  needDriveScope();
  const f = await findAcct();
  const folder = f.folder || await wlFolder(true);
  ls.set(K_FOLDER, folder);
  let sheet = f.logOk ? f.sheet : '', food = f.foodOk ? f.food : '';
  if (wantLog && !sheet) {
    if (f.sheet) { try { await gfetch(DRIVE + '/' + f.sheet, { method: 'PATCH', body: JSON.stringify({ trashed: true }) }); } catch (e) { if (e.signin) throw e; } }
    sheet = await driveMake(WL_LOG, MIME_SHEET, folder); await initLogW(sheet, tz);
  }
  if (wantFood && !food) {
    if (f.food) { try { await gfetch(DRIVE + '/' + f.food, { method: 'PATCH', body: JSON.stringify({ trashed: true }) }); } catch (e) { if (e.signin) throw e; } }
    food = await driveMake(WL_FOOD, MIME_SHEET, folder); await initFoodW(food, tz);
  }
  return { folder, sheet, food };
}
async function api_create(tz) {
  const a = await makeAcct(tz, true, !(await foodIdGet()));
  await cfgSet({ sheetId: a.sheet, tab: NEW_LOG_TAB, folder: a.folder, created: new Date().toISOString() });
  if (a.food) await foodIdSet(a.food, true);
  return api_init();
}
async function api_useExisting(link, tab) {
  const mm = /\/d\/([a-zA-Z0-9_-]{20,})/.exec(String(link)) || /^([a-zA-Z0-9_-]{20,})$/.exec(String(link).trim());
  if (!mm) throw new Error('That does not look like a Google Sheets link.');
  if (!hasScope(SCOPE_SHEETS)) throw needFull();
  let m;
  try { m = await meta(mm[1]); }
  catch (e) { if (e.signin) throw e; throw new Error('Could not open that Sheet with your Google account (' + e.message + '). If it is someone else\'s, ask them to share it with you (Editor).'); }
  const names = (m.sheets || []).map(s => s.properties.title);

  await cfgSet({ sheetId: mm[1], tab, created: new Date().toISOString() });
  return api_init();
}

let saving = false;
async function api_save(entries, iso) {
  if (!Array.isArray(entries) || !entries.length) throw new Error('Nothing to save.');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) throw new Error('Bad session date.');
  entries = entries.map(e => ({ name: String(e.name).trim(), w: String(e.w == null ? '' : e.w).trim(), r: String(e.r == null ? '' : e.r).trim() })).filter(e => e.name && !NOT_EX.test(e.name));
  if (saving) throw new Error('Another save is still running. Try again in a moment.');
  saving = true;
  try {
    const L = await openLogW(), id = L.id, tab = L.c.tab, sid = L.tabs[tab];
    const exRows = await readExW(id), kinds = kinds_(exRows), units = units_(exRows);
    const HEAD = 300, SENT = ['\u0000more', '', '', ''];
    const plan = (rows, full) => {
      let lead = 0; while (lead < rows.length && rows[lead].join('') === '') lead++;
      const core = rows.slice(lead).concat(full ? [] : [SENT]), M = merge_(core, entries, iso, kinds, units), out = M.out;
      let m = 0; while (m < core.length && m < out.length && core[core.length - 1 - m].join('\u0001') === out[out.length - 1 - m].join('\u0001')) m++;
      return { out, m, oldN: core.length + lead - m, newN: out.length - m, added: M.added };
    };
    let rows = await readArchW(id, tab, HEAD), full = rows.length < HEAD, P = plan(rows, full);
    if (!full && P.m === 0 && P.added) { rows = await readArchW(id, tab, 0); full = true; P = plan(rows, true); }
    const skipped = entries.length - P.added;
    if (!P.added) return { added: 0, skipped, ok: true };
    const top = P.out.slice(0, P.newN);
    if (top.some(r => r === SENT)) throw new Error('Could not place the session in the archive. Nothing was written.');
    const delta = P.newN - P.oldN, grid = { sheetId: sid, startColumnIndex: 9, endColumnIndex: 13 };
    if (delta > 0) await batch(id, [{ insertRange: { range: Object.assign({ startRowIndex: 1, endRowIndex: 1 + delta }, grid), shiftDimension: 'ROWS' } }]);
    if (delta < 0) await batch(id, [{ deleteRange: { range: Object.assign({ startRowIndex: 1, endRowIndex: 1 - delta }, grid), shiftDimension: 'ROWS' } }]);
    if (top.length) await putVals(id, q1(tab) + '!J2:M' + (top.length + 1), top.map(cell_));
    const back = await readArchW(id, tab, P.newN + 1);
    const want = P.out.slice(0, P.newN + 1).filter(r => r !== SENT);
    const ok = want.every((r, i) => (back[i] || [])[0] === r[0]);
    return { added: P.added, skipped, ok };
  } finally { saving = false; }
}
async function api_tidyNames(pairs) {   // Web 0.3q: Library › Tidy exercise names: rename in the log (column J) and the Exercises tab (column C)
  const map = new Map((pairs || []).map(p => [String(p[0]), String(p[1])]));
  const swap = c => { const s0 = String(c == null ? '' : c), pre = (s0.match(/^\d+ /) || [''])[0], b = s0.slice(pre.length).trim(); return map.has(b) ? pre + map.get(b) : s0; };
  const L = await openLogW(), id = L.id;
  const col = async (tab, c) => {
    const v = (await getVals(id, q1(tab) + '!' + c + '2:' + c)).map(r => r[0] == null ? '' : String(r[0]));
    const nv = v.map(swap), k = nv.filter((x, i) => x !== v[i]).length;
    if (k) await putVals(id, q1(tab) + '!' + c + '2:' + c + (v.length + 1), nv.map(x => [x]));
    return k;
  };
  const logN = await col(L.c.tab, 'J'), exN = await col(EX_TAB, 'C');
  return { logN, exN };
}
async function api_addExercise(row, full) {
  if (!Array.isArray(row) || row.length < 6) throw new Error('Bad exercise data.');
  full = String(full || '').trim();
  const cat = String(row[1]), unit = String(row[5]);
  if (!full || CATS.indexOf(cat) < 0 || UNITS.indexOf(unit) < 0) throw new Error('Name, category and unit are needed.');
  const L = await openLogW(), id = L.id, exSid = L.tabs[EX_TAB];
  const rows = await readExW(id);
  const bare = full.replace(/^\d+ /, '').toLowerCase();
  if (rows.some(r => String(r[2]).trim().replace(/^\d+ /, '').toLowerCase() === bare)) throw new Error('That exercise is already in the Exercises tab.');
  const nm = r => String((r && r[2]) || '').trim(), pre = prefix_(full);
  let at = -1;
  if (pre) {
    rows.forEach((r, i) => { if (prefix_(nm(r)) === pre) at = i + 1; });
    if (at < 0) rows.forEach((r, i) => { if (prefix_(nm(r))) at = i + 1; });
  }
  if (at < 0) {
    const end = rows.findIndex(r => /^end workout$/i.test(nm(r)));
    at = end >= 0 ? end : rows.length;
    while (at > 0 && !(rows[at - 1] || []).join('').trim()) at--;
  }
  let src = -1, dist = 1e9;
  rows.forEach((r, i) => { if (String(r[1] || '').trim().toLowerCase() === cat && Math.abs(i - at) < dist) { src = i; dist = Math.abs(i - at); } });
  const sheetRow = at + 2;
  const reqs = [{ insertDimension: { range: { sheetId: exSid, dimension: 'ROWS', startIndex: sheetRow - 1, endIndex: sheetRow }, inheritFromBefore: true } }];
  if (src >= 0) { const sr = (src >= at ? src + 1 : src) + 2;
    reqs.push({ copyPaste: { source: { sheetId: exSid, startRowIndex: sr - 1, endRowIndex: sr, startColumnIndex: 0, endColumnIndex: 6 }, destination: { sheetId: exSid, startRowIndex: sheetRow - 1, endRowIndex: sheetRow, startColumnIndex: 0, endColumnIndex: 6 }, pasteType: 'PASTE_FORMAT' } }); }
  await batch(id, reqs);
  await putVals(id, q1(EX_TAB) + '!A' + sheetRow + ':F' + sheetRow, [['', cat, full, String(row[3] || ''), String(row[4] || ''), unit]]);
  const back = await getVals(id, q1(EX_TAB) + '!C' + sheetRow);
  if (!back[0] || String(back[0][0]).trim() !== full) throw new Error('The new row did not read back as expected. Please look at the Exercises tab.');
  return { row: sheetRow };
}

// owner check (Lite 0.1f): compares a SHA-256 of the signed-in email with OWNER_HASH from Code.gs
async function ownerW(email) {
  try { const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(email || '').trim().toLowerCase()));
    return [...new Uint8Array(d)].map(x => x.toString(16).padStart(2, '0')).join('') === OWNER_HASH; } catch (e) { return false; }
}

async function api_plansSave(mine) {
  if (!Array.isArray(mine)) throw new Error('Bad plan data.');
  const L = await openLogW(), id = L.id, tab = L.c.tab;
  if (!(PLAN_TAB in L.tabs)) {                                   // first plan or star in this Sheet: make the Plan tab
    const r = await batch(id, [{ addSheet: { properties: { title: PLAN_TAB, gridProperties: { rowCount: 1000, columnCount: 11, frozenRowCount: 1 } } } }]);
    const sid = r.replies[0].addSheet.properties.sheetId;

      { repeatCell: { range: { sheetId: sid, startRowIndex: 0, endRowIndex: 1000, startColumnIndex: 0, endColumnIndex: 11 }, cell: { userEnteredFormat: { numberFormat: { type: 'TEXT' } } }, fields: 'userEnteredFormat.numberFormat' } },
      { repeatCell: { range: { sheetId: sid, startRowIndex: 0, endRowIndex: 1, startColumnIndex: 0, endColumnIndex: 11 }, cell: { userEnteredFormat: { textFormat: { bold: true, foregroundColor: { red: 1, green: 1, blue: 1 } }, backgroundColor: { red: 20 / 255, green: 40 / 255, blue: 75 / 255 } } }, fields: 'userEnteredFormat(textFormat,backgroundColor)' } }
    ]);
    await putVals(id, q1(PLAN_TAB) + '!A1:K1', [PLAN_HEAD]);
  }
  const fresh = await readPlanW(id), others = fresh.filter(r => r.join('') !== '' && r[0] !== tab);
  const rows = mine.map(r => { const o = pad11_(r); o[0] = tab; return o; });
  const all = others.concat(rows);
  if (all.length > 2000) throw new Error('The Plan tab is full.');
  const n = Math.max(fresh.length, all.length);
  if (n) await putVals(id, q1(PLAN_TAB) + '!A2:K' + (n + 1), all.concat(Array.from({ length: n - all.length }, () => pad11_([]))));
  const back = (await readPlanW(id)).filter(r => r[0] === tab);
  if (back.length !== rows.length) throw new Error('The Plan tab did not read back as expected.');
  return { ok: true };
}

// adds any missing tab with its header, and missing columns (e.g. Fiber) to tabs that are too narrow
async function foodEnsure(id) {
  const m = await foodMeta(id), have = {};
  (m.sheets || []).forEach(x => { have[x.properties.title] = x.properties; });
  for (const [name, headRow, cols] of FOOD_TABS) {
    const p = have[name];
    if (!p) {
      await batch(id, [{ addSheet: { properties: { title: name, gridProperties: { rowCount: 1000, columnCount: cols, frozenRowCount: 1 } } } }]);
      await putVals(id, q1(name) + '!A1', [headRow]);
      continue;
    }
    const n = (p.gridProperties && p.gridProperties.columnCount) || 0;
    if (n < cols) await batch(id, [{ appendDimension: { sheetId: p.sheetId, dimension: 'COLUMNS', length: cols - n } }]);
    const h = (await getVals(id, q1(name) + '!A1:' + String.fromCharCode(64 + headRow.length) + '1'))[0] || [];
    if (!h.length) await putVals(id, q1(name) + '!A1', [headRow]);
    else if (h.length < headRow.length) await putVals(id, q1(name) + '!' + String.fromCharCode(65 + h.length) + '1', [headRow.slice(h.length)]);
  }
  return m;
}

// google.script.run look-alike, so the page works unchanged
function runner() {
  let ok = () => {}, no = () => {};
  const p = new Proxy({}, { get(_, k) {
    if (k === 'withSuccessHandler') return f => { ok = f; return p; };
    if (k === 'withFailureHandler') return f => { no = f; return p; };
    return (...a) => {
      const fn = API[k];
      if (!fn) { no(new Error('Unknown action ' + String(k))); return; }
      Promise.resolve().then(() => fn.apply(null, a)).then(v => ok(v == null ? v : JSON.parse(JSON.stringify(v))), e => no(e));
    };
  } });
  return p;
}

  els.forEach(e => { e.style.fontSize = ''; });
  const job = els.map(e => ({ e, w: e.clientWidth, sw: e.scrollWidth })).filter(j => j.w && j.sw > j.w + 1);
  job.forEach(j => { j.fs = parseFloat(getComputedStyle(j.e).fontSize); j.lo = Math.max(9.5, Math.round(j.fs * 7) / 10); j.f = Math.max(j.lo, Math.floor(j.fs * j.w / j.sw * 10) / 10); });
  job.forEach(j => { j.e.style.fontSize = j.f + 'px'; });
  job.forEach(j => { while (j.f > j.lo && j.e.scrollWidth > j.e.clientWidth + 1) { j.f = Math.max(j.lo, j.f - .5); j.e.style.fontSize = j.f + 'px'; } });
}

   Now: 1) the set rows get shorter (down to 34 px), 2) then the picture (down to 80 px), 3) if it still does not fit, the
   page gets room under it so it scrolls past the bottom bar. */

  c.style.removeProperty('--fx-h'); if (pic) { pic.style.minHeight = ''; pic.classList.remove('fxs'); }
  const tb = document.querySelector('.tabbar'), tr = tb ? tb.getBoundingClientRect() : null;

const NX_SMALL = new Set(['a', 'an', 'and', 'of', 'to', 'with', 'on', 'in', 'the', 'for', 'or', 'at']);
function nxTitle(s) {
  return String(s || '').trim().replace(/\s+/g, ' ').split(' ').map((w, i) => w.split('-').map((p, j) => {
    const lead = (p.match(/^[^A-Za-z]*/) || [''])[0], rest = p.slice(lead.length);
    if (!rest) return p;
    if (/[A-Z]/.test(rest.slice(1))) return p;   /* keep EZ, TRX, McGill */
    if ((i || j) && NX_SMALL.has(rest.toLowerCase())) return lead + rest.toLowerCase();
    return lead + rest.charAt(0).toUpperCase() + rest.slice(1).toLowerCase();
  }).join('-')).join(' ');
}
function nxNorm(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').trim().split(/\s+/).map(w => w.replace(/(e?s)$/, '')).join(''); }

['0.3s', '11212026', 'Matches the full app Ver 0.3s (its 0.3r.9 to 0.3r.88; 0.3r.1 to 0.3r.8 were already here): the whole app uses the Apple system font; new colour themes Blue + Purple and Black + Gold, every theme has its own page colour, and Studio shows both theme colours; softer buttons; Settings › Appearance has Auto as a third picture next to Light and Dark; Home: the Start workout button is lighter and reads in lines (Start workout, day type, exercises planned), a Shortcuts tile with Week and Food buttons, bigger muscle names on Muscles worked; the loading screen no longer flashes the Go Blue colours; Plan my week: workday templates can have their own names, exercises show their picture and muscles while picking, the picked ones sit in a light row at the top; Carb week: at most 2 high and 2 low days; pictures for 40 more exercises and better Front Squat, Stair Climber, Elliptical, Stationary Bike, Dead Hang, Cable Serratus Punch and Preacher Curl pictures; ready-made profile pictures (gym, animals, cars, aircraft); Library opens tidy: tap a muscle group to see its exercises around the body; Progress chart: the exercise name is a small picker in the corner of the graph, a pin makes it the one shown when the tab opens, a small 3M / 6M / 1Y / All switch and a Show body weight toggle on the chart; rest timer changes colour as it runs out, shrinks into a small timer when you tap Finished, and two taps on it stop the rest; Start workout: the “not saved yet” notice no longer comes back after Discard; Food: a future day can be looked at but not edited, and fiber is never counted as over; Profile › Week plan: one row per plan with Edit, Use and Delete; an Add to Home Screen guide for people who open the link in a browser; Settings › About › Delete all my data (moves your Workout Lite folder to the Drive Trash and clears this phone); Test mode screens have Back to tests. Removed: the Next up tile on Home, the Automatic switch row, the big Measure and Exercise cards above the charts, the Google web fonts.'],
  ['0.3r.8', '11202026', 'Matches the full app: Get started guide for a new person, in this order: name, weight, light or dark (with Automatic), style, color theme, week plan (training days, experience), food plan (goal, body, weight trend), then your setup. Every question has Skip (keeps what you have now, or the usual answer), and Quit is now Skip for now (come back from Profile › Redo setup). Removed: the combined Look step.'],
  ['0.3r.7', '11202026', 'Matches the full app: Until you choose a name, the app calls you by the first part of your Google sign-in email (for example shaoqiangqiang from shaoqiangqiang@gmail.com): Home, Profile, Settings and the name question start with it. It is not saved as your name.'],
  ['0.3r.6', '11202026', 'Matches the full app: One corner size for every card (12 px; cards had 10, 12 or 14) and one spacing: 12 px between cards on every tab, Home included; headings have more room above than below; Start workout cards no longer have extra space between them.'],
  ['0.3r.5', '11202026', 'Matches the full app: Start workout: the plan row is one plain row: a small grey Plan label, the plan name in a rounded box with a small arrow, and Adjust plan as plain text (no underline).'],
  ['0.3r.4', '11202026', 'Matches the full app: The thin red line on the right edge of things you can swipe away is gone (a test: does the swipe still feel natural without it?). Removed: the red swipe-to-remove line.'],
  ['0.3r.3', '11202026', 'Matches the full app: Home: Start workout is in normal letters instead of capitals, a little lower, and the day type under it is lighter.'],
  ['0.3r.2', '11202026', 'Matches the full app: Go Blue headings (My foods, Eaten, My week, Week plan, Latest, Muscles worked) are small grey capitals in the normal font, like Settings › Appearance; the Food date title is in normal letters. Studio keeps its own headings.'],
  ['0.3r.1', '11202026', 'Matches the full app: Dark mode: the Start / Edit buttons on Start workout are gold-outlined, so they no longer disappear into the dark card.'],
  ['0.3r', '11202026', 'Matches the full app Ver 0.3r (its 0.3q.11 to 0.3q.33; 0.3q.1 to 0.3q.10 were already here): Settings › Appearance in the iPhone Settings style (Light / Dark pictures with an Automatic switch, Style and Color theme cards) and Settings › Exercise pictures (Still / Moving); the loading screen’s logo flies to the header logo; usage count on; Front Squat, Stationary Bike, Elliptical and Stair Climber added; Forest + Mint colour theme; Home test switch (Under / Fit / Over) in Test mode; week plans made with the calendar builder (workday templates to drag onto days, Repeat and Warm-up pills, plan templates from your saved plans), and a plan in use always fills Today; My week calendar with body icons and carb pills; body type pictures; pick up to two warm-ups, shown as small tabs on the warm-up card; compact Today cards, all the same size, with long names in a smaller font instead of cut off; calmer highlight numbers in tiles and cards; faster start (the copy on the phone shows Home at once, picture data read only when needed); a tab always opens in its starting state.'],
  ['0.3q.33', '11202026', 'Matches the full app: Faster start, part 3: the exercise picture data (about a third of the page) is read only when a picture is first shown, so the app has much less to read before Home appears; with the phone’s copy the loading screen leaves as soon as Home is laid out (was a fixed wait); Home fits the muscle names in one step instead of many. Removed: unused code and styles left from earlier versions. Settings › About says whether this start used the copy on the phone.'],
  ['0.3q.32', '11202026', 'Matches the full app: Calmer highlights: the big numbers and words in tiles and cards (Home rings and Next up, Body and Progress values and day cards, Profile name and tiles, Today plan picker, Usage, set page and Week builder headings) are smaller and semi-bold, about one and a half times their labels instead of twice, with units a little larger; they still stand out.'],
  ['0.3q.31', '11202026', 'Matches the full app: Start workout: every closed exercise card is the same size (the warm-up card too); a long name, muscle line or last-session line gets a smaller font so it fits instead of being cut off, and Finished / sets entered sits under the button on two short lines.'],
  ['0.3q.30', '11202026', 'Matches the full app: Today: your one or two warm-ups are small tabs under the Warm-up title (closed card and exercise page), so the warm-up card is as small as the other cards.'],
  ['0.3q.29', '11202026', 'Matches the full app: Today: the warm-up card keeps the title Warm-up when you switch between your warm-ups; the tabs show which one.'],
  ['0.3q.28', '11202026', 'Matches the full app: A week plan in use now always fills its workout days on Today; the Start each day with the plan switch is gone. On Today, + New plan and Edit plans open the new calendar builder. Today cards are compact rows (small picture, name, last session, Start on the right), so many more fit on the screen.'],
  ['0.3q.27', '11202026', 'Matches the full app: New and edited week plans start with the workout days of your saved plans as ready templates. The calendar figure flexes both biceps and is drawn with thinner lines. Switching tabs always shows the tab as it starts: everything opened on the last visit (sections, sheets, sub-pages, the open exercise page, searches) is closed again, and the Food tab is back on today. Your typed sets stay.'],
  ['0.3q.26', '11202026', 'Matches the full app: Profile calendar: one body figure for every workout day: the top half in gold on upper body days, the legs in gold on lower body days, and the whole figure in gold on combined days (the rest stays grey).'],
  ['0.3q.25', '11202026', 'Matches the full app: Body type: choose from three figure pictures (Ecto, Meso, Endo) with a round check under each, like Light / Dark; under them, what the chosen type means (for example: hard to gain weight whatever you eat) and its daily carbs, protein and fat per kg.'],
  ['0.3q.24', '11202026', 'Matches the full app: Week plans are made with the new builder: on your profile, + New plan and Edit open the calendar builder (plan name at the top, workday templates to drag onto days, Repeat and Warm-up pills, Save plan). Tapping Edit workout on a day opens it there. A new plan is put in use. Gold pills and this week’s band show real gold in Studio too.'],
  ['0.3q.23', '11202026', 'Matches the full app: Me page: My week is a calendar of last, this and next week (this week highlighted, the others grey) with an upper / lower / combined body icon on workout days and an H / M / L carb pill under each day; tap a day as before. Repeat and Warm-up are gold pills under it (tap to turn on or off; a plan can now run once); your warm-ups are listed beside the pill in small text. Week plan cards show only the plan name. The Week builder uses the same gold pills.'],
  ['0.3q.22', '11202026', 'Matches the full app: Week builder: Repeat and Warm-up are two slim rows inside the calendar card, each with an on/off switch on the right; your warm-ups are listed beside Warm-up, one per line in small text (tap to change).'],
  ['0.3q.21', '11202026', 'Matches the full app: Week builder: Repeat and Warm-up are two toggle pills inside the calendar card (no separate card). Settings that vanish from the phone storage while the app is open are now put back at once (the style kept jumping from Studio to Go Blue on a tab change); if it happens, Settings › About › Version says so.'],
  ['0.3q.20', '11202026', 'Matches the full app: Warm-up picker is one compact list (Cardio / All switch, picks numbered in place, Create your own as the last row); the Week builder’s Repeat and Warm up switches share one card, and its calendar shows the days around your range in grey. Readable picks in dark mode: the chosen warm-ups (and the picked exercises, muscle chips and warm-up tabs) use the theme’s accent colours, so their text no longer disappears on a gold pill.'],
  ['0.3q.19', '11202026', 'Matches the full app: Warm-up your way: pick up to two warm-ups (Treadmill, Stationary Bike, Elliptical, Stair Climber, any other exercise, or create your own); the plan puts the first one on Today, and tabs at the top of the warm-up card switch between them. Change them on that card, in the plan editor under Warm-up first, or in the Week builder (test), which also has a Warm up first switch to skip it. Stationary Bike, Elliptical and Stair Climber added to the exercise list. New colour theme Forest + Mint (green).'],
  ['0.3q.18', '11202026', 'Matches the full app: Week builder: the highlight of a selected workday template now covers the whole row, edge to edge.'],
  ['0.3q.17', '11202026', 'Matches the full app: Week builder: times now count the rest between sets (about 12 min per exercise plus 10 min warm-up, so a 5-exercise day is about 70 min); time choices 45 / 60 / 90 minutes. [app only: a saved copy for Home in the app’s own store, Exercises and log read at the same time]'],
  ['0.3q.16', '11202026', 'Matches the full app: Test mode › Week builder: the calendar starts today and shows only the number of days you choose, each under its weekday. The New workday steps look like the iPhone: a large question, one rounded list of choices with icons and a checkmark, a thin progress bar and Back / Cancel at the top; options A / B / C in a segmented switch; Use this workday as one big button. Picking exercises yourself uses the same list with round + buttons, and the picked ones show as small pills you tap to remove.'],
  ['0.3q.15', '11202026', 'Matches the full app: Faster start: when the phone has a copy of your data, the loading screen leaves as soon as Home is drawn (before, it waited for the Sheets, up to 2.5 s) and its fly-to-the-logo is shorter (0.46 s instead of 0.78 s). Fresh data from the Sheets still updates Home a moment later. The very first open on a phone still waits for the Sheets.'],
  ['0.3q.14', '11202026', 'Matches the full app: Test mode › Week builder looks like a real calendar: two weeks in a 7-column grid (Mon-Sun) with each day showing its workout as a coloured block and its time; days after the cycle are faded repeats. The days in the cycle are set with a small − / + stepper (2-10) instead of a row of numbers. Workday templates are an iPhone-style list under the calendar: hold one and drag it onto a day, or tap it then tap a day; Edit on each row. Cleaner Apple-style cards and buttons.'],
  ['0.3q.13', '11202026', 'Matches the full app: Test mode: the three Home tests (under target, just fit, over target) are one test; on Home the amber bar has an Under / Fit / Over switch to change between them.'],
  ['0.3q.12', '11202026', 'Matches the full app: Front Squat added to the exercise list (legs, weight and reps) with its own picture and moving picture: bar on the front of the shoulders, elbows high, torso upright, hips straight down to thighs about level.'],
  ['0.3q.11', '11202026', 'Matches the full app: Test mode › Week builder (new, nothing saved): build a day by muscle with Assistant mode (what to train, which muscles, where, how much time, then 2-3 options with coach notes and the estimated time) or Pick myself (muscle chips, tap exercises, the time adds up as you pick). Built days sit as cards above a calendar of 2-10 days; drag a card onto a date (hold, then move) or tap it and tap a date. An empty date offers Build a new day, Copy an existing day (also from the plan in use) or Rest day. Repeat as my routine switch.'],
  ['0.3q.10', '11172026', 'Matches the full app: Settings › Appearance in the iPhone Settings style: small grey headings over separate cards with space between, and smaller text. The first card has just Light and Dark pictures with round buttons, and an Automatic switch under them (follows the phone; tapping Light or Dark turns it off). Style and Color theme are back to their earlier buttons, each in its own card. Removed: the Auto picture and the Style and Color theme pictures.'],
  ['0.3q.9', '11172026', 'Matches the full app: Settings › Appearance looks like the phone’s own Appearance page: Mode (Light, Dark, Auto), Style (Go Blue, Studio) and Color theme each show small pictures of the app, a short name and, a little lower, a small round button that fills gold with a check; Exercise pictures uses the same smaller names and buttons. Removed: the hint lines under each choice.'],
  ['0.3q.8', '11172026', 'Matches the full app: Loading screen to Home: the app icon on the loading screen shrinks and flies up into the icon at the top left, the greeting fades away, and Home rises in behind it (before, the loading screen just faded). With Reduce Motion on it still simply fades.'],
  ['0.3q.7', '11172026', 'Matches the full app: Settings › Exercise pictures looks like the phone’s own Appearance choice: each option is just its picture, its name and a round button under it; the chosen one fills gold with a check. Removed: the Start / End / Moving captions, the lines under the names and the boxes around the options.'],
  ['0.3q.6', '11172026', 'Matches the full app: Settings: Moving exercise pictures is now Exercise pictures; its row shows Still or Moving and opens a page with the two choices side by side: Still (a start and an end picture) and Moving (the picture looping), each with a round button that fills gold when chosen. The samples are a new barbell overhead press drawing, still and moving. Removed: the on / off switch in the row.'],
  ['0.3q.5', '11172026', 'Matches the full app: Settings: the Moving exercise pictures row is now the same height as the other rows (an empty box under it made it taller).'],
  ['0.3q.4', '11172026', 'Matches the full app: Settings: Appearance is one row again, like most apps: its page has Mode (Light, Dark or Auto, which follows the phone), then Style, then Color theme; the row shows your choice on the right (e.g. Auto · Studio · Navy). Moving exercise pictures stays its own switch row below it, without the START to END line. Removed: the separate Dark mode, Style and Color theme rows, and the Dark mode and Follow the phone setting switches (now the Mode buttons).'],
  ['0.3q.3', '11172026', 'Matches the full app: Settings: Appearance is split into its own rows: Dark mode, Style and Color theme (each opens its own page; Style and Color theme show the current choice on the right). Moving exercise pictures is a row below them with a switch you tap right in the list. Removed: the App icon row (change your icon on the Profile page or by tapping the logo).'],
  ['0.3q.2', '11172026', 'Matches the full app: Appearance: the style you pick is always the one you see. Changing the color theme no longer flips the Style buttons to Go Blue while the screen stays Studio; Go Blue is now saved as a choice (before, it was saved as no choice, so an older Studio copy in your food Sheet could come back); a look left over from an unfinished Get started or Test mode no longer hides your saved one; and when the phone will not keep a setting, it is still used until you close the app and saved to your food Sheet.'],
  ['0.3q.1', '11172026', 'Matches the full app: Usage count is on: the web version (GitHub) now sends its once-a-day anonymous ping (a random code for the phone and the app version, no name or email), and Settings › About › Usage shows the real counts.'],
  ['0.3q', '11172026', 'Matches the full app Ver 0.3q (its 0.3p.7 to 0.3p.51; 0.3p.1 to 0.3p.6 were already here). Profile page (was Me: your icon, name, Weight / Body type / Goal tiles, My week with each day’s workout and carbs, the week plans); every Settings row opens its own page; Library: Tidy exercise names renames in the log, week plans and Exercises list, swipe between exercise cards, new and moving pictures (Warm-up run, Farmer Walk, Pull Up, Incline Bench Press and more); Get started picks your look and Test mode has a look and loading-screen page; Progress charts draw in from left to right and bodyweight exercises chart total reps; Food bars fill up when the tab opens; Muscles worked 7 / 30 is one toggle that slides; newest weight entry wins; settings kept safer in the food Sheet; A-Z strips land under your finger and lists have search boxes with a clear button; rest timer fills up again and closes with a tap anywhere; the set wheel enters the value you left alone. New: Settings › About › Usage (owner only) shows how many people use the web version: people, last 7 and 30 days, new this week, and versions. Web: once a day after sign-in the app sends an anonymous usage ping (a random code for this phone and the app version, no name or email; About says so); Tidy exercise names works through the web’s own Sheet access; the starter exercise list uses the tidied names. Left out (full app only): Body tab changes and Renpho import names.'],
  ['0.3p.51', '11162026', 'Matches the full app: Progress and Body pickers: the A-Z strip lands on the letter under your finger, and a letter with nothing under it goes to the nearest letter that has names (P now shows Pull Up). Body › Choose measure now has the A-Z strip too, in A-Z order. Both lists have a search box at the top: type any part of the name.'],
  ['0.3p.50', '11162026', 'Matches the full app: Progress chart: exercises you log without weight (every set 0 or blank, such as Core Trainer) now chart the total reps of the day, all sets added up, like Pull Up. Once you log a weight for one, it goes back to the heaviest-set chart.'],
  ['0.3p.49', '11162026', 'Matches the full app: Rest timer: when the rest is over, tap anywhere on the timer to close it, not only on the Close word.'],
  ['0.3p.48', '11162026', 'Matches the full app: Set wheel: when you change only the reps (or only the weight) on a later set, the other value you left alone is now entered too, taken from the set before. Before, the weight stayed empty even though the wheel showed it.'],
  ['0.3p.47', '11162026', 'Matches the full app: Warm-up: the rest timer is gone from the warm-up page, since a warm-up needs no rest. Its sets use the full width.'],
  ['0.3p.46', '11162026', 'Matches the full app: Settings: Profile is now a normal row at the top of the list, with a person icon, like the other rows (it was a separate card that made the page wider than the screen). Update body metrics has a flexing-arms icon. No page needs a sideways swipe to see everything.'],
  ['0.3p.44', '11162026', 'Matches the full app: The Me page is now called Profile. In Settings its row reads Profile, with just your name under it.'],
  ['0.3p.43', '11162026', 'Matches the full app: Search boxes (Library, week-plan day page, Food list): a small round x at the right clears what you typed at once; it shows only while there is text.'],
  ['0.3p.42', '11162026', 'Matches the full app: Farmer Walk picture: the arms and dumbbells stay still at the sides while the legs walk (as with heavy dumbbells).'],
  ['0.3p.41', '11162026', 'Matches the full app: Farmer Walk picture: the arms and dumbbells now swing with each step (opposite to the legs).'],
  ['0.3p.40', '11162026', 'Matches the full app: Library: the page behind an open exercise card no longer scrolls.'],
  ['0.3p.39', '11162026', 'Matches the full app: Pull Up picture: the whole bar is drawn, running away from you, with both hands on it.'],
  ['0.3p.38', '11162026', 'Matches the full app: Incline Bench Press picture: he now lies with his back on the backrest (the backrest was drawn on his chest).'],
  ['0.3p.37', '11162026', 'Matches the full app: Pictures: Farmer Walk now walks (a looping stride, dumbbells at the sides); Cable face pull keeps the elbows pointing down as the rope comes to the face; Dead Hang bends the knees forward with the feet back and down; Pull Up faces the bar (the bar is seen end-on) and the chest comes up to it; Battle Ropes whip in fast, big waves; Seated Dumbbell Press has an upright (90 degree) seat back. Names: Exercise names: the Tidy card in the Library now also fixes spelling, so all names match: Incline Bench Press, Cable Lateral Raise, Core Trainer, Cable Face Pull, Chest Fly, Decline Medicine Ball Sit-Up, Triceps Pushdown, Low-to-High Cable Chest Fly. Pictures stay with the renamed exercises. Names you hid before show up again.'],
  ['0.3p.36', '11162026', 'Matches the full app: Library: in an exercise card, swipe left or right (or tap the small arrows next to the muscle line) for the next or previous exercise. While a search or keyword is on, it steps through the matches only.'],
  ['0.3p.35', '11162026', 'Matches the full app: Settings: every row (Appearance, Body metrics, About) now opens its own page instead of folding open; the return button at the bottom right (Settings icon) takes you back to Settings.'],
  ['0.3p.33', '11162026', 'Matches the full app: Me page: a return button at the bottom right shows the icon of the page you came from (house for Home, gear for Settings, and so on) and takes you back there.'],
  ['0.3p.32', '11162026', 'Matches the full app: Warm-up picture: now really runs. The moving picture loops a running stride on the treadmill (feet land, push back with the belt, heels fold up, knees drive forward, arms swing opposite); the still shows two points of the stride.'],
  ['0.3p.31', '11162026', 'Matches the full app: Home, Muscles worked: "days" is outside the pills again (30 · 7 · days); the pills stay bigger, the chosen one in front.'],
  ['0.3p.30', '11162026', 'Matches the full app: Home, Muscles worked: 30 is now on the left and 7 on the right.'],
  ['0.3p.29', '11162026', 'Matches the full app: Home, Muscles worked: the chosen pill is bigger and now reads "7 days" or "30 days"; the other number sits small and half hidden behind it. Tapping swaps them with a smooth slide.'],
  ['0.3p.28', '11162026', 'Matches the full app: Home, Muscles worked: the same for 30: when 7 days is on, the 30 pill sits half hidden behind 7. The back number always stays partly visible.'],
  ['0.3p.27', '11162026', 'Matches the full app: Home, Muscles worked: when 30 days is on, the 7 pill moves back and sits half hidden behind 30.'],
  ['0.3p.26', '11162026', 'Matches the full app: Home, Muscles worked: the 7 / 30 switch no longer swings out and back; the tapped pill just grows to the front and the other shrinks behind it, with no step backward at the end.'],
  ['0.3p.25', '11162026', 'Matches the full app: Home header: the sync pill sits right after the date instead of on its own row, so the header is one line shorter.'],
  ['0.3p.24', '11162026', 'Matches the full app: Home: the name still ended in "…" on the iPhone (the size was worked out before the app\'s font loaded). Now the name never gets cut: it shrinks to fit one line, re-checked once the font loads, and otherwise goes on two lines.'],
  ['0.3p.23', '11162026', 'Matches the full app: Home: the whole name shows (the greeting shrinks to fit, then uses two lines). Tap the logo or the name to open the Me page; the pencil is now a tiny mark at the name\'s upper right. Weight: the newest entry always wins, whether it is a Renpho reading or a weight typed on the Food tab, the Me page, Get started or the Pull Up card (no 7-day average, no Auto / Manual).'],
  ['0.3p.22', '11152026', 'Matches the full app: Home, Muscles worked: 7 / 30 days is one toggle now: tap anywhere on it (either number or the word days) to switch, with the same carousel move.'],
  ['0.3p.21', '11152026', 'Matches the full app: Home, Muscles worked: the 7 / 30 switch no longer flips; the pills move like a carousel instead: the one you tap swings forward to the front and grows, the other swings backward and shrinks behind it.'],
  ['0.3p.20', '11152026', 'Matches the full app: Home, Muscles worked: switching between 7 and 30 days now turns the two pills around each other like a little carousel: the tapped one spins forward through the middle and grows, the other spins backward and shrinks behind it (about half a second).'],
  ['0.3p.19', '11152026', 'Matches the full app: Home, Muscles worked: the period switch is now two stacked pills, 7 and 30, with "days" on the right. The chosen one is bigger and in front; the other sits smaller behind it, still showing its pill and colour. Tapping the back one brings it forward with a short bounce while the other slips behind, then the chart changes.'],
  ['0.3p.18', '11152026', 'Matches the full app: Your name and the other app settings are kept safer in your food Sheet: if the Sheet could not be read when the app opened, the app no longer saves over it (that could replace your saved name with an empty one); it tries reading again instead. A setting missing on the phone keeps the Sheet’s copy; only clearing it yourself removes it. Type your name once more on the Me page; from then on it comes back after updates.'],
  ['0.3p.17', '11152026', 'Matches the full app: Me page: the Goal tile no longer says Not set for someone already set up: it shows the goal from Get started, or, when the questions were never answered, the same goal Get started would fill in (Get fitter). Tap it to change.'],
  ['0.3p.16', '11152026', 'Matches the full app: Get started: the plain "Quit · don’t save" text at the top right is now a round pill button with an × and Quit, so it is clear it can be tapped (it still leaves without saving anything).'],
  ['0.3p.15', '11152026', 'Matches the full app: New Me page, opened by tapping the logo (or Settings › Me): your icon (tap to change), name, and tiles for Weight, Body type and Goal; My week lists Monday to Sunday with each day’s workout from the plan in use and its carb level (High / Mid / Low); tap a day for one sheet with its exercises (Edit workout opens the day editor and comes back) and its carbs, with the grams for your weight. Quick set and Redo setup sit under the week, and the week plans (Edit, Use this plan, New plan, Start each day with the plan) are on this page now. Settings keeps a Me row on top; Week plan and Carb week moved out of it. Food › Plan my week and the plan pill on Start workout lead to the Me page.'],
  ['0.3p.14', '11152026', 'Matches the full app: Food tab: the nutrition bars (Calories, Carbs, Protein, Fat, Fiber) fill up from empty when the tab opens, one after another, quick at first and slowing down a lot at the end; after you add or remove food they glide to the new length the same way.'],
  ['0.3p.13', '11152026', 'Matches the full app: Rest timer: the ring fills up as the rest goes by again (since 0.3n.2 it emptied); the gold dot leads the filling edge.'],
  ['0.3p.11', '11152026', 'Matches the full app: Progress and Body: the exercise / measure picker is a box of one fixed size; the name stays on one line and its letters get smaller to fit, so the card looks the same for short and long names. The unit shows in small text under the box (e.g. Unit: lbs, Unit: kg); Body names no longer carry the unit in brackets. Chart draw-in: the dot moves slower (about 2-3 s) and slows down a lot as it reaches the end.'],
  ['0.3p.10', '11152026', 'Matches the full app: Charts on Progress and Body draw in when they show up: the line grows smoothly from left to right behind a glowing gold dot, each point and its label appear as the dot passes, and when the dot stops the latest value shows as a number next to the last point (new on Progress, e.g. 20 lbs). It plays again for a new exercise, measure or range, or when you come back to the tab; off with Reduce Motion.'],
  ['0.3p.9', '11152026', 'Matches the full app: Look: Get started has a new second step, Pick your look: tap a style (Go Blue or Studio) and a color theme and the app behind changes at once; Use this setup keeps it, Quit puts the old look back. The loading screen now takes its colours from the look as soon as it changes (it used to wait until Home had been open a moment). Test mode › Look and loading screen: try style, color theme and light or dark on one page, Play loading screen shows it once in that look (tap to end it early), Keep this look saves it; leaving the page puts your look back.'],
  ['0.3p.8', '11152026', 'Matches the full app: Library: the Tidy exercise names card has a Hide button that keeps the names as they are; the card comes back only if a new name in another style is added. Words in brackets are left alone, e.g. Farmer Walk (weight per hand).'],
  ['0.3p.7', '11142026', 'Matches the full app: Library: a Tidy exercise names card appears when some names are in another style (Chest fly): Review lists each change (Chest fly → Chest Fly) with a tick to leave any out, and Rename changes them in your workout log, week plans and favourites, the Exercises list and today’s unsaved session; past sessions keep their history. Exercise pictures are now found whatever the upper and lower case of the name.'],
  ['0.3p.6', '11142026', 'Matches the full app: Code tidy (no visible change): removed the red-notch styles (replaced by the second lap), the old spider-chart grow-in, and the old Test mode 5-tap switch and Turn off actions.'],
  ['0.3p.5', '11142026', 'Matches the full app: Home kcal and protein rings: more than 10% over the target now shows a second lap: after the ring fills, the ticks keep going round in red on top of it, as far as you are over (135% = 35% of a lap). Removed: the red notch above the ring (0.3p.1).'],
  ['0.3p.4', '11142026', 'Matches the full app: Test mode: three Home tests with made-up numbers (nothing saved): under target (rings part filled), just fit (checks and bursts) and over target (red notches); the amber bar shows which one is on. Replay Home animations keeps your real numbers.'],
  ['0.3p.3', '11142026', 'Matches the full app: Home protein ring works like kcal: within 10% of your protein target gets the check and burst, more than 10% over gets the red notch above the ring (longer the more you are over).'],
  ['0.3p.2', '11142026', 'Matches the full app: Home animations (rings, muscles chart, Last workout checks) now start only after the loading screen is completely gone and your data has loaded, so they play once with your real numbers instead of partly behind the loading screen.'],
  ['0.3p.1', '11142026', 'Matches the full app: Home kcal ring: when today is more than 10% over your kcal target, a red notch sticks out above the top of the ring, longer the more you are over (it grows in after the ring fills).'],
  ['0.3p', '11142026', 'Matches the full app Ver 0.3p (its 0.3o.1 to 0.3o.25). Home: rings fill as dial ticks with counting numbers, workouts this week in one block per training day, goal-reached burst and check (kcal within 10% counts); Muscles worked chart: points travel out from the centre together and slow into place while each count goes up, 7 or 30 days remembered; Last workout: up to 6 muscles that fit the card, checks pop in with a burst. Problems show in a red sync pill with a sheet and Retry instead of a card at the top. Start workout: return arrow from Week plan. Library: arm exercises move above the figure; Add an exercise has muscle chips, name suggestions, near-duplicate check and Title Case names. Exercise lists A to Z with an A–Z strip. Tab wheel: a tap opens the tab at once. Stopwatch shows hundredths. Food tiles keep the amount readable. Settings cards start collapsed; About holds Version and the owner’s Test mode (enter it, run tests, amber bar with Tests and Exit).'],
  ['0.3o.25', '11142026', 'Matches the full app: Test mode is now a place: Settings › About › Test mode has one row, Enter test mode, which opens a Test mode page with the tests to tap. While in test mode an amber striped bar stays under the header (Tests goes back to the list, Exit goes back to the app) and an amber frame goes around the screen. Removed: the test list inside About.'],
  ['0.3o.24', '11142026', 'Matches the full app: Settings › About now looks like the other Settings cards: Version and Test mode are flat sections with a bold title and a thin line between them, and the tests are plain rows with an arrow.'],
  ['0.3o.23', '11142026', 'Matches the full app: Settings › About: the Test mode card shows for the owner only.'],
  ['0.3o.22', '11142026', 'Matches the full app: Settings › About: the Test mode card is always there under Version (no more tapping the version line 5 times). Removed: the 5-tap switch and the Turn off test mode button.'],
  ['0.3o.21', '11142026', 'Matches the full app: Settings: the Version card is now called About; inside it, Version is the first card and Test mode (when turned on) the second.'],
  ['0.3o.20', '11142026', 'Matches the full app: Home, Muscles worked: the dots now leave the centre quickly and slow down as they reach their place (all still stop together), so the move has momentum. Settings › Test mode (tap the version line in Settings › Version 5 times to turn it on or off): preview the new-user Get started questions and the first-open screen, show a problem or a Not saved problem, and replay the Home animations. Nothing in a test changes your data. Removed: the Show a test problem button under Version (now in Test mode).'],
  ['0.3o.19', '11142026', 'Matches the full app: Home, Muscles worked: all points now move out from the centre together, start and arrive at the same time, smoothly and more slowly (1.5 seconds), so you can watch the dots travel and the counts go up.'],
  ['0.3o.18', '11142026', 'Home, Muscles worked: when Home opens, each point starts in the centre and travels out along its line to its value, one after another, and the gold area grows with them. Each muscle’s set count counts up from 0 as its point moves out. Home, Last workout: each green check ends with the goal-reached burst (a ring and sparks). Matches the full app: Home, Muscles worked: the 7 days / 30 days choice is remembered like your other settings (on this phone and in the Food settings tab of your Sheet), so Home opens on the one you used last.'],
  ['0.3o.17', '11142026', 'Matches the full app: Home, Last workout: when Home opens, the muscle names slide in and their green checks pop one by one, after the rings; the card shows at most 6 muscles.'],
  ['0.3o.16', '11142026', 'Matches the full app: A–Z strip on exercise lists works better on the iPhone: the letter comes from where your finger is on the strip (the gaps between letters count too), so a tap, a hold or a slide always picks a letter; the strip is wider, lights up while you touch it, and the iPhone press-and-hold menu no longer gets in the way.'],
  ['0.3o.15', '11142026', 'Matches the full app: Home, Muscles worked: when Home opens (first open or coming back from another tab), the gold area grows out of the centre with a small spring and the dots pop in one by one, together with the rings.'],
  ['0.3o.14', '11142026', 'Matches the full app: Stopwatch (Dead Hang) shows hundredths of a second while it runs (0:12.34); the saved time is still whole seconds. Exercise lists (Progress › Exercise and Start workout › Choose exercise) are A to Z with a letter heading for each letter and an A–Z strip on the right, like the iPhone: tap a letter or slide a finger along it to jump there. Favourites stay on top in Choose exercise. Removed: the Sheet order of the Progress exercise list.'],
  ['0.3o.13', '11142026', 'Matches the full app: Stopwatch exercises (Dead Hang): the tenths of a second now count up one by one (they used to jump by two), so the clock runs smoothly.'],
  ['0.3o.12', '11142026', 'Matches the full app: Library: when the sides of the body figure are full, arm exercises move to the band above the figure (they used to drop under it). Add an exercise: Muscle worked is picked from chips (Chest, Shoulders, Back, Biceps, Triceps, Forearms, Quads, Glutes, Hamstrings, Calves, Core, Cardio) so a new exercise always lands in the right place; typing a name suggests common exercises (a tap fills in category, unit and muscles) and shows matching ones already in your list; a name that is nearly the same as one you have (Chest Fly / chest flys) is caught; names are saved in Title Case. Removed: the free-text Muscle worked box.'],
  ['0.3o.11', '11142026', 'Matches the full app: Tab wheel: tapping a bubble opens that tab at once; turning the wheel with a swipe still opens the tab at the top after a short pause.'],
  ['0.3o.10', '11142026', 'Matches the full app: Problems (like Not saved or cannot reach Google Sheets) no longer show as a card at the top of the page: the sync pill in the header turns red (Not saved ⚠ or Problem ⚠), the message opens once in a sheet from the bottom with Retry, tapping outside closes it and tapping the red pill opens it again. Settings › Version has a Show a test problem button to see how it looks. Removed: the problem card at the top of each tab.'],
  ['0.3o.9', '11142026', 'Matches the full app: Home kcal ring: goal reached (burst and check mark) when today is within 10% of your kcal target, above or below; more than 10% over shows a full ring without the check.'],
  ['0.3o.8', '11142026', 'Matches the full app: Home rings come alive when Home opens: kcal and protein fill in small dial ticks while the numbers count up; workouts this week fills in ticks grouped into one block per training day, and each finished day merges into a solid block; a ring that reaches its goal ends with a short burst and a check mark. Plays once each time you open Home (after the loading screen) and not at all when the phone asks for reduced motion.'],
  ['0.3o.7', '11142026', '[app only, no change on the web] Body tab: a kg / lbs switch right of Latest changes the top cards, the chart, the measure picker and the day cards together (body fat stays in %). It starts in your Food › Weight unit and only changes how the Body tab shows numbers.'],
  ['0.3o.6', '11142026', 'Matches the full app: Settings: all cards are collapsed whenever you come back to Settings; the app no longer remembers which card was open (Adjust plan and Plan my week still open their own card).'],
  ['0.3o.5', '11142026', 'Matches the full app: Food tiles: the amount (112 g, 1 pc …) is never cut off again (0.3o.4 cut it to 1… on the iPhone); when a tile is tight the kcal number gets a little smaller first, then the word kcal is left out.'],
  ['0.3o.4', '11142026', 'Matches the full app: Food tiles: the amount (100 g, 1 pc …) and the kcal sit in one row that keeps them apart, so the amount no longer runs under the kcal number; a long amount ends in … instead.'],
  ['0.3o.3', '11142026', 'Matches the full app: Day cards under the Body and Progress charts: the number is a little smaller and the unit (kg, lbs, %, reps) is small, grey and not bold.'],
  ['0.3o.2', '11142026', 'Matches the full app: Home, Last workout tile: the muscle names are a little smaller and both columns stay inside the card; a name that still does not fit makes the names step down in size instead of being cut off.'],
  ['0.3o.1', '11142026', 'Matches the full app: Exercise pictures follow proper form: Lat Pulldown thighs touch the pad, bar passes in front of the face, elbows drive down; Bulgarian split squat and Barbell back squat keep the feet planted (bar over mid-foot, rear knee just above the floor); Chest fly lowers only to chest level; Incline rear delt raise shown from the front with the arms going out to the sides; Preacher curl stops before vertical; Leg press ends with soft knees; Overhead triceps extension in a split stance with a slight lean. Week plan opened from Start workout (Adjust plan, Edit plans or + New plan) shows a return arrow at the lower right that goes back to Start workout.'],
  ['0.3o', '11142026', 'Matches the full app Ver 0.3o (its 0.3n.1 to 0.3n.15). Loading screen: the app opens at once on a loading screen with the app icon, a greeting for the time of day (with your name) and the date, in the colours of your style and theme, and fades into Home when Home is ready. Quick start: a copy of the Home page as you last saw it shows the moment the app opens, then the live page takes its place. Faster start: the page no longer waits for the Go Blue fonts, and the stick-figure pictures are kept in a smaller form. Styles: Settings › Appearance › Style chooses Go Blue (the app as it was) or Studio (plain and quiet: the phone’s own font, white cards without borders, round pill buttons, one accent colour from the color theme). Moving exercise pictures: the stick figures move from START to END and back (switch in Settings › Appearance; still with Reduce Motion). Lat Pulldown and Incline bench press now have stick-figure pictures too. Rest timer ring: shows the time left and drains back to the top; orange with beating numbers in the last 10 seconds; green with a ripple and Rest over at the end. Changing tabs from Home, the wheel or the Home button opens the new page as a circle growing from where you tapped. Settings are kept in your food Sheet too (Food settings tab): your name, the questionnaire answers, style, color theme, dark mode, moving pictures, weight mode and a few view choices, read back if the phone loses its stored data. Starter foods for new people: names follow one style, the food first and the kind in brackets (Pasta (dry), White rice (cooked), Milk (2%) …); chicken thighs and beef sausage are entered in grams; new foods Potato (boiled) and Tomato (raw).'],
  ['0.3n', '11142026', 'Matches the full app Ver 0.3n. Progress exercise list: shows every exercise that has entries (also ones no longer in a plan or the Sheet), and no longer lists exercises without entries.'],
  ['0.3m', '11142026', 'Matches the full app Ver 0.3k to 0.3m. Progress: the exercise picker is smaller and sits on the left, with 3M, 6M, 1Y and All on its right in the same row and at the same height (a long name wraps to a second line). Start workout: an Adjust plan link beside Current plan opens Settings › Week plan with the plan in use ready to edit; the Save session card says to tap a set row to pick its weight and reps. Empty charts show a sample: until there is something to chart, Progress shows a dimmed sample lift chart and Home › Muscles worked a sample shape, each with a SAMPLE label and what is missing; they go away as soon as your own entries are there. Code tidy: the Photos and Body tab code of the full app, which the web version never shows, was taken out.'],
  ['0.3j.1', '11142026', 'Web-only update on Ver 0.3j: Settings › Version has a Check for updates button. It reads the newest version from GitHub (not a stored copy) and says Your app is up to date, or shows Update now to Ver …, which loads the newest version straight away (your sign-in and unsaved sets on this phone are kept).'],
  ['0.3j', '11142026', 'Matches the full app Ver 0.3j, which redesigned its Photos tab (full app only). Nothing changes in the web version.'],
  ['0.3i.2', '11142026', 'Web-only fix on Ver 0.3i.1: the 0.3i.1 change made it worse (the bottom strip was hidden under a background band on short pages and only showed while scrolling), so it was taken out, with the 0.3g.1 one. Instead every page is now at least as tall as the whole screen, so short pages (Settings, Progress, Start workout) are drawn to the bottom like the long ones (Food, Library), where the strip was always right.'],
  ['0.3i.1', '11142026', 'Web-only fix on Ver 0.3i: in the iPhone home-screen app the bottom strip still sat above the bottom of the screen on short pages (Settings, Progress, Start workout). The app now checks where the strip really ends after every page change, scroll and turn of the phone and moves it, the Food week bar, the Start workout button and the pop-up sheets down to the real bottom.'],
  ['0.3i', '11142026', 'Matches the full app Ver 0.3i. Progress: the exercise numbers (weight, or reps for Pull Up) are on the right and the body weight scale, when it shows, on the left.'],
  ['0.3h', '11142026', 'Matches the full app Ver 0.3h. Home, Last workout tile: the longer muscle names go in the first column and the shorter ones in the second, and a name that still does not fit ends in … instead of running out of the card.'],
  ['0.3g.1', '11142026', 'Web-only fix on Ver 0.3g: in the iPhone home-screen app the bottom strip could sit well above the bottom of the screen with a band of page under it (an iPhone bug that makes the page shorter than the screen, about the height of the status bar, often after signing in). The app now measures that gap and moves the strip, the Food week bar, the Start workout button and the pop-up sheets down to the real bottom.'],
  ['0.3g', '11142026', 'Matches the full app Ver 0.3g. Home, Last workout tile: the muscle names sit in two even columns, so each column lines up.'],
  ['0.3f', '11142026', 'Matches the full app Ver 0.3f. Get started is filled in from what you have now: your name, your weight and unit, the training days and the number of exercises of your plan in use, and the answers that match your body type (your exact answers are remembered after the first time). Whatever you leave as it is stays the same: the body type when those answers did not change, your carb week and your week plan when the training days did not change (marked Same as now), and a weight is saved again only if you change it. Changing the training days switches on a new plan from your answers. Home: the Last workout tile now lists the muscles that session trained, each with a green check (Chest, Back, Legs and so on, the most worked first), with the date and the number of sets under them.'],
  ['0.3e', '11142026', 'Matches the full app Ver 0.3e. You sheet (tap the logo on Home): the Name and Body weight boxes are smaller and the app icon sits to their right, with Change under it; tap it to change the icon. Get started: Quit \u00b7 don\u2019t save at the top of every step leaves the questionnaire with nothing changed (the kg / lbs choice there is now saved only with Use this setup). Removed: the wide Change the app icon button in the You sheet; Not now and Close in the questionnaire (now Quit \u00b7 don\u2019t save).'],
  ['0.3d', '11142026', 'Matches the full app Ver 0.3d. Get started: a short questionnaire that sets up the app. It opens by itself once for someone with nothing set up (no name, no plan in use), and You (tap the logo on Home) \u203a Set up my app opens it any time. One question per screen: your name, your weight (kg or lbs), your main goal, the days you can train, how much you have trained, how your body usually responds to food, and your weight over the past week. Then Your setup shows and applies: the body type (worked out from the answers), the carb week (2 high, 3 mid, 2 low where the days allow) and a first week plan from your Exercises list, which becomes the plan in use unless you switch that off.'],
  ['0.3c', '11142026', 'Matches the full app Ver 0.3c. Home: tap the logo (or the pencil beside Hello) to open a You sheet: your name, your body weight (kg or lbs, the same weight and unit as Food \u203a Weight; saving one makes Food use it, Manual) and Change the app icon, which used to open straight from the logo. Home: the Body weight tile is replaced by Last workout (Today, Yesterday or N days ago, with the date and how many exercises and sets; tap it for Progress), since most people have no weight readings.'],
  ['0.3b.1', '11142026', 'Web-only fix on Ver 0.3b: on tab pages (Settings, Library, Food and the others) the content started far below the top of the screen because the top safe area was counted twice, and the bottom strip sat high with a gap under it. Both now sit where they should: the page starts just under the status bar, Home has its greeting row closer to the top, and the Go to, Home and return icons sit just above the home bar.'],
  ['0.3b', '11142026', 'Matches the full app Ver 0.3b (its 0.2n to 0.3b). New Home page: Hello and your name (tap the pencil to change it; kept on this phone), three rings (workouts this week against the training days of your week plan, calories and protein today against the Food targets; tap a ring for its tab), Muscles worked (a spider chart of the sets per muscle in the last 7 or 30 days), a Body weight tile (7-day average, change this week, 30-day trend line) and Next up, and a large Start workout button just above the bottom strip. The tab bar is replaced by a bottom strip: Go to opens the tab wheel (drag it or tap a bubble), Home goes Home, and on an exercise page a return arrow goes back to the list. Today is now called Start workout (play icon). A started exercise opens on its own page: the start | end picture, a large name, the set rows with a Set column (tap a row to open a set picker: sideways strips of numbers for weight and reps; Pull Up has a Band toggle), and a rest timer dial beside them (2:00 or 3:00; the ring fills clockwise as the rest runs and beeps at the end). The page grows with the screen. Library: a body figure with a front and a back that turns, the muscles of the matching exercises light up in gold, the exercise tags are packed around it, and a small + at its upper right adds an exercise. Progress: a date ruler under the chart in place of the table. Exercise pictures redrawn at one size. Charts have larger y-axis numbers. A tab opened from Home or the wheel fades in. Removed: the tab bar, the rest timer bar, the floating + bubble, the weight suggestions and the −5 / +5 row on the exercise page. Not in the web version (full app only): the Body and Photos tabs; the Body weight tile opens the Food tab.'],
  ['0.2m', '11132026', 'Matches the full app Ver 0.2m. Food tab: the food tiles in My foods and Suggested have a light paint texture (short dabs and brush strokes, like a painting) over their carbs / protein / fat colours; the names and numbers stay as they were. In dark mode the tile colours are stronger (they looked dim) and the texture has only small, faint light strokes that blend into the colour. Food tiles are more compact: the name, then the amount with the calories right next to it (they were on a row of their own), and carbs, protein and fat still stacked in a column on the right. All food tiles are the same height: names stay on one line in the narrow heading font, and long names are shown a little smaller so they fit. The calories line up on every tile (right next to the carbs / protein / fat column), and the tiles say pc / pcs instead of piece / pieces. New color themes Crimson + Gold (deep crimson with warm gold) and Black + Silver (near-black with silver; the Today button, selected tab, rest timer, main buttons and switches have a brushed-metal shine), light and dark, in Settings › Appearance; the theme buttons are now two by two. The logo disc takes the theme colour (black in Black + Silver, crimson in Crimson + Gold) and its gold always stays gold. Pork dumpling is no longer in the starter food list for new people (38 foods).'],
  ['0.2l', '11122026', 'Matches the full app Ver 0.2l. Progress: Show body weight on the chart is on by default; switch it off if you do not want it (still owner only).'],
  ['0.2k', '11122026', 'Matches the full app Ver 0.2k. Settings › Appearance: switching Dark mode, Follow the phone setting or the Color theme no longer changes the whole screen at once; the new look grows as a circle from the switch or colour you tapped and fills the screen (about 0.6 s). When the phone switches between light and dark by itself while Follow the phone setting is on, the new look wipes down from the top instead. Phones that do not support it (older than iOS 18), and Reduce Motion, keep the instant change.'],
  ['0.2j.1', '11122026', 'Web-only fix on Ver 0.2j: the app stayed on Loading forever (since 0.2i) because the starter food list for the My foods button could not be found when the page started; it now loads again.'],
  ['0.2j', '11122026', 'Matches the full app Ver 0.2j, which brought the readable dark-mode Tap again buttons over from Web 0.2d.1. The web version already had them, so nothing changes here.'],
  ['0.2i', '11122026', 'Matches the full app Ver 0.2i. My foods: people other than the owner get a button under their list, + Add N new starter foods, when the starter list (the owner list) has foods they do not have yet (matched by name). It only adds those foods; foods they added or edited themselves are never changed or removed.'],
  ['0.2h', '11122026', 'Matches the full app Ver 0.2h. New people start with the owner\'s food list in My foods (39 foods: meats, fish, eggs, rice, noodles, bread, fruit, nuts, dairy, vegetables and more) instead of the 10 generic ones; notes that spoke of the owner\'s own labels now just say Label. People who already have a food Sheet keep their own list.'],
  ['0.2g', '11122026', 'Matches the full app Ver 0.2g. Food tab: Quick add is now My foods, with a Full list table (tap a row to open the food); foods show as tiles, two per row (name, the amount a tap adds, its calories, and carbs, protein and fat in grams in their colours), grouped by main nutrient (Protein, Carbs, Fat) with filter chips and a search box; tap a tile to add it, hold it to open its card (donut by calories or grams, legend with grams and %), where Edit changes or removes the food and + New food adds one. More units (g, ml, oz, cup, tbsp, tsp, each) on a small scroll wheel in Add a food and the food card; Add a food has an Amount box for what the label numbers are for. Suggested to fill the day: up to 2 foods as tiles, tap to add. Clearer macro colours (amber carbs, green protein, coral fat) in the tiles, the nutrition bars and the Adding / Eaten rows. The week calendar on the Food tab scrolls sideways (8 weeks back and ahead); tap the date at the top to slide back to today. Carb week: one small wheel per weekday, scroll it to switch High / Mid / Low (amber, blue, teal). Settings: only one section open at a time. Appearance: the Dark mode switch is grey (not gold) while Follow the phone setting is on. Exercise pictures for the exercises that had none (Barbell Back Squat, Dumbbell Bench Press, Pull Up, Dead Hang and others); hold a full-screen picture to close it. Fix: a workout that was already saved no longer comes back the next day as not saved yet. Not in the web version (full app only): the Photos timeline, photo swiping and the Describe food buttons. Removed: Quick add chips and its Edit list (Save list), the Together total line under suggestions.'],
  ['0.2f.1', '11102026', 'Web-only update on Ver 0.2f: code tidy-up. Unused parts removed: the old week-plan day sheet and its lists, the old Library list, and leftovers from the full app that the web version never shows (Claude food estimates, Renpho import from Google Drive, the old body weight box, exercise picture backup). Nothing changes on screen.'],

// The web version (GitHub) sends one anonymous ping a day after sign-in: a random id made on this phone, the app version
// and "web". No name, no email. It goes to an Apps Script web app on the owner's "Workout Lite usage" Sheet.
// The owner sees the counts in the full app (Settings › About › Usage), which reads the Sheet.
const USAGE_URL = 'https://script.google.com/macros/s/AKfycbwH9SUdnU6dRsg8lBv6eLE70UkMuvODb5ZIoySOGUjAF3ZOqkTyT12mAMDQwOcMxwW1/exec';   /* the Apps Script web app (…/exec); empty = no pings and the web card says Not connected */
const K_PING = 'wlite.ping.v1';
function usagePing() {
  if (!window.__wweb || !USAGE_URL) return;   /* only the web version can reach the script */
  const p = store.get(K_PING) || {}, td = todayIso();
  if (p.day === td) return;
  if (!p.id) { const a = new Uint8Array(8); crypto.getRandomValues(a); p.id = [...a].map(x => x.toString(16).padStart(2, '0')).join(''); }
  fetch(USAGE_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ id: p.id, v: APP_VERSIONS[0][0], src: 'web' }) })
    .then(() => { p.day = td; store.set(K_PING, p); }).catch(() => {});
}
