// ---------- save a session (same rules as the Sheet's tick-box script and the claude.ai app) ----------
function pad2_(n) { return ('0' + n).slice(-2); }
function parseUS_(s) { const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(s).trim()); return m ? m[3] + '-' + pad2_(m[1]) + '-' + pad2_(m[2]) : null; }
function keyOfIso_(iso) { return iso.replace(/-/g, ''); }
function usOf_(iso) { const p = iso.split('-').map(Number); return p[1] + '/' + p[2] + '/' + p[0]; }
function unitOf_(name, units) {
  if (units && units[name]) return units[name];
  if (/warm.?up/i.test(name)) return 'mins'; if (/battle ropes/i.test(name)) return 'seconds'; return 'lbs';
}
function units_(exRows) {
  const map = {};
  exRows.forEach(r => { const name = String(r[2]).trim().replace(/^\d+ /, ''), u = String(r[5] || '').trim().toLowerCase(); if (name && UNITS.indexOf(u) >= 0 && !map[name]) map[name] = u; });
  return map;
}
function dupKey_(name, w, r) {
  const ws = String(w == null ? '' : w).trim();
  const wn = ws !== '' && !isNaN(+ws) ? String(+ws) : ws;
  return String(name).trim().replace(/^\d+ /, '') + '|' + wn + '|' + String(r == null ? '' : r).trim().replace(/\//g, '');
}
function kinds_(exRows) {
  const map = {};
  exRows.forEach(r => {
    const cat = String(r[1]), name = String(r[2]).trim().replace(/^\d+ /, ''); if (!name) return;   // 0.2c: names without plan numbers
    let k = 'N'; if (/push|pull/i.test(cat)) k = 'U'; else if (/legs/i.test(cat)) k = 'L';
    if (!map[name] || map[name] === 'N') map[name] = k;
  });
  return map;
}
// rows: archive rows (strings); entries: [{name, w, r}]; iso: session date. Returns {out, added}.
function merge_(rows, entries, iso, kinds, units) {
  const kindOf = n => kinds[n] || 'N';
  const key = keyOfIso_(iso), dateText = usOf_(iso);
  const isHeader = r => r[0] === UPPER || r[0] === LOWER;
  const keyOf = r => { const i = parseUS_(r[2]); return i ? keyOfIso_(i) : ''; };
  const upper = [], lower = [];
  let start = -1, end = -1;
  for (let i = 0; i < rows.length; i++) if (isHeader(rows[i]) && keyOf(rows[i]) === key) { start = i; break; }
  if (start >= 0) {
    end = rows.length - 1; let kind = 'U';
    for (let i = start; i < rows.length; i++) {
      const r = rows[i];
      if (r[0] === END) { end = i; break; }
      if (isHeader(r)) { if (keyOf(r) !== key) { end = i - 1; break; } kind = r[0] === UPPER ? 'U' : 'L'; continue; }
      if (r.join('') === '') continue;
      (kind === 'U' ? upper : lower).push(r);
    }
    const have = {};
    upper.concat(lower).forEach(r => { const k = dupKey_(r[0], r[1], r[3]); have[k] = (have[k] || 0) + 1; });
    entries = entries.filter(e => { const k = dupKey_(e.name, e.w, e.r); if (have[k]) { have[k]--; return false; } return true; });
  }
  const added = entries.length;
  const hasU = upper.length > 0 || entries.some(e => kindOf(e.name) === 'U');
  const hasL = lower.length > 0 || entries.some(e => kindOf(e.name) === 'L');
  const neutralTo = (hasU || !hasL) ? 'U' : 'L';
  entries.forEach(e => { let k = kindOf(e.name); if (k === 'N') k = neutralTo; (k === 'U' ? upper : lower).push([e.name, e.w, unitOf_(e.name, units), e.r]); });
  const block = [];
  if (upper.length) { block.push([UPPER, '', dateText, '']); upper.forEach(r => block.push(r)); }
  if (lower.length) { block.push([LOWER, '', dateText, '']); lower.forEach(r => block.push(r)); }
  block.push([END, '', LINE, '']);
  let out;
  if (start >= 0) out = rows.slice(0, start).concat(block, rows.slice(end + 1));
  else {
    let at = rows.length;
    for (let i = 0; i < rows.length; i++) { const k = isHeader(rows[i]) ? keyOf(rows[i]) : ''; if (k !== '' && k < key) { at = i; break; } }
    out = rows.slice(0, at).concat(block, rows.slice(at));
  }
  return { out: out, added: added };
}
// A row written back to the sheet: weights as numbers, reps with anything but digits kept as text.
function cell_(r) {
  const k = String(r[1]).trim(), m = String(r[3]).trim();
  return [String(r[0]),
    k === '' || !isNaN(+k) ? k : "'" + k,
    String(r[2]),
    m === '' || /^\d+$/.test(m) ? m : "'" + m];
}
// entries: [{name, w, r}] built by the page; iso: 'YYYY-MM-DD'.
// Only the archive cells J:M are moved (insert cells, shift down); A:I and everything else stay where they are.
function api_save(entries, iso) {
  if (!Array.isArray(entries) || !entries.length) throw new Error('Nothing to save.');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) throw new Error('Bad session date.');
  entries = entries.map(e => ({ name: String(e.name).trim(), w: String(e.w == null ? '' : e.w).trim(), r: String(e.r == null ? '' : e.r).trim() }))
    .filter(e => e.name && !NOT_EX.test(e.name));
  const lock = LockService.getUserLock();
  if (!lock.tryLock(20000)) throw new Error('Another save is still running. Try again in a moment.');
  try {
    const L = openLog_(), sh = L.sh, exRows = readExercises_(L.ss), kinds = kinds_(exRows), units = units_(exRows);
    const HEAD = 300, SENT = ['\u0000more', '', '', ''];
    const plan = (rows, full) => {
      let lead = 0; while (lead < rows.length && rows[lead].join('') === '') lead++;   // blank cells left by an interrupted save
      // when only the top was read, a marker row stands for "the rest of the archive"
      const core = rows.slice(lead).concat(full ? [] : [SENT]), M = merge_(core, entries, iso, kinds, units), out = M.out;
      let m = 0; while (m < core.length && m < out.length && core[core.length - 1 - m].join('\u0001') === out[out.length - 1 - m].join('\u0001')) m++;
      return { out: out, m: m, oldN: core.length + lead - m, newN: out.length - m, added: M.added };
    };
    let rows = readArchive_(sh, HEAD), full = rows.length < HEAD, P = plan(rows, full);
    if (!full && P.m === 0 && P.added) { rows = readArchive_(sh, 0); full = true; P = plan(rows, true); }
    const skipped = entries.length - P.added;
    if (!P.added) return { added: 0, skipped: skipped, ok: true };
    const top = P.out.slice(0, P.newN);
    if (top.some(r => r === SENT)) throw new Error('Could not place the session in the archive. Nothing was written.');
    const delta = P.newN - P.oldN;
    if (delta > 0) sh.getRange(2, ARCHIVE_COL, delta, 4).insertCells(SpreadsheetApp.Dimension.ROWS);
    if (delta < 0) sh.getRange(2, ARCHIVE_COL, -delta, 4).deleteCells(SpreadsheetApp.Dimension.ROWS);
    if (top.length) sh.getRange(2, ARCHIVE_COL, top.length, 4).setValues(top.map(cell_));
    SpreadsheetApp.flush();
    const back = readArchive_(sh, P.newN + 1);
    const want = P.out.slice(0, P.newN + 1).filter(r => r !== SENT);
    const ok = want.every((r, i) => (back[i] || [])[0] === r[0]);
    return { added: P.added, skipped: skipped, ok: ok };
  } finally {
    lock.releaseLock();
  }
}

// ---------- add an exercise (Library tab) ----------
// row = ['', category, full name, muscle, notes, unit] checked by the page; full = name with any plan number.
// Same place rules as the full app: after the last exercise with the same plan number; a new number after the last
// numbered exercise; no number at the end of the exercises, above End Workout. Formatting copied from the nearest row
// with the same category.
function prefix_(name) { const m = /^(\d+) /.exec(String(name)); return m ? m[1] : ''; }
function api_addExercise(row, full) {
  if (!Array.isArray(row) || row.length < 6) throw new Error('Bad exercise data.');
  full = String(full || '').trim();
  const cat = String(row[1]), unit = String(row[5]);
  if (!full || CATS.indexOf(cat) < 0 || UNITS.indexOf(unit) < 0) throw new Error('Name, category and unit are needed.');
  const lock = LockService.getUserLock();
  if (!lock.tryLock(20000)) throw new Error('Another change is still running. Try again in a moment.');
  try {
    const L = openLog_(), sh = L.ss.getSheetByName(EX_TAB);
    const rows = readExercises_(L.ss);
    const bare = full.replace(/^\d+ /, '').toLowerCase();
    if (rows.some(r => String(r[2]).trim().replace(/^\d+ /, '').toLowerCase() === bare)) throw new Error('That exercise is already in the Exercises tab.');
    const nm = r => String((r && r[2]) || '').trim(), pre = prefix_(full);
    let at = -1;
    if (pre) {
      rows.forEach((r, i) => { if (prefix_(nm(r)) === pre) at = i + 1; });
      if (at < 0) rows.forEach((r, i) => { if (prefix_(nm(r))) at = i + 1; });
    }
    if (at < 0) {
      const end = rows.findIndex(r => /^end workout$/i.test(nm(r)));
      at = end >= 0 ? end : rows.length;
      while (at > 0 && !(rows[at - 1] || []).join('').trim()) at--;
    }
    let src = -1, dist = 1e9;
    rows.forEach((r, i) => { if (String(r[1] || '').trim().toLowerCase() === cat && Math.abs(i - at) < dist) { src = i; dist = Math.abs(i - at); } });
    const sheetRow = at + 2;
    sh.insertRowBefore(sheetRow);
    if (src >= 0) { const sr = (src >= at ? src + 1 : src) + 2; sh.getRange(sr, 1, 1, 6).copyTo(sh.getRange(sheetRow, 1, 1, 6), SpreadsheetApp.CopyPasteType.PASTE_FORMAT, false); }
    sh.getRange(sheetRow, 1, 1, 6).setValues([[ '', cat, full, String(row[3] || ''), String(row[4] || ''), unit ]]);
    SpreadsheetApp.flush();
    if (String(sh.getRange(sheetRow, 3).getDisplayValue()).trim() !== full) throw new Error('The new row did not read back as expected. Please look at the Exercises tab.');
    return { row: sheetRow };
  } finally {
    lock.releaseLock();
  }
}

// ---------- week plans and stars (Plan tab, Lite 0.1f; same layout as the full app) ----------
// A:K = Log tab | Kind (plan / day / ex / fav) | Plan ID | Plan name | Active | Warm-up | Day | Day type | Order | Exercise | Updated.
// Each person's rows are labelled with their log tab, so plans and stars stay separate; only those rows are rewritten.
const PLAN_TAB = 'Plan';
const PLAN_HEAD = ['Log tab', 'Kind', 'Plan ID', 'Plan name', 'Active', 'Warm-up', 'Day', 'Day type', 'Order', 'Exercise', 'Updated'];
function pad11_(r) { const o = []; for (let i = 0; i < 11; i++) o.push(r && r[i] != null ? String(r[i]) : ''); return o; }
function planRowsOf_(sh) {
  const n = sh.getLastRow(); if (n < 2) return [];
  const v = sh.getRange(2, 1, n - 1, 11).getDisplayValues();
  while (v.length && v[v.length - 1].join('') === '') v.pop();
  return v;
}
function api_plansGet() {
  const L = openLog_(), sh = L.ss.getSheetByName(PLAN_TAB);
  return { tab: L.c.tab, rows: sh ? planRowsOf_(sh).filter(r => r[0] === L.c.tab) : [] };
}
function api_plansSave(mine) {
  if (!Array.isArray(mine)) throw new Error('Bad plan data.');
  const lock = LockService.getUserLock();
  if (!lock.tryLock(20000)) throw new Error('Another change is still running. Try again in a moment.');
  try {
    const L = openLog_(), tab = L.c.tab;
    let sh = L.ss.getSheetByName(PLAN_TAB);
    if (!sh) {                                                  // first plan or star in this Sheet: make the Plan tab
      sh = L.ss.insertSheet(PLAN_TAB);
      sh.getRange(1, 1, 1, 11).setValues([PLAN_HEAD]).setFontWeight('bold').setBackground('#14284b').setFontColor('#ffffff');
      sh.setFrozenRows(1);
      sh.getRange(2, 1, Math.max(sh.getMaxRows() - 1, 1), 11).setNumberFormat('@');
    }
    const fresh = planRowsOf_(sh), others = fresh.filter(r => r.join('') !== '' && r[0] !== tab);
    const rows = mine.map(r => { const o = pad11_(r); o[0] = tab; return o; });
    const all = others.concat(rows);
    if (all.length > 2000) throw new Error('The Plan tab is full.');
    const n = Math.max(fresh.length, all.length);
    if (n) {
      const vals = all.concat(Array.from({ length: n - all.length }, () => pad11_([])));
      const rg = sh.getRange(2, 1, n, 11); rg.setNumberFormat('@'); rg.setValues(vals);
    }
    SpreadsheetApp.flush();
    const back = planRowsOf_(sh).filter(r => r[0] === tab);
    if (back.length !== rows.length) throw new Error('The Plan tab did not read back as expected.');
    return { ok: true };
  } finally {
    lock.releaseLock();
  }
}


// ---------- sign-in (OAuth 2.0 token by redirect: works in a Home Screen app, no pop-up) ----------
function redirectUri() { return location.origin + location.pathname; }
function takeTokenFromUrl() {
  if (!location.hash || location.hash.length < 2) return null;
  const p = new URLSearchParams(location.hash.slice(1));
  if (!p.get('access_token') && !p.get('error')) return null;
  history.replaceState(null, '', location.pathname + location.search);
  const want = ls.get(K_STATE); ls.del(K_STATE);
  if (p.get('error')) return { error: p.get('error') };
  if (!want || p.get('state') !== want) return { error: 'state_mismatch' };
  const tok = { t: p.get('access_token'), exp: Date.now() + (Number(p.get('expires_in')) || 3600) * 1000, sc: p.get('scope') || '' };
  ls.set(K_TOK, tok);
  return tok;
}
function token() { const t = ls.get(K_TOK); return t && t.exp > Date.now() + 30000 ? t.t : null; }
function minutesLeft() { const t = ls.get(K_TOK); return t ? (t.exp - Date.now()) / 60000 : 0; }
function signIn(silent) {
  const state = Math.random().toString(36).slice(2) + Date.now().toString(36);
  ls.set(K_STATE, state);
  const q = new URLSearchParams({ client_id: CLIENT_ID, redirect_uri: redirectUri(), response_type: 'token', scope: SCOPES + (ls.get(K_FULL) ? ' ' + SCOPE_SHEETS : ''),
    include_granted_scopes: 'true', state: state });
  const email = ls.get(K_EMAIL); if (email) q.set('login_hint', email); else if (!silent) q.set('prompt', 'select_account');   // after sign-out: pick an account
  if (silent) ls.set(K_BOUNCE, Date.now());
  location.assign('https://accounts.google.com/o/oauth2/v2/auth?' + q.toString());
}

// ---------- Google APIs ----------
const SHEETS = 'https://sheets.googleapis.com/v4/spreadsheets/';
const DRIVE = 'https://www.googleapis.com/drive/v3/files', UPLOAD = 'https://www.googleapis.com/upload/drive/v3/files';
async function gfetch(url, opts, raw) {
  const t = token();
  if (!t) throw needSignIn('Your Google sign-in has ended (it lasts about an hour). Sign in again to keep going; your unsaved sets are kept.');
  opts = opts || {};
  const headers = Object.assign({ Authorization: 'Bearer ' + t }, opts.body && !opts.multipart ? { 'Content-Type': 'application/json' } : {}, opts.headers || {});
  let r;
  try { r = await fetch(url, Object.assign({}, opts, { headers })); }
  catch (e) { throw new Error('No connection to Google right now (network).'); }
  if (r.status === 401) { ls.del(K_TOK); throw needSignIn('Your Google sign-in has ended. Sign in again to keep going; your unsaved sets are kept.'); }
  if (!r.ok) {
    let m = r.statusText;
    try { const j = await r.json(); m = (j.error && (j.error.message || j.error)) || m; } catch (e) {}
    if (r.status === 404) m = 'Not found: ' + m;
    if (r.status === 403) m = 'No access: ' + m;
    throw new Error(m);
  }
  if (raw) return r.text();
  return r.status === 204 ? null : r.json();
}
const q1 = s => "'" + String(s).replace(/'/g, "''") + "'";
async function getVals(id, a1) {

  return j.values || [];
}
async function putVals(id, a1, values) {
  return gfetch(SHEETS + id + '/values/' + encodeURIComponent(a1) + '?valueInputOption=USER_ENTERED', { method: 'PUT', body: JSON.stringify({ range: a1, majorDimension: 'ROWS', values }) });
}
async function batch(id, requests) { return gfetch(SHEETS + id + ':batchUpdate', { method: 'POST', body: JSON.stringify({ requests }) }); }
async function meta(id) { return gfetch(SHEETS + id + '?fields=properties.title,spreadsheetUrl,sheets.properties(sheetId,title)'); }
const pad = (rows, n) => rows.map(r => { const o = []; for (let i = 0; i < n; i++) o.push(r[i] == null ? '' : String(r[i])); return o; });
function trimTail(v) { while (v.length && v[v.length - 1].join('') === '') v.pop(); return v; }

// app files (config.json, food.json, draft.json) in the Workout Lite folder in My Drive (web 0.2a; before that the hidden
// hidden appDataFolder; dropped so sign-in needs only drive.file). drive.file: the app only sees what it made.
const fileIds = {}, K_FOLDER = 'wweb.folder.v1';
async function wlFolder(create) {
  const c = ls.get(K_FOLDER); if (c) return c;
  const fs = await gfetch(DRIVE + '?fields=files(id)&orderBy=createdTime&pageSize=10&q=' + encodeURIComponent("name = '" + APP_NAME + "' and mimeType = 'application/vnd.google-apps.folder' and 'root' in parents and trashed = false"));
  let id = ((fs.files || [])[0] || {}).id || '';
  if (!id && create) id = (await gfetch(DRIVE + '?fields=id', { method: 'POST', body: JSON.stringify({ name: APP_NAME, mimeType: 'application/vnd.google-apps.folder', parents: ['root'] }) })).id;
  if (id) ls.set(K_FOLDER, id);
  return id;
}
async function appFind(name, create) {
  if (fileIds[name]) return fileIds[name];
  const folder = await wlFolder(create); if (!folder) return null;
  const j = await gfetch(DRIVE + '?fields=files(id,name)&pageSize=10&q=' + encodeURIComponent("name='" + name + "' and '" + folder + "' in parents and trashed=false"));
  const f = (j.files || [])[0]; if (f) fileIds[name] = f.id; return f ? f.id : null;
}
async function appRead(name) { const id = await appFind(name); return id ? gfetch(DRIVE + '/' + id + '?alt=media', {}, true) : ''; }
async function appWrite(name, text) {
  const id = await appFind(name, true);
  if (id) return gfetch(UPLOAD + '/' + id + '?uploadType=media', { method: 'PATCH', body: text, headers: { 'Content-Type': 'application/json' }, multipart: true });
  const b = 'wweb' + Date.now();
  const body = '--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify({ name, parents: [await wlFolder(true)] }) +
    '\r\n--' + b + '\r\nContent-Type: application/json\r\n\r\n' + text + '\r\n--' + b + '--';
  const j = await gfetch(UPLOAD + '?uploadType=multipart&fields=id', { method: 'POST', body, multipart: true, headers: { 'Content-Type': 'multipart/related; boundary=' + b } });

}
// web 0.2d: own app icon, 'app icon.jpg' in the Workout Lite folder
const ICON_NAME = 'app icon.jpg';
async function iconList() {
  const folder = await wlFolder(false); if (!folder) return [];
  const j = await gfetch(DRIVE + '?fields=files(id,modifiedTime)&orderBy=modifiedTime desc&pageSize=10&q=' + encodeURIComponent("name='" + ICON_NAME + "' and '" + folder + "' in parents and trashed=false"));
  return j.files || [];
}
async function api_iconGet(have) {
  const f = (await iconList())[0]; if (!f) return null;
  if (have && have === f.id) return { id: f.id, same: true };
  let r; try { r = await fetch(DRIVE + '/' + f.id + '?alt=media', { headers: { Authorization: 'Bearer ' + token() } }); } catch (e) { throw new Error('No connection to Google right now (network).'); }
  if (!r.ok) throw new Error('The icon could not be read from Drive.');
  const blob = await r.blob();
  const data = await new Promise((ok, no) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = () => no(new Error('The icon could not be read.')); fr.readAsDataURL(blob); });
  return { id: f.id, data: String(data).replace(/^data:[^;,]*/, 'data:image/jpeg') };
}
async function api_iconSet(b64) {
  const old = await iconList(), b = 'wweb' + Date.now();
  const body = '--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify({ name: ICON_NAME, mimeType: 'image/jpeg', parents: [await wlFolder(true)] }) +
    '\r\n--' + b + '\r\nContent-Type: image/jpeg\r\nContent-Transfer-Encoding: base64\r\n\r\n' + b64 + '\r\n--' + b + '--';
  const j = await gfetch(UPLOAD + '?uploadType=multipart&fields=id', { method: 'POST', body, multipart: true, headers: { 'Content-Type': 'multipart/related; boundary=' + b } });

async function api_save(entries, iso) {
  if (!Array.isArray(entries) || !entries.length) throw new Error('Nothing to save.');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) throw new Error('Bad session date.');
  entries = entries.map(e => ({ name: String(e.name).trim(), w: String(e.w == null ? '' : e.w).trim(), r: String(e.r == null ? '' : e.r).trim() })).filter(e => e.name && !NOT_EX.test(e.name));
  if (saving) throw new Error('Another save is still running. Try again in a moment.');
  saving = true;
  try {
    const L = await openLogW(), id = L.id, tab = L.c.tab, sid = L.tabs[tab];
    const exRows = await readExW(id), kinds = kinds_(exRows), units = units_(exRows);
    const HEAD = 300, SENT = ['\u0000more', '', '', ''];

  for (const w of writes) await call('update_values', { spreadsheetId: PRIV_ID, range: w.range, values: w.values });

function buildEntries(draft) {
  const entries = [];

    if (NOT_EX.test(it.name)) return;
    const sets = filledSets(it);
    if (!sets.length) return;
    const timed = isTimed(it.name);
    if (isCount(it.name)) {   /* one row per set, Weight = band help (0 = no band), Reps = the set's reps */
      const b = it.band || {}, band = b.on && +b.lbs > 0 ? String(+b.lbs) : '0';
      sets.forEach(s => entries.push({ name: it.name, w: band, r: String(s.w).trim() }));

    }
    // consecutive sets at the same weight become one archive row, reps run together (10, 10, 8 -> 10108)
    let row = null;
    sets.forEach(s => {
      const w = String(s.w).trim(); const r = timed ? '' : String(s.r).trim();
      if (row && row.w === w && !timed && r !== '' && row.r !== '') { row.r += r; return; }   // weight-only sets stay one row each

function nxCheck(f) {

  ['0.2g', '11122026', 'Matches the full app Ver 0.2g. Food tab: Quick add is now My foods, with a Full list table (tap a row to open the food); foods show as tiles, two per row (name, the amount a tap adds, its calories, and carbs, protein and fat in grams in their colours), grouped by main nutrient (Protein, Carbs, Fat) with filter chips and a search box; tap a tile to add it, hold it to open its card (donut by calories or grams, legend with grams and %), where Edit changes or removes the food and + New food adds one. More units (g, ml, oz, cup, tbsp, tsp, each) on a small scroll wheel in Add a food and the food card; Add a food has an Amount box for what the label numbers are for. Suggested to fill the day: up to 2 foods as tiles, tap to add. Clearer macro colours (amber carbs, green protein, coral fat) in the tiles, the nutrition bars and the Adding / Eaten rows. The week calendar on the Food tab scrolls sideways (8 weeks back and ahead); tap the date at the top to slide back to today. Carb week: one small wheel per weekday, scroll it to switch High / Mid / Low (amber, blue, teal). Settings: only one section open at a time. Appearance: the Dark mode switch is grey (not gold) while Follow the phone setting is on. Exercise pictures for the exercises that had none (Barbell Back Squat, Dumbbell Bench Press, Pull Up, Dead Hang and others); hold a full-screen picture to close it. Fix: a workout that was already saved no longer comes back the next day as not saved yet. Not in the web version (full app only): the Photos timeline, photo swiping and the Describe food buttons. Removed: Quick add chips and its Edit list (Save list), the Together total line under suggestions.'],

  ['0.2f', '11102026', 'Matches the full app Ver 0.2f. Pull Up: the card shows your body weight (the weight you typed on the Food tab or on the card; Edit to change it) and a Band switch with the band help in lbs; with no body weight the card asks for it and the reps are greyed out. Each set is saved as its own row: Weight = band help (0 = no band), Reps = that set. Progress charts the weight you pulled (body weight − band) with a dashed line at your body weight; body weight itself is never written to the workout Sheet. Time exercises (Warm-up, Battle Ropes): a countdown timer on the card (− / + to set it, Start / Pause / Reset, beeps at 0:00 and enters the time; Pause enters the time done so far); typing the time still works. Week plan: choose the plan length (2-10 days) on a number wheel; day 1 is a Monday and the plan repeats after the last day; the days show as circles (M T W R F S U) with a gold check once saved. Tapping a day opens a page like the Library (search, body-part keywords, body figure) where you tap exercises to add them; the picked ones sit on top in small type, swipe one left to remove it (Undo in the message). No day-type buttons any more: the day is named from what you pick (Upper body, Lower body or Combined; Upper gets a push or pull tag when more than half are push or pull; nothing picked = Rest day). Library: exercises are small tags around a body figure (back by the head, shoulders, chest, arms, core at the waist, legs at the bottom); the search box (name or muscle) and keyword chips light up the matching tags and grey out the rest; tap a tag for its picture, last session and ☆. Pinch with two fingers to zoom an enlarged exercise picture (double-tap to reset).'],
  ['0.2e', '11092026', 'Matches the full app Ver 0.2e. Swipe to remove: swipe an exercise card on Today, or a row on the Food tab (Eaten list, Adding list, Quick add › Edit list), all the way left; a red Remove shape grows out of the right edge, and letting go past about 40% of the width removes it. This replaces the × buttons and the Remove? confirmation on Today cards; a very thin red line on the right edge shows what can be swiped away. Undo in the message, except for a saved Eaten row (that one is deleted from your food Sheet). Swiping needs a touch screen. Food: tapping a Quick add food adds it to the Adding list right away at its usual amount (the amount box and Add button are gone; change the amount in the Adding list). Target / Left numbers are now bars for calories, carbs, protein, fat and fiber: eaten is solid, the Adding list is lighter, the number on the right is what is left, over target turns the bar red with +amount, and fiber shows a check when met. Messages now show small at the very top of the screen instead of over the middle. (Photo Replace / Delete from the full app is not included: the web version has no Photos tab.)'],
  ['0.2d.1', '11082026', 'Web-only fixes on Ver 0.2d. The "Tap again to ..." confirm buttons (Sign out / switch account, Reset day, Use a different Sheet, Use a different food Sheet, Delete plan) showed red text on a red button, so the second tap prompt could not be read; they are now deep red with bold white text in light and dark mode. The Progress tab opens even when no exercise is starred or in a week plan, with a note on how to get a chart, instead of staying on the previous tab.'],
  ['0.2d', '11082026', 'Matches the full app Ver 0.2d. Settings is one grouped list like iPhone Settings: a row per section with an icon; tap a row to open it right under the row (which ones are open is remembered on this phone). Appearance: Follow the phone setting is a switch under Dark mode (Dark mode greyed out while it is on); Color theme (Navy + Gold, Soft ember, Blush; changes every navy and gold, light and dark); App icon: tap the logo at the top left to upload your own picture (cropped square from the middle) or go back to the default logo; it is saved in your Workout Lite folder in Google Drive, so it shows on every phone. New Settings › Carb week (your weight, then high / mid / low carb per weekday; the same as the Food tab). The Start each day with the plan switch moved into the Week plan card; the Week plan row shows the name of the plan in use. Exercises tab: favourite cards fold to their name (tap to open; Expand all / Collapse all). The header says No plan today when no week plan is in use.'],
  ['0.2c', '11082026', 'Matches the full app Ver 0.2c. Plan numbers are gone from exercise names (hidden too if your Sheet still has them); with no week plan in use Today starts empty. Exercises tab and Add an exercise: Favourites first, then the rest A to Z. New people get Dead Hang (stopwatch: Start, then Stop records the seconds; a small box for a typed time) and Pull Up (count only, + set for more; the Progress chart adds up each day; start and end drawing); anyone can add such exercises with the new reps unit or the seconds unit. Bottom sheets keep their last option above the iPhone home bar and away from the rounded corners. The Remove? confirmation on a Today card is a full-size red button. Progress: Show body weight on the chart is for the owner only.'],
  ['0.2b', '11072026', 'Matches the full app Ver 0.2b. Food tab: changing the Carb day is for that day only; Carb day › Plan my week sets the weekly high / mid / low pattern (one switch per weekday, with Standard 2-3-2, Match my workouts and All mid). The Weight box no longer shows Auto (7-day Renpho average) to anyone but the owner; everyone else types their weight. Week plan, one-day changes, typed weight, body type and unit are kept in a Food settings tab of the food Sheet, so they follow you to a new phone. Everything on the Food tab shows before a weight is set; the Weight box glows gold until then.'],
  ['0.2a', '11072026', 'Matches the full app Ver 0.2a. New person: the first-open screen makes a folder named Workout Lite in your My Drive with two Google Sheets, Workout Lite log (exercises, sessions, week plans) and Workout Lite food (food log, quick foods, body weight), in one tap. If the folder is already there it is reused and finished. Creating a food Sheet later also puts it in that folder. Sign-in now asks only for your email and for the files the app made itself, so Google shows no "unverified app" warning; the app settings and unsaved sets are kept in the Workout Lite folder. Using a Sheet the app did not make (Use a Sheet I already have) asks once for the full Google Sheets permission. Settings › Google account: Sign out / switch account (clears your data from this phone; the next sign-in lets you pick the account). Food tab: everything shows from the start; until a weight is set, the Weight box glows gold and a card with Enter my weight takes the place of the targets.'],

  ['0.1g', '11062026', 'Web version (GitHub): Food tab from the full app Ver 0.1u, without Claude calorie estimates: carb-cycling targets from your weight, Quick add, suggestions (3), Add a food (+ bubble), fiber, week bar with arrows. Food is kept in your own food Sheet (create one, or use one you have); type your weight if the Sheet has no Renpho readings. Also from the full app: the top weight and its reps as the hint in every set box. The Apps Script version is unchanged.'],
  ['0.1f', '11032026', 'From the full app Ver 0.1m: Settings › Week plan (up to 3 named plans kept in a Plan tab of your Sheet; day types Upper, Push, Pull, Lower, Custom, Rest; pick and drag exercises; saved day by day), Today shows the current plan and switches plans, ★ favourites per person, exercise notes shown only to the owner, no Notes field when adding an exercise. LAST UPDATE of Workout Lite: it will not be updated after this version; new features go to the full app only.'],

function startWith(r) {
  // r = result of api_init after setup or on open
  S.email = r.email || S.email;
  S.isOwner = !!r.owner; S.ownerKnown = true;                 // exercise notes show only to the owner (Lite 0.1f)
  store.del('wlite.full.v1');
  if (!r.cfg) { CFG = null; S.mcp = null; S.tab = 'setup'; S.initState = 'ready'; setSync('busy', 'Not set up'); render(); return; }
  const changed = !CFG || CFG.sheetId !== r.cfg.sheetId || CFG.tab !== r.cfg.tab;
  CFG = r.cfg; S.mcp = true; S.initState = 'ready';
  if (LOG_TAB !== CFG.tab) { S.wp = { plans: [], favs: new Set(), state: 'wait', err: '' }; S.wpEdit = null; S.wpDay = null; }
  LOG_TAB = CFG.tab;
  const cache = store.get(K_CACHE);
  if (cache && (cache.sheet !== CFG.sheetId || cache.tab !== CFG.tab)) { store.del(K_CACHE); store.del(K_DRAFT); store.del(K_PLANS); S.draft = null; S.exercises = []; S.history = new Map(); S.loadedAt = null; }
  if (r.data) { applyData(r.data); S.problem = null; setSync('ok', 'Synced ' + timeShort(S.loadedAt)); }
  else if (r.error) { S.problem = { text: r.error, retry: true }; setSync('err', S.loadedAt ? 'Offline copy' : 'Not synced'); }
  if (S.tab === 'setup') S.tab = 'home';   /* opens on Home once the Sheet is set */
  ensureDraft(); render();
  if (changed || !draftRemoteReady) readDraftRemote();
  if (changed || S.wp.state !== 'ok') readPlans();
  syncIcon();   // web 0.2d
  if (S.foodSheet === undefined || changed) gs('api_foodGet').then(foodStart).catch(e => { S.foodSheet = { error: codeText(e).text }; render(); });
}
async function setupRun(kind, fn) {
  S.setupBusy = kind; S.setupMsg = ''; render();
  try { const r = await withTimeout(fn(), 120000); S.setupBusy = null;
    if (r && r.needTab) { S.setupTabs = r.tabs; S.setupMsg = r.tabs.length ? '' : 'That Sheet has no log tab.'; render(); return; }
    S.setupTabs = null; startWith(r); toast('Ready. Sessions save to your Sheet.');
  } catch (e) { S.setupBusy = null; S.setupMsg = codeText(e).text; render(); }
}

function planSummary(p) {
  const keys = planKeys(p), set = keys.filter(k => p.days[k]);
  if (!set.length) return keys.length + '-day plan · no days set yet';
  const work = set.filter(k => p.days[k].type !== 'Rest').length, rest = set.length - work, open = keys.length - set.length;
  return keys.length + '-day plan · ' + work + ' workout day' + (work === 1 ? '' : 's') + (rest ? ' · ' + rest + ' rest' : '') + (open ? ' · ' + open + ' not set' : '');

  return '<p class="setlab">Color theme</p><div class="palrow">' + PALS.map(p => '<button class="palbtn' + (p.k === cur ? ' on' : '') + '" data-act="pal" data-k="' + p.k + '" aria-pressed="' + (p.k === cur) + '"><span class="sw2" aria-hidden="true"><i style="background:' + p.b + '"></i><i style="background:' + p.g + '"></i></span>' + esc(p.n) + '</button>').join('') + '</div>' +
    '<p class="hint">Changes every navy and gold in the app, in light and dark mode. Kept on this phone.</p>' +
    '<p class="setlab">App icon</p><div class="icrow"><img src="' + esc(iconSrc()) + '" alt=""><div class="ict"><b>' + (ic && ic.data ? 'Your picture' : 'Default logo') + '</b><span>' + (ic && ic.data ? 'Saved in your Google Drive (' + where + ' folder).' : 'Tap the logo at the top left, or here, to use your own.') + '</span></div><button class="btn" data-act="icon-open">Change</button></div>';
}
function openIconSheet() {
  if (!S.mcp) { toast('Still connecting to Google Drive. Try again in a moment.'); return; }
  S.iconSheet = { busy: false, msg: '' }; render();
}
function renderIconSheet() {
  const box = $('#iconSheet'); if (!box) return;
  const I = S.iconSheet; if (!I) { if (box.innerHTML) box.innerHTML = ''; return; }
  const ic = store.get(K_ICON), own = !!(ic && ic.data), dis = I.busy ? ' aria-disabled="true"' : '';
  const where = 'Workout Lite';
  box.innerHTML = '<div class="sheet-bg" data-act="icon-close"><div class="sheet" role="dialog" aria-label="App icon" data-act="noop"><div class="sheet-h"><b>App icon</b><button class="btn sm" data-act="icon-close">Close</button></div>' +
    '<div class="icprev"><img src="' + esc(iconSrc()) + '" alt="Current icon"></div><div class="sheet-list">' +
    '<label class="sheet-it" for="iconIn"' + dis + '>' + (own ? 'Upload a new picture' : 'Upload a picture') + '<span class="pp-sub">Cropped to a square from the middle. Saved in your Google Drive (' + where + ' folder).</span></label>' +
    '<input type="file" id="iconIn" accept="image/*" hidden>' +
    '<button class="sheet-it' + (own ? '' : ' on') + '" data-act="icon-default"' + dis + '>' + (own ? '' : '✓ ') + 'Default logo<span class="pp-sub">' + (own ? 'Removes your picture from Drive.' : 'In use.') + '</span></button></div>' +
    (I.busy || I.msg ? '<p class="hint fsh-note"' + (I.err ? ' style="color:var(--bad)"' : '') + '>' + esc(I.busy ? I.busy : I.msg) + '</p>' : '') + '</div></div>';
}
// web 0.2d: the picture is a JPEG in the Workout Lite folder (web backend api_icon*); the newest one wins on every phone
async function uploadIcon(file) {
  if (!S.iconSheet) return;
  S.iconSheet = { busy: 'Saving your icon to Google Drive…' }; render();
  let url = '';
  try {
    url = URL.createObjectURL(file); const img = await loadImg(url);
    const sq = Math.min(img.naturalWidth, img.naturalHeight);
    const c = drawCanvas(img, { x: (img.naturalWidth - sq) / 2, y: (img.naturalHeight - sq) / 2, w: sq, h: sq }, 256);
    const data = c.toDataURL('image/jpeg', 0.88);
    const r = await withTimeout(gs('api_iconSet', data.split(',')[1]), 60000);
    store.set(K_ICON, { id: r && r.id, data });
    S.iconSheet = null; applyLogo(); render(); toast('Icon saved to your Google Drive.');
  } catch (err) { S.iconSheet = { busy: false, err: true, msg: 'The icon was not saved. ' + (err && err.message && !/^\{/.test(err.message) ? err.message : codeText(err).text) }; render(); }
  finally { if (url) URL.revokeObjectURL(url); }
}
async function iconDefault() {
  const ic = store.get(K_ICON); if (!(ic && ic.data)) { S.iconSheet = null; render(); return; }
  S.iconSheet = { busy: 'Going back to the default logo…' }; render();
  try { await withTimeout(gs('api_iconDel'), 60000); store.del(K_ICON); S.iconSheet = null; applyLogo(); render(); toast('Back to the default logo.'); }
  catch (err) { S.iconSheet = { busy: false, err: true, msg: 'Your picture could not be removed from Drive, so it stays for now. ' + codeText(err).text }; render(); }
}
let iconSyncing = false;
async function syncIcon() {
  if (!S.mcp || iconSyncing) return; iconSyncing = true;
  try {
    const ic = store.get(K_ICON), r = await gs('api_iconGet', ic && ic.id || '');
    if (!r) { if (ic) { store.del(K_ICON); applyLogo(); if (S.tab === 'settings') render(); } return; }
    if (r.same) return;
    store.set(K_ICON, { id: r.id, data: r.data }); applyLogo(); if (S.tab === 'settings' || S.iconSheet) render();
  } catch (e) { /* keep what the phone has */ }
  finally { iconSyncing = false; }
}
applyPal();
document.addEventListener('toggle', e => { const t = e.target; if (t && t.matches && t.matches('details.wk')) S.wkOpen = t.open; }, true);   /* Ver 0.1x: keep This week's targets open across re-renders */
S.initState = 'wait';
const cache = store.get(K_CACHE);
if (cache && cache.ex) {
  setData(cache.ex, cache.ar); S.loadedAt = cache.at; S.sheetUrl = cache.url; S.sheetTitle = cache.title; S.sheetTab = cache.tab;
  LOG_TAB = cache.tab || '';
  { const pc = store.get(K_PLANS); if (pc && Array.isArray(pc.rows)) { const p = parsePlans(pc.rows); S.wp.plans = p.plans; S.wp.favs = p.favs; } }
  setSync('busy', 'Copy from ' + timeShort(cache.at));
  ensureDraft();
} else { S.tab = 'setup'; setSync('busy', 'Connecting…'); }
const tm = store.get(K_TIMER); if (tm && tm.end > Date.now() - 60000) { T.end = tm.end; T.total = tm.total; runTimer(); } else renderTimer();
render();

withTimeout(gs('api_init'), 60000).then(startWith).catch(err => {
  S.initState = 'ready';
  const t = codeText(err);
  if (S.tab === 'setup') { S.setupMsg = t.text; }
  else S.problem = { text: t.text + (S.loadedAt ? ' Showing the copy from ' + timeShort(S.loadedAt) + '.' : ''), retry: false };
  setSync('err', S.loadedAt ? 'Offline copy' : 'Not synced');
  render();
});
})();
</script>
<script>
/* Web 0.3g.1: measure how much shorter than the screen the page is in the iPhone home-screen app (see --vgap above) */
(function () {
  function run() {
    var sa = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches), g = 0;
    if (sa && window.screen) {
      var port = window.innerHeight >= window.innerWidth, full = port ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
      g = Math.round(full - window.innerHeight); if (g < 8 || g > 140) g = 0;
    }
    document.documentElement.style.setProperty('--vgap', g + 'px');
  }
  run(); window.addEventListener('resize', run); window.addEventListener('orientationchange', function () { setTimeout(run, 300); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) setTimeout(run, 250); });
  window.addEventListener('pageshow', run);
})();
</script>
