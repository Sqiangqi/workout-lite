<style>#splashRing{transform-origin:64px 64px;transform-box:view-box;animation:splashRing 1.2s linear infinite}@keyframes splashRing{from{transform:rotate(-90deg)}to{transform:rotate(270deg)}}#splash.go #splashDay{text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:600}#splash.go #splashHi{letter-spacing:.01em}#splash.studio #splashHi{font-weight:600;letter-spacing:-.025em;font-size:26px}#splash.studio circle{stroke-width:2}#splash .sp-txt{animation:splashIn .4s ease .1s both}@keyframes splashIn{from{opacity:0;transform:translateY(6px)}}#splash.off{opacity:0!important;visibility:hidden}#splash.off .sp-mark{transform:scale(1.08);transition:transform .35s ease}#splash.fly{pointer-events:none;transition:background-color .3s ease .1s!important}#splash.fly.bgout{background-color:transparent!important}#splash.fly .sp-mark{transition:transform .42s cubic-bezier(.65,0,.25,1)}#splash.fly .sp-mark svg{opacity:0;transition:opacity .25s ease}#splash.fly .sp-txt{opacity:0;transform:translateY(12px);transition:opacity .3s ease,transform .3s ease}@media (prefers-reduced-motion:reduce){#splashRing{animation:none;stroke-dasharray:none}#splash .sp-txt{animation:none}}</style>
<script>/* Loading screen: icon with a ring that draws once, a greeting for the time of day and the date, in the colours of the
   last visit (wlite.splash.v1, written by the app); the app fades it out when Home is ready. */
(function () { try {
  var s = JSON.parse(localStorage.getItem('wlite.splash.v1') || 'null'), d = document.getElementById('splash'), im = document.getElementById('splashLogo');
  var n = new Date(), hr = n.getHours(), hi = hr < 5 ? 'Good evening' : hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening';
  if (s) { if (s.bg) d.style.background = s.bg; if (s.ink) d.style.color = s.ink; if (s.logo && /^data:/.test(s.logo)) im.src = s.logo; if (s.ring) document.getElementById('splashRing').style.stroke = s.ring; }
  else { var dk = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches; d.style.background = dk ? '#000000' : '#f2f2f7'; d.style.color = dk ? '#c7c7cc' : '#6e6e73'; }   /* 0.3r.14: look unknown: plain, never the Go Blue colours */
  d.className = s && s.style === 'studio' ? 'studio' : 'go';
  document.getElementById('splashHi').textContent = s && s.user ? hi + ', ' + s.user : hi;
  document.getElementById('splashDay').textContent = n.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  setTimeout(function () { d.classList.add('off'); }, 8000);   /* never stays longer than this, even if the app fails */
} catch (e) {} })();
</script>

<style>
/* Layout: one phone-width column; sticky day header, tabbed views, rest timer docked to the bottom edge like a gym plate rack. */
:root {
  /* Michigan blue and maize */
  --brand: #14284b;        /* logo navy (Michigan navy was #00274C): header band, both themes */
  --gold: #d8b072;         /* champagne gold from the logo (user, 2026-10-31 trial; maize was #ffcb05): primary buttons, chart points */
  --gold-ink: #14284b;
  --gold-rgb: 216,176,114; --brand-rgb: 20,40,75; --gold-hi: #f6e3b8;   /* colour themes swap these */
  --on-brand: #ffffff;
  --on-brand-muted: #b8c4d3;
  --on-brand-warn: #f0d6a2;
  --on-brand-bad: #ff9d93;
  --bg: #eef1f5;
  --surface: #ffffff;
  --ink: #0f1d2e;
  --muted: #56657a;
  --line: #d3dae3;
  --accent: #14284b;
  --accent-ink: #ffffff;
  --accent-soft: #e3eaf3;
  --lighter: #98a4b3;      /* grey dots for lighter sets */
  --good: #2f7d4f;
  --warn: #a2560a;
  --bad: #b3261e;
  --push: #3d6fb6; --pull: #6b7480; --legs: #b38a12; --core: #7a5aa6;
  /* Ver 0.3r.43 (user): Apple system font in the whole app, every style (was Barlow / Barlow Condensed in Go Blue) */
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "PingFang SC", "Noto Sans SC", sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Noto Sans SC", sans-serif;
  --r: 12px;   /* Ver 0.3r.6: one corner size for cards everywhere (was 10, 12 or 14) */
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1420; --surface: #13202f; --ink: #e8edf3; --muted: #9aa8b8; --line: #263548;
  --accent: #d8b072; --accent-ink: #14284b; --accent-soft: #2e2716; --lighter: #6c7a8c;
  --good: #6cc391; --warn: #e6a35a; --bad: #f08a80;
  --push: #7ea6e0; --pull: #a3acb6; --legs: #e0bd52; --core: #b79ae0;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b1420; --surface: #13202f; --ink: #e8edf3; --muted: #9aa8b8; --line: #263548;
  --accent: #d8b072; --accent-ink: #14284b; --accent-soft: #2e2716; --lighter: #6c7a8c;
  --good: #6cc391; --warn: #e6a35a; --bad: #f08a80;
  --push: #7ea6e0; --pull: #a3acb6; --legs: #e0bd52; --core: #b79ae0;
  color-scheme: dark; }

html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.4; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--brand); }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--brand); color: var(--on-brand); border-bottom: 3px solid var(--gold); }
header.top .wrap { padding-block: 12px 14px; display: grid; gap: 6px; }   /* room above the gold line */
.hrow { display: flex; justify-content: space-between; gap: 12px; }

/* Ver 0.3p.15: Me page */

  .me-wk b.rest { color: var(--lighter); }

/* Exercise card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; }
.card.warm { padding-block: 10px; }
.chead { display: flex; gap: 10px; align-items: flex-start; }
.chead .titles { flex: 1; min-width: 0; display: grid; gap: 2px; }
.ex-name { position: relative; display: inline-block; font-family: var(--font-display); font-weight: 600; font-size: 22px; line-height: 1.1; }
.ex-name.has-tip { cursor: help; text-decoration: underline dotted var(--muted); text-underline-offset: 4px; text-decoration-thickness: 1px; }
.tip { display: none; position: absolute; left: 0; top: calc(100% + 6px); z-index: 4; width: min(340px, 80vw); background: var(--ink); color: var(--surface); font-family: var(--font-body); font-size: 15px; font-weight: 400; line-height: 1.5; padding: 10px 12px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.25); white-space: normal; }
@media (hover: hover) { .ex-name.has-tip:hover .tip { display: block; } }
.ex-name.open .tip { display: block; }
.meta { font-size: 13px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; }
.chip.push { color: var(--push); } .chip.pull { color: var(--pull); } .chip.legs { color: var(--legs); } .chip.core { color: var(--core); }

.pic { display: block; width: 100%; border: 0; padding: 0; background: none; border-radius: 8px; overflow: hidden; aspect-ratio: 3 / 2; max-width: 100%; }
.pic.sm { width: 112px; flex: none; border-radius: 6px; box-shadow: 0 0 0 1px var(--line); }
@media (min-width: 560px) { .pic.sm { width: 150px; } }
.pic svg, .pic img { width: 100%; height: 100%; display: block; object-fit: cover; }

.last { font-size: 13px; color: var(--muted); background: var(--bg); border-radius: 8px; padding: 6px 10px; font-variant-numeric: tabular-nums; }
.last b { color: var(--ink); font-weight: 600; }

.sets { display: grid; gap: 6px; }
.set { display: grid; grid-template-columns: 26px 1fr 1fr; gap: 8px; align-items: center; }

.set .n { font-family: var(--font-display); font-weight: 600; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.field { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 0 8px; min-width: 0; }
.field input { width: 100%; min-width: 0; border: 0; background: none; padding: 8px 0; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.field input::placeholder { color: var(--lighter); font-size: 13px; font-weight: 400; font-style: italic; opacity: 1; }
.field.ghost { background: var(--surface); border-style: dashed; }
.set .n.fill { border: 1px solid var(--line); border-radius: 6px; background: var(--bg); height: 34px; padding: 0; font-family: var(--font-display); font-weight: 600; color: var(--accent); }
.field span { font-size: 13px; color: var(--muted); padding-left: 4px; }
.handle { flex: none; border: 0; background: none; letter-spacing: -3px; cursor: grab; touch-action: none; padding: 0; }
.chead { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.card.dragging { position: relative; z-index: 3; box-shadow: 0 10px 28px rgba(0,0,0,.25); transition: none; }
.card { transition: transform .15s ease; }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }
.set { position: relative; }
.set.act .field { border-color: var(--accent); }
.rec { grid-column: 2 / -1; font-size: 13px; font-weight: 600; color: var(--warn); }
.rec:empty { display: none; }

.qlab { font-size: 13px; color: var(--muted); min-width: 56px; }
.qb { flex: 1; min-width: 48px; padding: 8px 0; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-weight: 600; font-variant-numeric: tabular-nums; }
.add-set:disabled { opacity: .4; cursor: default; }
.add-set { justify-self: start; background: none; border: 1px dashed var(--accent); color: var(--accent); border-radius: 8px; padding: 6px 14px; font-weight: 600; }

.btn { border-radius: 8px; padding: 9px 14px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.btn.primary { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
.btn:disabled { opacity: .5; cursor: default; }

.savebox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; }
.savebox p { margin: 0; color: var(--muted); font-size: 15px; }
.savebox .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.empty { text-align: center; color: var(--muted); padding: 24px 12px; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); }

/* Progress chart */
.chartbox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; }
.chartbox svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.hist { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
.hist th { text-align: left; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 4px 6px; border-bottom: 1px solid var(--line); }

.handle { width: 30px; height: 36px; font-size: 17px; color: var(--muted); border-radius: 6px; }

.btn.sm { padding: 4px 10px; font-size: 13px; }
/* dark mode and colour theme changes wipe in from the top instead of switching at once (themeSwap) */
::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
::view-transition-new(root) { animation: themeWipe .6s cubic-bezier(.4, 0, .2, 1) both; }
@keyframes themeWipe { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }

.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 8px); transform: translateX(-50%); z-index: 40; max-width: calc(100% - 32px); width: max-content;
  display: flex; align-items: center; gap: 10px; padding: 7px 14px; border-radius: 999px; font-size: 13px; line-height: 1.3;
  background: rgba(255,255,255,.88); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 4px 16px rgba(0,0,0,.12);
  -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); pointer-events: none; }
:root[data-theme="dark"] .toast { background: rgba(30,36,48,.88); }
@media (prefers-reduced-motion: no-preference) { .toast { animation: toastIn .25s ease-out; } @keyframes toastIn { from { transform: translate(-50%, -14px); opacity: 0 } } }
.toast .undo { pointer-events: auto; flex: none; padding: 2px 10px; border: 0; border-radius: 999px; background: var(--brand); color: var(--gold); font: inherit; font-weight: 700; }

/* Countdown timer for time exercises */
.cd { display: grid; gap: 8px; margin: 2px 0 10px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.cd-main { display: flex; align-items: center; justify-content: center; gap: 18px; }
.cd-main b { font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; min-width: 4.2ch; text-align: center; }
.cd-adj { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 24px; font-weight: 600; line-height: 1; }
.cd-adj:disabled { opacity: .35; }
.cd-btns { display: flex; gap: 10px; justify-content: center; }
.cd-btns .btn.sm:disabled { opacity: .4; }
.cd-note { font-size: 13px; color: var(--muted); text-align: center; }
/* Pull Up body weight + band */
.pu { display: grid; gap: 8px; margin: 2px 0 10px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.pu-row { display: flex; align-items: center; gap: 10px; min-height: 36px; }
.pu-row .switch { flex: none; gap: 10px; }
.pu-row .field { flex: 1; max-width: 140px; }
.pu-lab { font-size: 15px; color: var(--muted); flex: none; }
.pu-val { font-size: 17px; font-variant-numeric: tabular-nums; }
.pu-src { font-size: 13px; color: var(--muted); flex: 1; min-width: 0; }
.pu-row .btn.sm { flex: none; }
.pu-ask.need .field { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(var(--gold-rgb), .35); }
.pu-note { font-size: 13px; color: var(--muted); line-height: 1.35; }
.pu-off { opacity: .4; pointer-events: none; }
/* Stopwatch sets (Dead Hang) */
#view .card[data-id] .set.swset, .set.swset { grid-template-columns: 24px 1fr; row-gap: 4px; }
.sw { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sw b { font-family: var(--font-display); font-weight: 700; font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; }
.sw-btn { border: 0; border-radius: 10px; padding: 10px 22px; font-weight: 700; font-size: 17px; background: var(--brand); color: var(--gold); }
.sw-btn.stop { background: var(--bad); color: #fff; }
.swman { grid-column: 2; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.swman input { width: 6.5em; font-size: 13px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
.swman input::placeholder { color: var(--lighter); font-style: italic; }

/* Black + Silver ("a bit metallic"): near-black in place of the navy, silver in place of the gold.
 The silver parts people see most get a brushed-metal gradient (--metal) instead of a flat colour; small details stay flat silver. */
:root[data-pal="steel"] {
  --brand: #111214; --gold: #c3c7cd; --gold-ink: #111214; --gold-rgb: 195,199,205; --brand-rgb: 17,18,20; --gold-hi: #f4f6f8;
  --on-brand-muted: #a9aeb5; --on-brand-warn: #e6d3a8;

:root[data-pal="steel"] .wh-band, :root[data-pal="steel"] .lmap .lm-pill.sel.sel, :root[data-pal="steel"] .savebox .okbadge {
  background: var(--metal); text-shadow: 0 1px 0 rgba(255,255,255,.45); }
:root[data-pal="steel"] .switch input:checked + i, :root[data-pal="steel"] .wh-band { text-shadow: none; }

/* Settings as one grouped list, iPhone style */
.setgroup { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); margin-top: 10px; }
.setrow { position: relative; min-width: 0; display: flex; align-items: center; gap: 14px; min-height: 54px; padding: 8px 14px; cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; }
.setgroup > .setsec + .setsec > .setrow::before { content: ""; position: absolute; top: 0; left: 60px; right: 0; border-top: 1px solid var(--line); }
.setrow:active { background: var(--accent-soft); }
.setgroup > .setsec:first-child > .setrow { border-radius: var(--r) var(--r) 0 0; }
.setsec.on { border: 2px solid var(--gold); border-radius: 12px; margin: 4px; }
.setsec.on > .setrow { padding-left: 10px; padding-right: 10px; border-radius: 10px 10px 0 0; }
.setsec.on > .setrow::before, .setsec.on + .setsec > .setrow::before { display: none; }
.seticon { flex: none; width: 32px; height: 32px; border-radius: 8px; background: var(--brand); color: var(--gold); display: grid; place-items: center; }
.settitle { flex: 1 0 auto; min-width: 0; white-space: nowrap; font-size: 17px; font-weight: 500; color: var(--ink); }   /* 0.3p.34: names on one line; the side text gives way (…) */
.setside { flex: 0 1 auto; min-width: 0; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.setchev { flex: none; width: 9px; height: 9px; margin: 0 4px 0 2px; border-right: 2.5px solid var(--muted); border-bottom: 2.5px solid var(--muted); transform: rotate(-45deg); transition: transform .2s; }
.setrow.on .setchev { transform: rotate(45deg) translate(-2px, -2px); }
/* Ver 0.3p.35: a Settings section as its own page: icon + title at the top, then its panel */
.setpage-h { display: flex; align-items: center; gap: 12px; margin: 2px 0 14px; }
.setpage-h > span:last-child { display: grid; gap: 1px; min-width: 0; } .setpage-h b { font-size: 20px; font-weight: 600; color: var(--ink); } .setpage-h small { font-size: 13px; color: var(--muted); }
.setpage-h .seticon { width: 38px; height: 38px; border-radius: 10px; }
.setsec > .panel.setpanel { border: 0; border-radius: 0; background: none; margin: 0; padding: 4px 14px 14px; }
.setsec > .notice { margin: 0 14px 8px; }
/* the logo opens the App icon sheet; a picture of your own shows as a circle */
img.logo { cursor: pointer; -webkit-tap-highlight-color: transparent; }
img.logo.custom { border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); box-sizing: border-box; }
.paldots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 6px; justify-items: center; padding: 4px 0; }
.paldot { width: 48px; height: 48px; padding: 0; border: 0; border-radius: 50%; background: none; position: relative; -webkit-tap-highlight-color: transparent; }
.paldot i { position: absolute; inset: 2px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(127,127,127,.35); }
.paldot.on i { box-shadow: 0 0 0 2.5px var(--surface), 0 0 0 4.5px var(--gold); }
.paldot.on::after { content: ""; position: absolute; left: 18px; top: 12px; width: 9px; height: 17px; border: solid #fff; border-width: 0 3px 3px 0; transform: rotate(45deg); filter: drop-shadow(0 0 1.5px rgba(0,0,0,.6)); }
.paldot:active i { transform: scale(.93); }
.paldot-n { margin: 6px 0 0; text-align: center; font-size: 13px; font-weight: 600; color: var(--ink); }
.pal-h { display: flex; justify-content: space-between; align-items: baseline; } .pal-h b { text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--ink); }
   /* 2 x 2 since the 4th theme */

 

.setlab { font-size: 15px; font-weight: 600; margin: 4px 0 0; }

/* Ver 0.3r.59 (user: the top of the App icon page was cut off): the sheet scrolls inside the screen */
#iconSheet .sheet { box-sizing: border-box; max-height: calc(100dvh - env(safe-area-inset-top, 0px) - 24px); overflow-y: auto; overscroll-behavior: contain; }

 
.icprev { display: flex; justify-content: center; padding: 4px 0 6px; } .icprev img { flex: none; border-radius: 50%; object-fit: cover; background: var(--brand); width: 84px; height: 84px; border: 2px solid var(--gold); }
label.sheet-it { display: block; cursor: pointer; }
.sheet-it[aria-disabled="true"] { opacity: .5; pointer-events: none; }
.switch.dis { opacity: .45; pointer-events: none; }   /* Dark mode greyed out while Follow the phone setting is on */
.switch.dis input:checked + i { background: var(--muted); }   /* no gold while it cannot be used; gold returns when Follow is off */

/* Ver 0.3s.9: Food tab idea A: round week days, calorie ring beside the bars, one settings line, Add food sheet */
.fweeks { display: flex; margin-top: 2px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; }
.fweeks::-webkit-scrollbar { display: none; }
.fdots { flex: 0 0 100%; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; scroll-snap-align: start; scroll-snap-stop: always; }
.fdot { display: grid; justify-items: center; gap: 3px; padding: 2px 0; border: 0; background: none; color: var(--muted); font: inherit; font-size: 11px; line-height: 1.1; -webkit-tap-highlight-color: transparent; }
.fdot b { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 600; background: var(--bg); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); transition: background .15s, color .15s; }
.fdot.high b { background: rgba(var(--gold-rgb), .22); }
.fdot.today span { color: var(--ink); font-weight: 700; }
.fdot.on b { background: var(--gold); color: var(--gold-ink); box-shadow: none; }
.fdot .dot { width: 5px; height: 5px; border-radius: 50%; } .fdot .dot.ok { background: var(--good); } .fdot .dot.over { background: var(--bad); } .fdot .dot.under { background: var(--muted); opacity: .6; }
.fsum { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 14px; align-items: center; margin-top: 4px; }
.fsum .nbars { gap: 10px; min-width: 0; }
.fsum .nbar { grid-template-columns: 52px minmax(0, 1fr) 46px; gap: 6px; }
.fring { position: relative; width: 112px; height: 112px; }
.fring svg { display: block; transform: rotate(-90deg); }
.fring circle { fill: none; stroke-width: 9; }
.fr-bg { stroke: rgba(var(--brand-rgb), .08); }
:root[data-theme="dark"] .fr-bg { stroke: rgba(255,255,255,.08); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fr-bg { stroke: rgba(255,255,255,.08); } }
.fr-e, .fr-p { stroke: var(--accent); stroke-linecap: round; } .fr-p { opacity: .38; } .fring circle.z { stroke-linecap: butt; }
.fring.over .fr-e, .fring.over .fr-p { stroke: var(--bad); opacity: 1; }
.fr-t { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; line-height: 1.15; }
.fr-t b { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; } .fring.over .fr-t b { color: var(--bad); }
.fr-t small { font-size: 11px; color: var(--muted); } .fr-t .fr-of { font-variant-numeric: tabular-nums; }
.finfo { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 0 2px; font-size: 13px; color: var(--muted); }
.finfo-b { border: 0; background: none; padding: 5px 6px; border-radius: 8px; color: var(--ink); font: inherit; font-weight: 600; }
.finfo-b.need { color: var(--bad); }
.finfo-b:active { background: rgba(var(--gold-rgb), .2); }
/* Ver 0.3s.12: Add food in the bottom strip, right side: bowl in a gold circle with a small label (was a big bar pinned over the page) */
.dock-add { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 0; pointer-events: auto; display: grid; justify-items: center; gap: 1px; min-width: 56px; padding: 0 2px 1px; border: 0; background: none; color: var(--ink); font: inherit; -webkit-tap-highlight-color: transparent; }
.dock-add .da-c { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--gold); color: var(--gold-ink); box-shadow: 0 2px 6px rgba(var(--gold-rgb), .35); transition: transform .12s; }
.dock-add .da-t { font-size: 10px; font-weight: 600; letter-spacing: .01em; line-height: 1.2; }
.dock-add:active .da-c { transform: scale(.92); }
/* Ver 0.3t.5: every button answers the touch at once: it dims (small ones also press in) the moment it is touched, before
   the work behind it is done, and comes back softly; no grey tap flash, no waiting for a double-tap zoom */
button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; transition: opacity .18s ease; }
button:active:not(:disabled):not(:is(.sheet-it, .tm-it, .wu-it, .lib-st, .qft, .tidy-it, .th, .lm-mr-p)) { opacity: .7; transition-duration: 0s; }   /* list rows keep their own row highlight, so a scroll does not flicker them */
:is(.btn, .run-btn, .qb, .qchip, .sp-band, .add-set, .bunit button, .me-cb, .rt-opt, .lm-add):active:not(:disabled) { transform: scale(.96); }
@media (prefers-reduced-motion: reduce) { :is(.btn, .run-btn, .qb, .qchip, .sp-band, .add-set, .bunit button, .me-cb, .rt-opt, .lm-add):active { transform: none; } }
.sheet-it .az-fav { font-style: normal; color: var(--gold, #c9a227); font-size: .8em; margin-left: 4px; }   /* Ver 0.3t.3 */
/* Ver 0.3t.2: a sheet with the keyboard up sits at the top, above the keyboard */
html.sheet-kb .sheet-bg { align-items: flex-start; top: var(--vv-t, 0px); bottom: auto; height: var(--vv-h, 100%); }
html.sheet-kb .sheet-bg > .sheet { border-radius: 0 0 18px 18px; max-height: calc(var(--vv-h, 100dvh) - 6px); overflow-y: auto; padding-bottom: 12px; }
html.sheet-kb .sheet-bg > .fadd-sheet { max-height: min(88vh, calc(var(--vv-h, 100dvh) - 6px)); overflow-y: visible; }
.fadd-sheet { max-height: 88vh; grid-template-rows: auto minmax(0, 1fr) auto; }

.fadd-body .section-h { margin-top: 4px; }
.fadd-body > .panel { padding: 0 2px; background: none; border: 0; box-shadow: none; }   /* 0.3s.10: lined up with the headings, no inner box */

/* Food tab nutrition bars (bars instead of the Target / Left number lines) */
.nbars { display: grid; gap: 7px; }
.nbar { display: grid; grid-template-columns: 62px 1fr 62px; align-items: center; gap: 10px; font-size: 13px; }

/* Ver 0.3p.19: Muscles worked period: 7 and 30 as two overlapping pills, the chosen one bigger and in front, then 'days' */
.mxd { display: inline-flex; align-items: center; gap: 5px; border: 0; background: none; padding: 2px 2px 2px 0; font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.mxd:active .mxd-st { transform: scale(.96); } 
/* Ver 0.3p.29 (user 2026-11-16: "make the selection window bigger and covering days"): the chosen pill is bigger and holds
   the word: "7 days" / "30 days"; the other is a small number pill tucked about half behind it, still readable.
   Plain flex row (30 then 7 since 0.3p.30; the second overlaps the first by margin-left); a tap only swaps .on and CSS transitions do the move: the
   word's max-width opens in one pill and closes in the other, so the row reflows smoothly; no end jump. */
.mxd-st { transition: transform .15s ease; display: inline-flex; align-items: center; height: 34px; }
.mxd-b { position: relative; display: inline-flex; align-items: center; justify-content: center; height: 30px; min-width: 32px; box-sizing: border-box; padding: 0 9px; border: 0; border-radius: 999px; white-space: nowrap;
  font: 700 16px var(--font-body); font-variant-numeric: tabular-nums;
  transition: transform .42s cubic-bezier(.22,.61,.36,1), opacity .3s ease, background-color .3s ease, color .3s ease, box-shadow .3s ease, padding .42s cubic-bezier(.22,.61,.36,1); }
.mxd-b + .mxd-b { margin-left: -7px; }   /* 0.3p.30: 30 on the left, 7 on the right */
.mxd-b.on { z-index: 2; padding: 0 12px; transform: scale(1.08); background: var(--brand); color: var(--gold); box-shadow: 0 2px 8px rgba(0,0,0,.22); }
.mxd-b:not(.on) { z-index: 1; background: rgba(var(--brand-rgb), .28); color: var(--muted); opacity: .8; transform: scale(.84); }
.mxd-b:first-child:not(.on) { transform-origin: 100% 50%; } .mxd-b:last-child:not(.on) { transform-origin: 0 50%; }
:root[data-theme="dark"] .mxd-b:not(.on) { background: rgba(255,255,255,.14); }
.mxd-l { margin-left: 1px; font-size: 15px; font-weight: 600; color: var(--muted); }   /* 0.3p.31: "days" outside the pills again (user) */
:root[data-style="studio"][data-style] .mxd-b.on { background: var(--accent); color: var(--on-acc, #fff); }
.mx-card svg { display: block; width: 100%; max-width: 360px; height: auto; margin: 0 auto; }
.mx-grid { fill: none; stroke: var(--muted); stroke-opacity: .38; stroke-width: 1; }   /* Ver 0.3s.16: was --line, too faint on the phone */
.mx-grid.out { stroke-opacity: .6; stroke-width: 1.5; }
.mx-ring { font-family: var(--font-body); font-size: 12px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.mx-area { fill: rgba(var(--gold-rgb), .12); stroke: var(--gold); stroke-width: 2; stroke-linejoin: round; transform-origin: 160px 132px; animation: mxIn .45s cubic-bezier(.2, .7, .3, 1); }
.mx-dot { fill: var(--gold); stroke: var(--surface); stroke-width: 2; }

.mx-lab { font-family: var(--font-body); font-weight: 600; fill: var(--ink); }
.mx-lab.top { fill: var(--accent); font-weight: 700; }
.mx-num { font-family: var(--font-body); fill: var(--muted); font-variant-numeric: tabular-nums; }
.mx-sum { margin: 0; text-align: center; font-size: 13px; color: var(--muted); }
.mx-sum b { color: var(--ink); }
/* Home open: the chart points are moved out by mxTravel() (Ver 0.3o.18); the area's own short grow-in (mxIn) is for 7 / 30 day changes */
.mx-card.anim .mx-area { animation: none; }
.mx-card.hold * { animation-play-state: paused !important; }
@keyframes mxIn { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .mx-area { animation: none; } }
/* Ver 0.3b: new Home (design B): compact header, three rings, Muscles worked, two tiles, Start workout pinned above the strip */

body.home main .wrap { padding-bottom: calc(var(--tabbar-h) + 20px); }
.hm-rings { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }

.hm-tk, .hm-blk, .hm-bbg { fill: none; stroke-width: 9; }

.hm-ring svg { width: min(86px, 24vw); height: auto; overflow: visible; }

.hm-rings.anim .hm-blk { opacity: 0; animation: hmMerge .4s ease-out var(--d) forwards; }
.hm-rings.anim .hm-burst line { transform-box: view-box; transform-origin: 50px 50px; animation: hmBurst .7s ease-out var(--d) both; }
.hm-rings.anim .hm-chk { stroke-dasharray: 40; stroke-dashoffset: 40; animation: hmDraw .4s ease-out var(--d) forwards; }

@keyframes hmBurst { 0% { opacity: 0; transform: scale(.7); } 30% { opacity: 1; } 100% { opacity: 0; transform: scale(1.18); } }
@keyframes hmDraw { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .hm-rings.anim .hm-tk, .hm-rings.anim .hm-blk { animation: none; opacity: 1; } .hm-rings.anim .hm-burst line { animation: none; } .hm-rings.anim .hm-chk { animation: none; stroke-dashoffset: 0; } }

.hm-tiles { display: grid; grid-template-columns: minmax(0, 1fr) 92px; gap: 8px; }   /* Ver 0.3t.10: Last workout wide, Food narrow */

.hm-mus { display: grid; grid-template-columns: repeat(2, minmax(0, max-content)); justify-content: start; gap: 4px clamp(5px, 2vw, 8px); margin: 2px 0 1px; }   /* Ver 0.3g: two columns, each as wide as its longest name */   /* Ver 0.3f: muscles of the last workout, each with a green check */

/* Ver 0.3o.17: when Home opens, the muscle names slide in and their green checks pop one by one */
.hm-tiles.anim .hm-mus i { animation: musIn .3s ease-out both; animation-delay: calc(.9s + var(--k, 0) * 110ms); }
.hm-tiles.anim .hm-mus i b { animation: chkPop .4s cubic-bezier(.3, 1.7, .5, 1) both; animation-delay: calc(1s + var(--k, 0) * 110ms); }
.hm-tiles.hold *, .hm-tiles.hold *::before, .hm-tiles.hold *::after { animation-play-state: paused !important; }
/* Ver 0.3o.18: each check ends with the goal-reached burst: a ring and six sparks in green */
.hm-mus i { display: flex; align-items: center; gap: 4px; min-width: 0; font-style: normal; font-family: var(--font-display); font-size: clamp(12.5px, 3.7vw, 15px); letter-spacing: .01em; font-weight: 600; color: var(--ink); white-space: nowrap; text-overflow: ellipsis; overflow: visible; }
.hm-mus i span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.hm-mus i b { position: relative; }
.hm-tiles.anim .hm-mus i b::after { content: ""; position: absolute; inset: -1px; border-radius: 50%; border: 2px solid var(--good); opacity: 0; pointer-events: none; animation: chkRing .6s ease-out both; animation-delay: calc(1.2s + var(--k, 0) * 110ms); }
.hm-tiles.anim .hm-mus i b::before { content: ""; position: absolute; left: 50%; top: 50%; width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px; border-radius: 50%; pointer-events: none; opacity: 0;
  box-shadow: 0 -12px var(--good), 10.4px -6px var(--good), 10.4px 6px var(--good), 0 12px var(--good), -10.4px 6px var(--good), -10.4px -6px var(--good); animation: chkSpark .6s ease-out both; animation-delay: calc(1.22s + var(--k, 0) * 110ms); }
@keyframes chkRing { 0% { opacity: .9; transform: scale(.8); } 100% { opacity: 0; transform: scale(2.2); } }
@keyframes chkSpark { 0% { opacity: 0; transform: scale(.4); } 30% { opacity: 1; } 100% { opacity: 0; transform: scale(1.5); } }
@media (prefers-reduced-motion: reduce) { .hm-tiles.anim .hm-mus i b::before, .hm-tiles.anim .hm-mus i b::after { animation: none; opacity: 0; } }
@keyframes musIn { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
@keyframes chkPop { 0% { transform: scale(0) rotate(-30deg); } 100% { transform: none; } }
@media (prefers-reduced-motion: reduce) { .hm-tiles.anim .hm-mus i, .hm-tiles.anim .hm-mus i b { animation: none; } }

/* Web 0.3i.2: in the iPhone home-screen app, a page shorter than the screen (Settings, Progress, Start workout) was drawn only down to
   about the status bar height above the bottom, so the bottom strip there was cut off or hidden. Long pages were fine, so every page is now
   at least as tall as the whole screen. (The 0.3g.1 / 0.3i.1 strip-moving script made it worse and was removed.) */
body { min-height: calc(100vh + env(safe-area-inset-top, 0px) + 1px); }
@supports (height: 100lvh) { body { min-height: calc(100lvh + env(safe-area-inset-top, 0px) + 1px); } }
/* Ver 0.3k: Progress and Body pickers: the dropdown on the left (smaller), 3M / 6M / 1Y / All on its right at the same height */

/* Ver 0.3p.11: fixed picker box, name fitted on one line, unit in small text under it */
.ctl-row:has(.pickcol) { align-items: start; }

.fixpick .pk-n { display: block; min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fixpick .pk-n.two { white-space: normal; line-height: 1.08; max-height: 38px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }

.ctl-row:has(.pickcol) .seg.rng { height: 46px; min-width: 172px; justify-content: flex-end; }   /* same box width whatever ranges show */

/* Ver 0.3m: sample charts while there is nothing to show yet */
.smp { position: relative; }
.smp-in { opacity: .55; filter: saturate(.6); pointer-events: none; }
.smp-chip { position: absolute; left: 4px; top: 2px; z-index: 1; padding: 2px 9px; border-radius: 999px; background: var(--gold); color: var(--gold-ink); font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
.smp-note { margin: 2px 0 0; font-size: 13px; line-height: 1.4; color: var(--muted); text-align: center; }
.smp-note b { color: var(--ink); font-weight: 600; }
/* ===== Studio style (a second style beside Go Blue): plain and quiet, like a product page or a keynote slide.
   System font (San Francisco on the iPhone), soft grey page, white cards without borders, round pill buttons, sentence-case
   headings, iPhone-green switches and ONE accent colour taken from the colour theme (its dark colour in light mode, its
   light colour in dark mode; applyPal() puts them in --pal-b / --pal-g). The gold edges and travelling glows are off.
   Applied as data-style="studio" on <html> (applyStyle). The doubled attribute raises the rules above the colour themes. */
:root[data-style="studio"][data-style] {
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "PingFang SC", "Noto Sans SC", sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Noto Sans SC", sans-serif;
  --r: 18px;
  --bg: #f5f5f7; --surface: #ffffff; --ink: #1d1d1f; --muted: #6e6e73; --line: #e3e3e8; --lighter: #aeaeb2;
  --brand: var(--pal-b); --brand-rgb: var(--pal-b-rgb); --gold: var(--pal-b); --gold-rgb: var(--pal-b-rgb); --gold-ink: #ffffff;
  --gold-hi: color-mix(in srgb, var(--pal-b) 35%, #ffffff); --on-acc: #ffffff;
  --accent: var(--pal-b); --accent-ink: #ffffff; --accent-soft: color-mix(in srgb, var(--pal-b) 8%, #ffffff);
  --on-brand: #ffffff; --on-brand-muted: rgba(255, 255, 255, .7);
  --st-fill: rgba(120, 120, 128, .12); --st-shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 6px 20px rgba(0, 0, 0, .05); --st-sw: #34c759;
  --st-bar: rgba(255, 255, 255, .78);
}
:root[data-style="studio"][data-style][data-theme="dark"] {
  --bg: #000000; --surface: #1c1c1e; --ink: #f5f5f7; --muted: #98989d; --line: #38383a; --lighter: #636366;
  --brand: var(--pal-g); --brand-rgb: var(--pal-g-rgb); --gold: var(--pal-g); --gold-rgb: var(--pal-g-rgb); --gold-ink: #111111;
  --gold-hi: color-mix(in srgb, var(--pal-g) 55%, #ffffff); --on-acc: #111111;
  --accent: var(--pal-g); --accent-ink: #111111; --accent-soft: color-mix(in srgb, var(--pal-g) 16%, #1c1c1e);
  --on-brand: #111111; --on-brand-muted: rgba(0, 0, 0, .6);
  --st-fill: rgba(120, 120, 128, .24); --st-shadow: none; --st-sw: #30d158; --st-bar: rgba(28, 28, 30, .78);
}
:root[data-style="studio"] body { font-size: 15px; letter-spacing: -.01em; -webkit-font-smoothing: antialiased; }
:root[data-style="studio"] body::before { background: var(--bg); }
/* cards: white on soft grey, no border, a very soft shadow, larger corners */
:root[data-style="studio"] :is(.card, .panel, .tile, .savebox, .chartbox, .flog, .tl, .ctlcard, .notice, .setgroup, .mx-card, .hm-rings, .cd-adj, .wpd-sel, .wpd-foot, .ph-delta, .qft-a, .wp-li2) {
  border-color: transparent; box-shadow: var(--st-shadow); border-radius: var(--r); }
:root[data-style="studio"] .ctlcard { border-left: 0; }
:root[data-style="studio"] .setgroup > .setsec:first-child > .setrow { border-radius: var(--r) var(--r) 0 0; }
:root[data-style="studio"] .setsec.on { border: 0; margin: 0; border-radius: 0; background: color-mix(in srgb, var(--ink) 2.5%, var(--surface)); }
:root[data-style="studio"] .setsec.on > .setrow { border-radius: 0; }
:root[data-style="studio"] .seticon { border-radius: 9px; }
/* buttons: pills; plain ones a light grey fill, main ones the accent colour */
:root[data-style="studio"] .btn { border-radius: 999px; font-weight: 500; }
:root[data-style="studio"] .btn:not(.on):not(.primary):not(.danger) { border-color: transparent; background: var(--st-fill); color: var(--ink); }
:root[data-style="studio"] .btn.on { color: var(--on-acc); }
:root[data-style="studio"] .btn.primary { background: var(--gold); border-color: var(--gold); color: var(--on-acc); font-weight: 600; }
:root[data-style="studio"] .btn.primary:disabled { opacity: .35; }
:root[data-style="studio"] .btn.danger { background: #ff3b30; border-color: #ff3b30; color: #fff; }
:root[data-style="studio"] .switch input:checked + i { background: var(--st-sw); }
/* accent backgrounds carry white (light) or near-black (dark) text instead of gold */
:root[data-style="studio"] :is(.run-btn, .qb.fit, .qchip.on, .qfchip.on, .wp-grp.on, .planpill .pp-lab, .toast .undo, .sw-btn, .seticon, .rt-opt, .sp-band.on, .mx-seg .btn.on, .nm-u .btn.on, .ob-day.on, .lm-add, .run-btn.fin, .savebox .okbadge, .lm-add:active, .lm-side) { color: var(--on-acc); }
:root[data-style="studio"] .rt .rt-opt.alt.alt { color: var(--ink); }   /* raised above the accent-text list (which holds .mx-seg .btn.on) */
:root[data-style="studio"] .lm-side { border-color: transparent; }
:root[data-style="studio"] .lm-add { border-color: transparent; }
:root[data-style="studio"] .lm-add::before, :root[data-style="studio"] .ctlcard.glow::before, :root[data-style="studio"] .ctlcard.glow::after,
:root[data-style="studio"] .btn.glowbtn::before, :root[data-style="studio"] .btn.glowbtn::after { display: none; }
:root[data-style="studio"] .btn.glowbtn { border-color: transparent; }
/* type: no condensed capitals; headings bold and tight, small labels in sentence case */
:root[data-style="studio"] :is(.section-h, .mx-h b, .ctl-lab, .sheet-sep, .sp-lab, .ob-card .lab, .ph-head b, .nhead, .tile .lab, .pprow .pp-label, .planpill .pp-lab, .lm-side, .wname b, .setup-hero h1, .rt-stop, .rt-over, .smp-chip, .chip) {
  text-transform: none; letter-spacing: -.01em; }
:root[data-style="studio"] .section-h { font-size: 20px; font-weight: 700; color: var(--ink); letter-spacing: -.02em; }
:root[data-style="studio"] .mx-h b { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
:root[data-style="studio"] .tile .lab { font-size: 13px; font-weight: 500; }
:root[data-style="studio"] .chip { font-size: 11px; font-weight: 600; letter-spacing: 0; border: 0; background: var(--st-fill); padding: 2px 8px; }
:root[data-style="studio"] .ex-name, :root[data-style="studio"] .day { letter-spacing: -.02em; font-weight: 700; }
:root[data-style="studio"] body.home .day { letter-spacing: -.025em; font-size: 30px; }
:root[data-style="studio"] body.home header.top .day small { text-transform: none; letter-spacing: 0; font-size: 15px; }
:root[data-style="studio"] .rt-t, :root[data-style="studio"] .tile .val, :root[data-style="studio"] .hm-ring b { letter-spacing: -.03em; }
:root[data-style="studio"] .rt-opt { font-weight: 600; letter-spacing: 0; }
:root[data-style="studio"] .rt-stop { font-weight: 600; font-size: 13px; }
/* Home: the Start workout button is a wide accent pill */
:root[data-style="studio"] .hm-start { border-radius: 999px; text-transform: none; letter-spacing: -.01em; font-weight: 600; font-size: 20px; color: var(--on-acc); box-shadow: 0 6px 18px rgba(var(--gold-rgb), .28); }
:root[data-style="studio"] .hm-start svg { fill: currentColor; }
/* bottom strip and sheets: translucent frosted glass */
:root[data-style="studio"] .tabbar { background: var(--st-bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); box-shadow: none; }
:root[data-style="studio"] .sheet { border-radius: 22px 22px 0 0; box-shadow: 0 -10px 40px rgba(0, 0, 0, .18); }
:root[data-style="studio"] .dock-btn { border-color: transparent; color: var(--on-acc); }
:root[data-style="studio"] #dockBtn { color: var(--ink); }
/* the exercise picture and the set rows */
:root[data-style="studio"] .pic { border-radius: 14px; }
:root[data-style="studio"] #view .card[data-id].focus > .pic { border-radius: 16px; box-shadow: none; }
:root[data-style="studio"] #view .card[data-id].focus .set.sprow { border-color: transparent; background: var(--st-fill); box-shadow: none; }
:root[data-style="studio"] .run-btn { border-radius: 999px; }

:root[data-style="studio"] img.logo.custom { border-color: var(--line); }
/* the wheel: plain bubbles with clear icons (the gold icons on the pale bubbles were hard to read in dark mode) */
:root[data-style="studio"][data-style] .twheel .wb:not(.top) { background: #ffffff; border-color: rgba(0, 0, 0, .06); color: var(--accent); box-shadow: 0 2px 10px rgba(0, 0, 0, .18); }
:root[data-style="studio"][data-style][data-theme="dark"] .twheel .wb:not(.top) { background: #2c2c2e; border-color: rgba(255, 255, 255, .14); color: #f5f5f7; box-shadow: 0 2px 10px rgba(0, 0, 0, .5); }
/* Settings: the two style cards */
.stylerow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stybtn { display: grid; gap: 6px; padding: 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); font-size: 13px; font-weight: 600; text-align: center; }
.stybtn.on { border: 2px solid var(--accent); padding: 7px; }
.stybtn .sty-pv { display: grid; gap: 4px; height: 58px; padding: 7px; border-radius: 8px; align-content: start; text-align: left; overflow: hidden; }
.stybtn .sty-pv b { font-size: 13px; line-height: 1; }
.stybtn .sty-pv i { display: block; height: 14px; width: 62%; border-radius: 4px; }
.stybtn .sty-pv i + i { width: 40%; }
.sty-go .sty-pv { background: #eef1f5; border: 1px solid #d3dae3; }
.sty-go .sty-pv b { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .08em; color: #14284b; }
.sty-go .sty-pv i { background: #d8b072; border-radius: 3px; }
.sty-go .sty-pv i + i { background: #14284b; }
.sty-studio .sty-pv { background: #f5f5f7; }
.sty-studio .sty-pv b { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; font-weight: 700; letter-spacing: -.02em; color: #1d1d1f; }
.sty-studio .sty-pv i { background: #ffffff; border-radius: 6px; box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }
.sty-studio .sty-pv i + i { background: #1d1d1f; border-radius: 999px; box-shadow: none; }

/* Ver 0.3q.23: Me page My week as a calendar (last, this and next week; this week in full colour) */
.me-cal { padding: 14px; }
.mc-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.mc-top b { font-size: 20px; font-weight: 700; } .mc-top small { font-size: 13px; color: var(--muted); }
.mc-wk { display: grid; grid-template-columns: repeat(7, 1fr); padding-bottom: 6px; margin-bottom: 4px; border-bottom: .5px solid var(--line); }
.mc-wk span { text-align: center; font-size: 11px; font-weight: 600; color: var(--muted); }
.mc-grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 2px; }
.mc-c { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; padding: 5px 0 6px; border: 0; border-radius: 10px; background: none; color: var(--ink); font: inherit; cursor: pointer; }

.mc-c.cur:first-child, .mc-grid > .mc-c.cur:nth-child(8) { border-radius: 10px 0 0 10px; }
.mc-grid > .mc-c.cur:nth-child(n+8):nth-child(-n+14) { border-radius: 0; }
.mc-grid > .mc-c.cur:nth-child(8) { border-radius: 10px 0 0 10px; } .mc-grid > .mc-c.cur:nth-child(14) { border-radius: 0 10px 10px 0; }
.mc-c.off { opacity: .38; }
.mc-c:active { background: rgba(120,120,128,.14); }
.mc-n { font-style: normal; font-size: 15px; font-weight: 500; width: 24px; height: 24px; line-height: 24px; text-align: center; border-radius: 50%; }
.mc-c.td .mc-n { background: #ff3b30; color: #fff; font-weight: 600; }
.mc-ic { color: var(--muted); }
.mc-rest { height: 26px; line-height: 26px; font-size: 11px; color: var(--muted); }
.mc-cp { display: inline-grid; place-items: center; min-width: 20px; height: 16px; padding: 0 4px; border-radius: 8px; font-style: normal; font-size: 11px; font-weight: 700; line-height: 1; }
.mc-cp.c-high { background: rgba(var(--gold-rgb), .35); color: var(--ink); } .mc-cp.c-mid { background: rgba(120,120,128,.18); color: var(--ink); } .mc-cp.c-low { background: rgba(52,162,106,.2); color: var(--ink); }
.mc-key { display: flex; align-items: center; margin: 10px 2px 0; color: var(--muted); }
.mc-key span { display: inline-flex; align-items: center; gap: 3px; } .mc-key .mc-ic { width: 16px; height: 16px; }
.mc-foot { margin: 8px 2px 4px; font-size: 13px; color: var(--muted); }
.me-cal .wb-tg { margin-top: 10px; }

/* Ver 0.3q.23b: the on pills are gold in light and dark */

 :root[data-theme="dark"] .wb-tg .wb-tgb.on svg { color: var(--gold); }
.mc-key { flex-wrap: nowrap; gap: 10px; font-size: 11px; white-space: nowrap; overflow: hidden; }
.mc-c.cur { background: rgba(var(--gold-rgb), .16); }

/* Ver 0.3q.24: real gold (the palette's own --pal-g; Studio remaps --gold) for the on pills and this week's band */
.wb-tg .wb-tgb.on { border-color: transparent; background: rgba(var(--pal-g-rgb, var(--gold-rgb)), .3); color: var(--ink); }
.wb-tg .wb-tgb.on svg { color: var(--pal-g, var(--gold)); }
:root[data-theme="dark"] .wb-tg .wb-tgb.on { background: rgba(var(--pal-g-rgb, var(--gold-rgb)), .22); color: var(--pal-g, var(--gold)); }
.mc-grid .mc-c.cur { background: rgba(var(--pal-g-rgb, var(--gold-rgb)), .2); }
.mc-c .mc-cp.c-high { background: rgba(var(--pal-g-rgb, var(--gold-rgb)), .45); }
.wb-title.real { margin: 6px 0 10px; }
.wb-pname { width: 100%; border: 0; border-bottom: 1px dashed transparent; background: none; color: var(--ink); font-size: 28px; font-weight: 700; line-height: 1.2; font-family: inherit; letter-spacing: -.02em; padding: 2px 4px; }
.wb-pname:focus { outline: none; border-bottom-color: var(--line); }
/* Ver 0.3r.9: workday name field in the Edit workday / Pick exercises sheet */
.wb-dn { display: flex; align-items: center; gap: 10px; margin: 10px 0 4px; padding: 0 12px; min-height: 46px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }

.wb-th { flex: none; border-radius: 8px; overflow: hidden; display: grid; place-items: center; background: #fff; color: var(--muted); box-shadow: 0 0 0 1px var(--line); }   /* 0.3r.10 */
.wb-th img { width: 100%; height: 100%; object-fit: cover; display: block; }
:root[data-theme="dark"] .wb-th:not(:has(img)) { background: var(--surface); }

.wb-pk { display: flex; gap: 10px; overflow-x: auto; margin: 8px -18px 4px; padding: 6px 18px 4px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }

.wb-pk-i { position: relative; flex: none; width: 84px; display: grid; gap: 5px; padding: 0; border: 0; background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.wb-pk-i .wb-th { width: 84px; height: 58px; border-radius: 10px; }

.wb-pk-x { position: absolute; top: -5px; right: -5px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); box-shadow: 0 0 0 1px var(--line), 0 1px 3px rgba(0,0,0,.15); }
.wb-pk-x::before, .wb-pk-x::after { content: ""; position: absolute; left: 6px; top: 9.25px; width: 8px; height: 1.5px; border-radius: 1px; background: var(--muted); transform: rotate(45deg); }

/* Ver 0.3q.25: body type pictures */
.so-opts { padding: 14px 0 6px; }

/* Ver 0.3q.28: compact Today cards (closed): one row with a small picture, name / tag / last line, and the button on the right */
#view .card.closed[data-id] { display: grid; grid-template-areas: "tabs tabs tabs" "pic head btn" "pic last btn"; column-gap: 12px; row-gap: 0; align-items: center; padding: 8px 10px 8px 8px; min-height: 0; }

/* Ver 0.3q.31: every closed Today card is the same size (the warm-up card too); the button column has one width, the
   finished / entered tag sits under the button on two short lines, and tcFit() gives text that does not fit a smaller font */

/* Ver 0.3r.55 (user: "use the dark tone colour as background and the other colour as front colour, e.g. black and orange:
   orange for buttons, black the background; in light mode a light grey"). Studio light: buttons, switches, rings and
   chosen chips take the theme's LIGHT colour (deepened a little toward the dark one so pale ones still show), with dark
   text on them. Studio dark: the page and cards are a deep shade of the theme's dark colour instead of plain black. */
:root[data-style="studio"][data-style]:not([data-theme="dark"]) {
  --acc-l: color-mix(in srgb, var(--pal-g) 86%, var(--pal-b));
  --brand: var(--acc-l); --brand-rgb: var(--pal-g-rgb);   /* filled pills that used the dark colour (timer 2:00, chosen chips) */
  --gold: var(--acc-l); --gold-rgb: var(--pal-g-rgb); --gold-ink: #111111; --on-acc: #111111;
  --gold-hi: color-mix(in srgb, var(--pal-g) 40%, #ffffff);
  --accent: var(--acc-l); --accent-ink: #111111; --accent-soft: color-mix(in srgb, var(--pal-g) 22%, #ffffff);
}
:root[data-style="studio"][data-style][data-theme="dark"] {
  --bg: color-mix(in srgb, var(--pal-b) 45%, #000000); --surface: color-mix(in srgb, var(--pal-b) 32%, #1c1c1e);
  --line: color-mix(in srgb, var(--pal-b) 30%, #3a3a3c);
}
/* softer plain buttons: clearly tinted with the dark colour (user: yes, more navy) */

   the purple theme should look purple-ish): one hand-picked page colour per theme for light (--pg-l) and dark (--pg-d) */
:root[data-pal="navy"] { --pg-l: #e8edf5; --pg-d: #0a1428; }
:root[data-pal="ember"] { --pg-l: #efebe7; --pg-d: #131110; }
:root[data-pal="blush"] { --pg-l: #f9e9ee; --pg-d: #1d1217; }
:root[data-pal="crimson"] { --pg-l: #f6e7e6; --pg-d: #1f0d0f; }
:root[data-pal="steel"] { --pg-l: #e6e8ec; --pg-d: #0e0f11; }
:root[data-pal="forest"] { --pg-l: #e6f1e9; --pg-d: #0b170f; }
:root[data-pal="violet"] { --pg-l: #ece7fb; --pg-d: #151129; }
:root[data-pal="bgold"] { --pg-l: #f1eee8; --pg-d: #12110e; }
:root[data-style][data-style][data-style]:not([data-theme="dark"]) { --bg: var(--pg-l, #f2f2f4); }

   headings and the greeting take the dark colour (front colour in dark mode), cards carry a thin front-colour line on top,

// The page itself is loaded from GitHub on every open, so one push there updates this app too (user, 2026-11-01).
// If GitHub cannot be reached or sends something unexpected, the built-in copy (the index file in this project) is used.
const PAGE_URL = 'https://sqiangqi.github.io/workout-lite/lite.html';
function doGet() {
  let page = '', src = 'backup';
  try {
    const r = UrlFetchApp.fetch(PAGE_URL + '?t=' + Date.now(), { muteHttpExceptions: true, followRedirects: true });
    const t = r.getResponseCode() === 200 ? r.getContentText('UTF-8') : '';
    if (t.indexOf('google.script.run') > 0 && t.indexOf('</html>') > 0) { page = t; src = 'github'; }
  } catch (e) { /* use the built-in copy */ }
  if (!page) page = HtmlService.createHtmlOutputFromFile('index').getContent();
  page = page.replace('</head>', '<script>window.__liteSrc = "' + src + '";<\/script></head>');
  return HtmlService.createHtmlOutput(page)
    .setTitle(APP_NAME)
    .addMetaTag('viewport', 'width=device-width, initial-scale=1, viewport-fit=cover')
    .addMetaTag('apple-mobile-web-app-capable', 'yes');
}

// ---------- settings (per person) ----------
function cfg_() {
  const raw = PropertiesService.getUserProperties().getProperty('cfg');
  return raw ? JSON.parse(raw) : null;
}
function setCfg_(c) { PropertiesService.getUserProperties().setProperty('cfg', JSON.stringify(c)); }
function me_() { try { return Session.getActiveUser().getEmail(); } catch (e) { return ''; } }
// The owner sees the exercise notes (Lite 0.1f). Only a SHA-256 of the owner's email is kept here, because this code is also published on GitHub.
const OWNER_HASH = '0a341e799ef967f954cbf992684ee78c06c9f9897f3f3fab38a046f7836f66db';
function owner_() {
  try {
    const b = Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, String(me_()).trim().toLowerCase(), Utilities.Charset.UTF_8);
    return b.map(x => ('0' + ((x + 256) % 256).toString(16)).slice(-2)).join('') === OWNER_HASH;
  } catch (e) { return false; }
}

function openLog_() {
  const c = cfg_();
  if (!c) throw new Error('No workout Sheet is set up yet.');
  let ss;
  try { ss = SpreadsheetApp.openById(c.sheetId); }
  catch (e) { throw new Error('Could not open your workout Sheet as ' + me_() + ' (' + e.message + ').'); }
  const sh = ss.getSheetByName(c.tab);
  if (!sh) throw new Error('The tab "' + c.tab + '" is missing from your workout Sheet.');
  return { ss: ss, sh: sh, c: c };
}

// Rows J2:M as shown in the sheet, with trailing empty rows dropped. n = 0 reads all.
function readArchive_(sh, n) {
  const last = sh.getLastRow();
  let rows = Math.max(last - 1, 0);
  if (n) rows = Math.min(n, rows);
  if (rows <= 0) return [];
  const v = sh.getRange(2, ARCHIVE_COL, rows, 4).getDisplayValues();
  while (v.length && v[v.length - 1].join('') === '') v.pop();
  return v;
}
function readExercises_(ss) {
  const sh = ss.getSheetByName(EX_TAB);
  if (!sh) throw new Error('The Exercises tab is missing from your workout Sheet.');
  const last = Math.max(sh.getLastRow(), 2);
  return sh.getRange(2, 1, last - 1, 6).getDisplayValues();   // A to F (F = Unit)
}

// First call from the page: who is signed in, their settings, and their data.

// ---------- save a session (same rules as the Sheet's tick-box script and the claude.ai app) ----------
function pad2_(n) { return ('0' + n).slice(-2); }
function parseUS_(s) { const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(s).trim()); return m ? m[3] + '-' + pad2_(m[1]) + '-' + pad2_(m[2]) : null; }
function keyOfIso_(iso) { return iso.replace(/-/g, ''); }
function usOf_(iso) { const p = iso.split('-').map(Number); return p[1] + '/' + p[2] + '/' + p[0]; }
function unitOf_(name, units) {
  if (units && units[name]) return units[name];
  if (/warm.?up/i.test(name)) return 'mins'; if (/battle ropes/i.test(name)) return 'seconds'; return 'lbs';
}
function units_(exRows) {
  const map = {};
  exRows.forEach(r => { const name = String(r[2]).trim().replace(/^\d+ /, ''), u = String(r[5] || '').trim().toLowerCase(); if (name && UNITS.indexOf(u) >= 0 && !map[name]) map[name] = u; });
  return map;
}
function dupKey_(name, w, r) {
  const ws = String(w == null ? '' : w).trim();
  const wn = ws !== '' && !isNaN(+ws) ? String(+ws) : ws;
  return String(name).trim().replace(/^\d+ /, '') + '|' + wn + '|' + String(r == null ? '' : r).trim().replace(/\//g, '');
}
function kinds_(exRows) {
  const map = {};
  exRows.forEach(r => {
    const cat = String(r[1]), name = String(r[2]).trim().replace(/^\d+ /, ''); if (!name) return;   // 0.2c: names without plan numbers
    let k = 'N'; if (/push|pull/i.test(cat)) k = 'U'; else if (/legs/i.test(cat)) k = 'L';
    if (!map[name] || map[name] === 'N') map[name] = k;
  });
  return map;
}
// rows: archive rows (strings); entries: [{name, w, r}]; iso: session date. Returns {out, added}.
function merge_(rows, entries, iso, kinds, units) {
  const kindOf = n => kinds[n] || 'N';
  const key = keyOfIso_(iso), dateText = usOf_(iso);
  const isHeader = r => r[0] === UPPER || r[0] === LOWER;
  const keyOf = r => { const i = parseUS_(r[2]); return i ? keyOfIso_(i) : ''; };
  const upper = [], lower = [];
  let start = -1, end = -1;
  for (let i = 0; i < rows.length; i++) if (isHeader(rows[i]) && keyOf(rows[i]) === key) { start = i; break; }
  if (start >= 0) {
    end = rows.length - 1; let kind = 'U';
    for (let i = start; i < rows.length; i++) {
      const r = rows[i];
      if (r[0] === END) { end = i; break; }
      if (isHeader(r)) { if (keyOf(r) !== key) { end = i - 1; break; } kind = r[0] === UPPER ? 'U' : 'L'; continue; }
      if (r.join('') === '') continue;
      (kind === 'U' ? upper : lower).push(r);
    }
    const have = {};
    upper.concat(lower).forEach(r => { const k = dupKey_(r[0], r[1], r[3]); have[k] = (have[k] || 0) + 1; });
    entries = entries.filter(e => { const k = dupKey_(e.name, e.w, e.r); if (have[k]) { have[k]--; return false; } return true; });
  }
  const added = entries.length;
  const hasU = upper.length > 0 || entries.some(e => kindOf(e.name) === 'U');
  const hasL = lower.length > 0 || entries.some(e => kindOf(e.name) === 'L');
  const neutralTo = (hasU || !hasL) ? 'U' : 'L';
  entries.forEach(e => { let k = kindOf(e.name); if (k === 'N') k = neutralTo; (k === 'U' ? upper : lower).push([e.name, e.w, unitOf_(e.name, units), e.r]); });
  const block = [];
  if (upper.length) { block.push([UPPER, '', dateText, '']); upper.forEach(r => block.push(r)); }
  if (lower.length) { block.push([LOWER, '', dateText, '']); lower.forEach(r => block.push(r)); }
  block.push([END, '', LINE, '']);
  let out;
  if (start >= 0) out = rows.slice(0, start).concat(block, rows.slice(end + 1));
  else {
    let at = rows.length;
    for (let i = 0; i < rows.length; i++) { const k = isHeader(rows[i]) ? keyOf(rows[i]) : ''; if (k !== '' && k < key) { at = i; break; } }
    out = rows.slice(0, at).concat(block, rows.slice(at));
  }
  return { out: out, added: added };
}
// A row written back to the sheet: weights as numbers, reps with anything but digits kept as text.
function cell_(r) {
  const k = String(r[1]).trim(), m = String(r[3]).trim();
  return [String(r[0]),
    k === '' || !isNaN(+k) ? k : "'" + k,
    String(r[2]),
    m === '' || /^\d+$/.test(m) ? m : "'" + m];
}
// entries: [{name, w, r}] built by the page; iso: 'YYYY-MM-DD'.
// Only the archive cells J:M are moved (insert cells, shift down); A:I and everything else stay where they are.
function api_save(entries, iso) {
  if (!Array.isArray(entries) || !entries.length) throw new Error('Nothing to save.');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) throw new Error('Bad session date.');
  entries = entries.map(e => ({ name: String(e.name).trim(), w: String(e.w == null ? '' : e.w).trim(), r: String(e.r == null ? '' : e.r).trim() }))
    .filter(e => e.name && !NOT_EX.test(e.name));
  const lock = LockService.getUserLock();
  if (!lock.tryLock(20000)) throw new Error('Another save is still running. Try again in a moment.');
  try {
    const L = openLog_(), sh = L.sh, exRows = readExercises_(L.ss), kinds = kinds_(exRows), units = units_(exRows);
    const HEAD = 300, SENT = ['\u0000more', '', '', ''];
    const plan = (rows, full) => {
      let lead = 0; while (lead < rows.length && rows[lead].join('') === '') lead++;   // blank cells left by an interrupted save
      // when only the top was read, a marker row stands for "the rest of the archive"
      const core = rows.slice(lead).concat(full ? [] : [SENT]), M = merge_(core, entries, iso, kinds, units), out = M.out;
      let m = 0; while (m < core.length && m < out.length && core[core.length - 1 - m].join('\u0001') === out[out.length - 1 - m].join('\u0001')) m++;
      return { out: out, m: m, oldN: core.length + lead - m, newN: out.length - m, added: M.added };
    };
    let rows = readArchive_(sh, HEAD), full = rows.length < HEAD, P = plan(rows, full);
    if (!full && P.m === 0 && P.added) { rows = readArchive_(sh, 0); full = true; P = plan(rows, true); }
    const skipped = entries.length - P.added;
    if (!P.added) return { added: 0, skipped: skipped, ok: true };
    const top = P.out.slice(0, P.newN);
    if (top.some(r => r === SENT)) throw new Error('Could not place the session in the archive. Nothing was written.');
    const delta = P.newN - P.oldN;
    if (delta > 0) sh.getRange(2, ARCHIVE_COL, delta, 4).insertCells(SpreadsheetApp.Dimension.ROWS);
    if (delta < 0) sh.getRange(2, ARCHIVE_COL, -delta, 4).deleteCells(SpreadsheetApp.Dimension.ROWS);
    if (top.length) sh.getRange(2, ARCHIVE_COL, top.length, 4).setValues(top.map(cell_));
    SpreadsheetApp.flush();
    const back = readArchive_(sh, P.newN + 1);
    const want = P.out.slice(0, P.newN + 1).filter(r => r !== SENT);
    const ok = want.every((r, i) => (back[i] || [])[0] === r[0]);
    return { added: P.added, skipped: skipped, ok: ok };
  } finally {
    lock.releaseLock();
  }
}

// ---------- add an exercise (Library tab) ----------
// row = ['', category, full name, muscle, notes, unit] checked by the page; full = name with any plan number.
// Same place rules as the full app: after the last exercise with the same plan number; a new number after the last
// numbered exercise; no number at the end of the exercises, above End Workout. Formatting copied from the nearest row
// with the same category.
function prefix_(name) { const m = /^(\d+) /.exec(String(name)); return m ? m[1] : ''; }
function api_addExercise(row, full) {
  if (!Array.isArray(row) || row.length < 6) throw new Error('Bad exercise data.');
  full = String(full || '').trim();
  const cat = String(row[1]), unit = String(row[5]);
  if (!full || CATS.indexOf(cat) < 0 || UNITS.indexOf(unit) < 0) throw new Error('Name, category and unit are needed.');
  const lock = LockService.getUserLock();
  if (!lock.tryLock(20000)) throw new Error('Another change is still running. Try again in a moment.');
  try {
    const L = openLog_(), sh = L.ss.getSheetByName(EX_TAB);
    const rows = readExercises_(L.ss);
    const bare = full.replace(/^\d+ /, '').toLowerCase();
    if (rows.some(r => String(r[2]).trim().replace(/^\d+ /, '').toLowerCase() === bare)) throw new Error('That exercise is already in the Exercises tab.');
    const nm = r => String((r && r[2]) || '').trim(), pre = prefix_(full);
    let at = -1;
    if (pre) {
      rows.forEach((r, i) => { if (prefix_(nm(r)) === pre) at = i + 1; });
      if (at < 0) rows.forEach((r, i) => { if (prefix_(nm(r))) at = i + 1; });
    }
    if (at < 0) {
      const end = rows.findIndex(r => /^end workout$/i.test(nm(r)));
      at = end >= 0 ? end : rows.length;
      while (at > 0 && !(rows[at - 1] || []).join('').trim()) at--;
    }
    let src = -1, dist = 1e9;
    rows.forEach((r, i) => { if (String(r[1] || '').trim().toLowerCase() === cat && Math.abs(i - at) < dist) { src = i; dist = Math.abs(i - at); } });
    const sheetRow = at + 2;
    sh.insertRowBefore(sheetRow);
    if (src >= 0) { const sr = (src >= at ? src + 1 : src) + 2; sh.getRange(sr, 1, 1, 6).copyTo(sh.getRange(sheetRow, 1, 1, 6), SpreadsheetApp.CopyPasteType.PASTE_FORMAT, false); }
    sh.getRange(sheetRow, 1, 1, 6).setValues([[ '', cat, full, String(row[3] || ''), String(row[4] || ''), unit ]]);
    SpreadsheetApp.flush();
    if (String(sh.getRange(sheetRow, 3).getDisplayValue()).trim() !== full) throw new Error('The new row did not read back as expected. Please look at the Exercises tab.');
    return { row: sheetRow };
  } finally {
    lock.releaseLock();
  }
}

// ---------- week plans and stars (Plan tab, Lite 0.1f; same layout as the full app) ----------
// A:K = Log tab | Kind (plan / day / ex / fav) | Plan ID | Plan name | Active | Warm-up | Day | Day type | Order | Exercise | Updated.
// Each person's rows are labelled with their log tab, so plans and stars stay separate; only those rows are rewritten.
const PLAN_TAB = 'Plan';
const PLAN_HEAD = ['Log tab', 'Kind', 'Plan ID', 'Plan name', 'Active', 'Warm-up', 'Day', 'Day type', 'Order', 'Exercise', 'Updated'];
function pad11_(r) { const o = []; for (let i = 0; i < 11; i++) o.push(r && r[i] != null ? String(r[i]) : ''); return o; }
function planRowsOf_(sh) {
  const n = sh.getLastRow(); if (n < 2) return [];
  const v = sh.getRange(2, 1, n - 1, 11).getDisplayValues();
  while (v.length && v[v.length - 1].join('') === '') v.pop();
  return v;
}
function api_plansGet() {
  const L = openLog_(), sh = L.ss.getSheetByName(PLAN_TAB);
  return { tab: L.c.tab, rows: sh ? planRowsOf_(sh).filter(r => r[0] === L.c.tab) : [] };
}
function api_plansSave(mine) {
  if (!Array.isArray(mine)) throw new Error('Bad plan data.');
  const lock = LockService.getUserLock();
  if (!lock.tryLock(20000)) throw new Error('Another change is still running. Try again in a moment.');
  try {
    const L = openLog_(), tab = L.c.tab;
    let sh = L.ss.getSheetByName(PLAN_TAB);
    if (!sh) {                                                  // first plan or star in this Sheet: make the Plan tab
      sh = L.ss.insertSheet(PLAN_TAB);
      sh.getRange(1, 1, 1, 11).setValues([PLAN_HEAD]).setFontWeight('bold').setBackground('#14284b').setFontColor('#ffffff');
      sh.setFrozenRows(1);
      sh.getRange(2, 1, Math.max(sh.getMaxRows() - 1, 1), 11).setNumberFormat('@');
    }
    const fresh = planRowsOf_(sh), others = fresh.filter(r => r.join('') !== '' && r[0] !== tab);
    const rows = mine.map(r => { const o = pad11_(r); o[0] = tab; return o; });
    const all = others.concat(rows);
    if (all.length > 2000) throw new Error('The Plan tab is full.');
    const n = Math.max(fresh.length, all.length);
    if (n) {
      const vals = all.concat(Array.from({ length: n - all.length }, () => pad11_([])));
      const rg = sh.getRange(2, 1, n, 11); rg.setNumberFormat('@'); rg.setValues(vals);
    }
    SpreadsheetApp.flush();
    const back = planRowsOf_(sh).filter(r => r[0] === tab);
    if (back.length !== rows.length) throw new Error('The Plan tab did not read back as expected.');
    return { ok: true };
  } finally {
    lock.releaseLock();
  }
}


// ---------- sign-in (OAuth 2.0 token by redirect: works in a Home Screen app, no pop-up) ----------
function redirectUri() { return location.origin + location.pathname; }
function takeTokenFromUrl() {
  if (!location.hash || location.hash.length < 2) return null;
  const p = new URLSearchParams(location.hash.slice(1));
  if (!p.get('access_token') && !p.get('error')) return null;
  history.replaceState(null, '', location.pathname + location.search);
  const want = ls.get(K_STATE); ls.del(K_STATE);
  if (p.get('error')) return { error: p.get('error') };
  if (!want || p.get('state') !== want) return { error: 'state_mismatch' };
  const tok = { t: p.get('access_token'), exp: Date.now() + (Number(p.get('expires_in')) || 3600) * 1000, sc: p.get('scope') || '' };
  ls.set(K_TOK, tok);
  return tok;
}
function token() { const t = ls.get(K_TOK); return t && t.exp > Date.now() + 30000 ? t.t : null; }
function minutesLeft() { const t = ls.get(K_TOK); return t ? (t.exp - Date.now()) / 60000 : 0; }
function signIn(silent) {
  const state = Math.random().toString(36).slice(2) + Date.now().toString(36);
  ls.set(K_STATE, state);
  const q = new URLSearchParams({ client_id: CLIENT_ID, redirect_uri: redirectUri(), response_type: 'token', scope: SCOPES + (ls.get(K_FULL) ? ' ' + SCOPE_SHEETS : ''),
    include_granted_scopes: 'true', state: state });
  const email = ls.get(K_EMAIL); if (email) q.set('login_hint', email); else if (!silent) q.set('prompt', 'select_account');   // after sign-out: pick an account
  if (silent) ls.set(K_BOUNCE, Date.now());
  location.assign('https://accounts.google.com/o/oauth2/v2/auth?' + q.toString());
}
// Sign out / switch account (web 0.2a, user 2026-11-07): removes this person's sign-in and every cached copy of their data from
// the phone, so the next Google account starts clean. Phone preferences (theme, chart range, plan switch, timer) are kept.
const KEEP_ON_SIGNOUT = ['wlite.theme.v1', 'wlite.pal.v1', 'wlite.setopen.v1', 'wlite.range.v1', 'wlite.showbw.v1', 'wlite.timer.v1', 'wlite.donut.v1', 'wlite.plan.v1'];
function signOut() {
  try {
    const ks = []; for (let i = 0; i < localStorage.length; i++) ks.push(localStorage.key(i));
    ks.forEach(k => { if (/^(wweb|wlite|qsapp)\./.test(k) && KEEP_ON_SIGNOUT.indexOf(k) < 0) localStorage.removeItem(k); });
  } catch (e) {}
  ls.del(K_TOK); ls.del(K_EMAIL); ls.del(K_CFG); ls.del(K_FOOD); ls.del(K_FULL); ls.del(K_FOLDER);
}
function hasScope(part) { const t = ls.get(K_TOK); return !!(t && String(t.sc || '').indexOf(part) >= 0); }
// a Sheet the app did not make needs the full Sheets permission: sign in again asking for it (Google shows its "not verified" page once)
function needFull() {
  ls.set(K_FULL, 1);

}

// ---------- Google APIs ----------
const SHEETS = 'https://sheets.googleapis.com/v4/spreadsheets/';
const DRIVE = 'https://www.googleapis.com/drive/v3/files', UPLOAD = 'https://www.googleapis.com/upload/drive/v3/files';
async function gfetch(url, opts, raw) {
  const t = token();
  if (!t) throw needSignIn('Your Google sign-in has ended (it lasts about an hour). Sign in again to keep going; your unsaved sets are kept.');
  opts = opts || {};
  const headers = Object.assign({ Authorization: 'Bearer ' + t }, opts.body && !opts.multipart ? { 'Content-Type': 'application/json' } : {}, opts.headers || {});
  let r;
  try { r = await fetch(url, Object.assign({}, opts, { headers })); }
  catch (e) { throw new Error('No connection to Google right now (network).'); }
  if (r.status === 401) { ls.del(K_TOK); throw needSignIn('Your Google sign-in has ended. Sign in again to keep going; your unsaved sets are kept.'); }
  if (!r.ok) {
    let m = r.statusText;
    try { const j = await r.json(); m = (j.error && (j.error.message || j.error)) || m; } catch (e) {}
    if (r.status === 404) m = 'Not found: ' + m;
    if (r.status === 403) m = 'No access: ' + m;
    throw new Error(m);
  }
  if (raw) return r.text();
  return r.status === 204 ? null : r.json();
}
const q1 = s => "'" + String(s).replace(/'/g, "''") + "'";
async function getVals(id, a1) {
  const j = await gfetch(SHEETS + id + '/values/' + encodeURIComponent(a1) + '?valueRenderOption=FORMATTED_VALUE&majorDimension=ROWS');
  return j.values || [];
}
async function putVals(id, a1, values) {
  return gfetch(SHEETS + id + '/values/' + encodeURIComponent(a1) + '?valueInputOption=USER_ENTERED', { method: 'PUT', body: JSON.stringify({ range: a1, majorDimension: 'ROWS', values }) });
}
async function batch(id, requests) { return gfetch(SHEETS + id + ':batchUpdate', { method: 'POST', body: JSON.stringify({ requests }) }); }
async function meta(id) { return gfetch(SHEETS + id + '?fields=properties.title,spreadsheetUrl,sheets.properties(sheetId,title)'); }
const pad = (rows, n) => rows.map(r => { const o = []; for (let i = 0; i < n; i++) o.push(r[i] == null ? '' : String(r[i])); return o; });
function trimTail(v) { while (v.length && v[v.length - 1].join('') === '') v.pop(); return v; }

// app files (config.json, food.json, draft.json) in the Workout Lite folder in My Drive (web 0.2a; before that the hidden
// hidden appDataFolder; dropped so sign-in needs only drive.file). drive.file: the app only sees what it made.
const fileIds = {}, K_FOLDER = 'wweb.folder.v1';
async function wlFolder(create) {
  const c = ls.get(K_FOLDER); if (c) return c;
  const fs = await gfetch(DRIVE + '?fields=files(id)&orderBy=createdTime&pageSize=10&q=' + encodeURIComponent("name = '" + APP_NAME + "' and mimeType = 'application/vnd.google-apps.folder' and 'root' in parents and trashed = false"));
  let id = ((fs.files || [])[0] || {}).id || '';
  if (!id && create) id = (await gfetch(DRIVE + '?fields=id', { method: 'POST', body: JSON.stringify({ name: APP_NAME, mimeType: 'application/vnd.google-apps.folder', parents: ['root'] }) })).id;
  if (id) ls.set(K_FOLDER, id);
  return id;
}
async function appFind(name, create) {
  if (fileIds[name]) return fileIds[name];
  const folder = await wlFolder(create); if (!folder) return null;
  const j = await gfetch(DRIVE + '?fields=files(id,name)&pageSize=10&q=' + encodeURIComponent("name='" + name + "' and '" + folder + "' in parents and trashed=false"));
  const f = (j.files || [])[0]; if (f) fileIds[name] = f.id; return f ? f.id : null;
}
async function appRead(name) { const id = await appFind(name); return id ? gfetch(DRIVE + '/' + id + '?alt=media', {}, true) : ''; }
async function appWrite(name, text) {
  const id = await appFind(name, true);
  if (id) return gfetch(UPLOAD + '/' + id + '?uploadType=media', { method: 'PATCH', body: text, headers: { 'Content-Type': 'application/json' }, multipart: true });
  const b = 'wweb' + Date.now();
  const body = '--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify({ name, parents: [await wlFolder(true)] }) +
    '\r\n--' + b + '\r\nContent-Type: application/json\r\n\r\n' + text + '\r\n--' + b + '--';
  const j = await gfetch(UPLOAD + '?uploadType=multipart&fields=id', { method: 'POST', body, multipart: true, headers: { 'Content-Type': 'multipart/related; boundary=' + b } });
  fileIds[name] = j.id; return j;
}
// web 0.2d: own app icon, 'app icon.jpg' in the Workout Lite folder
const ICON_NAME = 'app icon.jpg';
async function iconList() {
  const folder = await wlFolder(false); if (!folder) return [];
  const j = await gfetch(DRIVE + '?fields=files(id,modifiedTime)&orderBy=modifiedTime desc&pageSize=10&q=' + encodeURIComponent("name='" + ICON_NAME + "' and '" + folder + "' in parents and trashed=false"));
  return j.files || [];
}
async function api_iconGet(have) {
  const f = (await iconList())[0]; if (!f) return null;
  if (have && have === f.id) return { id: f.id, same: true };
  let r; try { r = await fetch(DRIVE + '/' + f.id + '?alt=media', { headers: { Authorization: 'Bearer ' + token() } }); } catch (e) { throw new Error('No connection to Google right now (network).'); }
  if (!r.ok) throw new Error('The icon could not be read from Drive.');
  const blob = await r.blob();
  const data = await new Promise((ok, no) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = () => no(new Error('The icon could not be read.')); fr.readAsDataURL(blob); });
  return { id: f.id, data: String(data).replace(/^data:[^;,]*/, 'data:image/jpeg') };
}
async function api_iconSet(b64) {
  const old = await iconList(), b = 'wweb' + Date.now();
  const body = '--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify({ name: ICON_NAME, mimeType: 'image/jpeg', parents: [await wlFolder(true)] }) +
    '\r\n--' + b + '\r\nContent-Type: image/jpeg\r\nContent-Transfer-Encoding: base64\r\n\r\n' + b64 + '\r\n--' + b + '--';
  const j = await gfetch(UPLOAD + '?uploadType=multipart&fields=id', { method: 'POST', body, multipart: true, headers: { 'Content-Type': 'multipart/related; boundary=' + b } });
  for (const f of old) { try { await gfetch(DRIVE + '/' + f.id, { method: 'DELETE' }); } catch (e) {} }
  return { id: j.id };
}
async function api_iconDel() { for (const f of await iconList()) await gfetch(DRIVE + '/' + f.id, { method: 'DELETE' }); return true; }
async function appDelete(name) { const id = await appFind(name); if (id) { await gfetch(DRIVE + '/' + id, { method: 'DELETE' }); delete fileIds[name]; } }

async function cfgGet() {
  const c = ls.get(K_CFG); if (c) return c;
  const txt = await appRead('config.json');
  try { const v = txt && JSON.parse(txt); if (v && v.sheetId) { ls.set(K_CFG, v); return v; } } catch (e) {}
  const f = await findAcct();   // e.g. config.json removed by hand: the folder's own log Sheet is enough
  if (f.logOk) { const v = { sheetId: f.sheet, tab: NEW_LOG_TAB, folder: f.folder }; await cfgSet(v); return v; }
  return null;
}
async function cfgSet(c) { ls.set(K_CFG, c); await appWrite('config.json', JSON.stringify(c)); }
async function whoAmI() {
  try { const j = await gfetch('https://openidconnect.googleapis.com/v1/userinfo'); if (j && j.email) { ls.set(K_EMAIL, j.email); return j.email; } } catch (e) { if (e.signin) throw e; }
  return ls.get(K_EMAIL) || '';
}
async function openLogW() {
  const c = await cfgGet();
  if (!c) throw new Error('No workout Sheet is set up yet.');
  if (!c.folder && !hasScope(SCOPE_SHEETS)) throw needFull();   // web 0.2a: own Sheet, not made by the app
  let m;
  try { m = await meta(c.sheetId); }
  catch (e) { if (e.signin) throw e; throw new Error('Could not open your workout Sheet (' + e.message + ').'); }
  const tabs = {}; (m.sheets || []).forEach(s => { tabs[s.properties.title] = s.properties.sheetId; });
  if (!(c.tab in tabs)) throw new Error('The tab "' + c.tab + '" is missing from your workout Sheet.');
  if (!(EX_TAB in tabs)) throw new Error('The Exercises tab is missing from your workout Sheet.');
  return { c, m, tabs, id: c.sheetId };
}

async function readArchW(id, tab, n) { return trimTail(pad(await getVals(id, q1(tab) + '!J2:M' + (n ? n + 1 : '')), 4)); }
